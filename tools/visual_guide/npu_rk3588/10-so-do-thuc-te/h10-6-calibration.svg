<text x="10" y="390" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">3. npy: layout và kích thước</text>
<rect x="10" y="404" width="285" height="82" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="419" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">npy NCHW float32 và uint8 [1,3,64,64]</text>
<text x="20" y="436" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">npy [3,64,64]</text>
<text x="20" y="453" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">npy NHWC [1,64,64,3]</text>
<text x="20" y="470" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">npy [1,3,32,32]</text>
<rect x="335" y="404" width="255" height="82" rx="4" fill="#E8F4EA" stroke="#333333" stroke-width="1.2"/>
<text x="345" y="419" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">-100 / 0</text>
<text x="345" y="436" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">-100 / 0</text>
<text x="345" y="453" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">ValueError: shape wrong, expect nchw</text>
<text x="345" y="470" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">ValueError: cùng dạng thông báo</text>
<rect x="640" y="404" width="250" height="82" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="650" y="419" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Chấp nhận</text>
<text x="650" y="436" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Chấp nhận (không có chiều batch)</text>
<text x="650" y="453" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Từ chối</text>
<text x="650" y="470" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Không tự resize npy</text>
<path d="M295 445 L335 445" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<path d="M590 445 L640 445" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="10" y="510" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">4. mean và std với npy</text>
<rect x="10" y="524" width="285" height="48" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="539" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">npy giá trị 150 đến 250, mean=250 std=2; đối</text>
<text x="20" y="556" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">chứng: cùng npy, mean=0 std=1</text>
<rect x="335" y="524" width="255" height="48" rx="4" fill="#E8F4EA" stroke="#333333" stroke-width="1.2"/>
<text x="345" y="539" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">mean=250 std=2: -50 / 0</text>
<text x="345" y="556" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">mean=0 std=1: 150 / 250</text>
<rect x="640" y="524" width="250" height="48" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="650" y="539" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">mean và std được áp dụng lên npy; Xác</text>
<text x="650" y="556" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">nhận đọc đúng</text>
<path d="M295 548 L335 548" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<path d="M590 548 L640 548" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="10" y="596" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">5. Tên quantized_dtype cũ</text>
<rect x="10" y="610" width="285" height="82" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="625" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">w8a8 so với asymmetric_quantized-8</text>
<rect x="335" y="610" width="255" height="82" rx="4" fill="#E8F4EA" stroke="#333333" stroke-width="1.2"/>
<text x="345" y="625" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">cùng quant_tab (-99 / 0, asym, layer)</text>
<rect x="640" y="610" width="250" height="82" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="650" y="625" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">config() chấp nhận tên cũ; kết quả</text>
<text x="650" y="642" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">giống w8a8 trên model này. Chấp nhận ở</text>
<text x="650" y="659" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">config() chưa chứng minh phần cứng hỗ</text>
<text x="650" y="676" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">trợ.</text>
<path d="M295 651 L335 651" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<path d="M590 651 L640 651" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="10" y="708" width="880" height="80" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="722.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Thuật toán nội suy chính xác (bilinear, area, antialias) (chỉ loại được nearest);</tspan></text>
<text x="20" y="739.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>Cách xử lý ảnh RGB/BGR, ảnh xám, ảnh có alpha;</tspan></text>
<text x="20" y="756.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>Model NHWC (tflite) có chấp nhận npy NHWC không; Ảnh calibration và npy có cho cùng kết quả trên model thật;</tspan></text>
<text x="20" y="773.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>Ảnh hưởng lên độ chính xác sau lượng tử; Hành vi trên toolkit phiên bản khác.</tspan></text>
