<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 916" width="900" height="916" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="916" fill="white"/>
<rect x="808" y="8" width="51" height="22" rx="11" fill="white" stroke="#C62828" stroke-width="1.8"/>
<text x="833.5" y="19.5" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">T3 đo</text>
<text x="10" y="44" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Model thử: </tspan><tspan>ONNX một Conv 1x1 đồng nhất, input NCHW [1,3,64,64]; toolkit 2.3.2, PC, không board; đọc min và max của tensor x từ quant_tab trong file .rknn.</tspan></text>
<text x="10" y="64" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Ảnh dùng là gradient 150 đến 250; mean=250, std=1, nên dải kỳ vọng sau chuẩn hóa là [-100, 0].</tspan></text>
<text x="152.5" y="90" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">Ta đưa vào</text>
<text x="462.5" y="90" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">Đọc được (min / max)</text>
<text x="765.0" y="90" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">Suy ra</text>
<text x="10" y="114" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. Ảnh khác kích thước model</text>
<rect x="10" y="128" width="285" height="100" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="143" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">jpg và png 128x64 (rộng);</text>
<text x="20" y="160" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">jpg 64x128 (cao); mean=250,</text>
<text x="20" y="177" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">std=1</text>
<rect x="335" y="128" width="255" height="100" rx="4" fill="#E8F4EA" stroke="#333333" stroke-width="1.2"/>
<text x="345" y="143" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">ảnh rộng: -99 / 0</text>
<text x="345" y="160" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">ảnh cao: -99 / 0</text>
<text x="345" y="177" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">đối chứng 64x64: -100 / 0</text>
<rect x="640" y="128" width="250" height="100" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="650" y="143" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Toàn ảnh được dùng, không cắt, không</text>
<text x="650" y="160" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">đệm</text>
