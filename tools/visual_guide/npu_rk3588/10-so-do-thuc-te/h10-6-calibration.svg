<text x="224" y="200" font-size="11" font-weight="400" fill="#444444" text-anchor="end" dominant-baseline="central" font-style="italic">(minh họa)</text>
<text x="10" y="252" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Nội suy khi đổi kích thước</text>
<rect x="10" y="266" width="285" height="100" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="281" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">png 128x64, cột xen kẽ 150</text>
<text x="20" y="298" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">và 250</text>
<rect x="335" y="266" width="255" height="100" rx="4" fill="#E8F4EA" stroke="#333333" stroke-width="1.2"/>
<text x="345" y="281" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">-50 / -50</text>
<rect x="640" y="266" width="250" height="100" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="650" y="281" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Hai cột kề nhau được lấy trung bình:</text>
<text x="650" y="298" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(150 + 250) / 2 = 200, trừ mean 250 ra</text>
<text x="650" y="315" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">-50; nearest sẽ cho -100 hoặc 0</text>
