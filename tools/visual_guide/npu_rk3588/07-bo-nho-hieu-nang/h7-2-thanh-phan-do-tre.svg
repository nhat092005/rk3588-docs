<text x="22" y="746.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Hai cặp cho chiều chênh lệch khác nhau: tổng debug không phải độ trễ để báo cáo, chỉ để tìm lớp tốn thời gian.</tspan></text>
