<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="486" fill="white"/>
<rect x="770" y="10" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="810.3" y="21.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="10" y="48" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Kiểu dữ liệu phần cứng RK3588 và ràng buộc của RKNN-Toolkit2</text>
<text x="10" y="82" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Thông lượng mảng MAC của mỗi lõi (TRM1 tr.1984, ba lõi)</text>
<rect x="10" y="94" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Kiểu dữ liệu</text>
<text x="118" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">MACs / chu kỳ / lõi</text>
<text x="278" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Tổng ba lõi (@ 1 GHz)</text>
<text x="478" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Ý nghĩa hiệu năng</text>
<path d="M10 122 L880 122" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="134.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT4</tspan></text>
<text x="118" y="134.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>2048x3 MACs</tspan></text>
<text x="278" y="134.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>12.288 TOPS (tính)</tspan></text>
<text x="478" y="134.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Thông lượng cao nhất; rknn.config không hỗ trợ trực tiếp RK3588</tspan></text>
<path d="M10 146 L880 146" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="158.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT8</tspan></text>
<text x="118" y="158.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>1024x3 MACs</tspan></text>
<text x="278" y="158.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>6.144 TOPS (tính)</tspan></text>
<text x="478" y="158.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chuẩn suy luận chính; đạt mốc vendor &#x27;up to 6TOPs&#x27; [DS tr.7]</tspan></text>
<path d="M10 170 L880 170" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="182.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT16</tspan></text>
<text x="118" y="182.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>512x3 MACs</tspan></text>
<text x="278" y="182.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>3.072 TOPS (tính)</tspan></text>
<text x="478" y="182.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Độ chính xác cao hơn INT8; thông lượng giảm một nửa</tspan></text>
<path d="M10 194 L880 194" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="206.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>FP16 / BF16</tspan></text>
<text x="118" y="206.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>512x3 MACs</tspan></text>
<text x="278" y="206.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>3.072 TFLOPS (tính)</tspan></text>
<text x="478" y="206.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Mặc định khi không lượng tử (do_quantization=False) [UG232 tr.165]</tspan></text>
<path d="M10 218 L880 218" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="230.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>TF32</tspan></text>
<text x="118" y="230.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>256x3 MACs</tspan></text>
<text x="278" y="230.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>1.536 TFLOPS (tính)</tspan></text>
<text x="478" y="230.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Định dạng huấn luyện; thông lượng thấp nhất trong các kiểu</tspan></text>
<rect x="10" y="94" width="870" height="148" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M110 94 L110 242" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M270 94 L270 242" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M470 94 L470 242" stroke="#CCCCCC" stroke-width="0.8"/>
<text x="10" y="262" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Ràng buộc cấu hình kiểu dữ liệu trong RKNN-Toolkit2</text>
<rect x="10" y="274" width="870" height="110" rx="6" fill="#FFF1CC" stroke="#E65100" stroke-width="1.4"/>
<text x="24" y="296" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">rknn.config mặc định: </tspan><tspan>quantized_dtype=&#x27;w8a8&#x27; (trọng số INT8, kích hoạt INT8); float_dtype=&#x27;float16&#x27;.</tspan></text>
<text x="24" y="313" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Khi không lượng tử: </tspan><tspan>Đặt do_quantization=False; model float được convert weight từ float32 sang float16</tspan></text>
<text x="24" y="330" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>với độ mất chính xác gần như bằng không [UG232 tr.165] (NPU không hỗ trợ tính toán FP32).</tspan></text>
<text x="24" y="347" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Các kiểu bị giới hạn: </tspan><tspan>quantized_dtype có w4a16 và w8a16 nhưng tài liệu API232 ghi dành cho chip khác</tspan></text>
<text x="24" y="364" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>(RV1103/RV1106); trên RK3588 đường rknn.config thông thường chỉ dùng w8a8 hoặc float16.</tspan></text>
<rect x="10" y="400" width="870" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="414.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Tần số xung nhịp tối đa của NPU được ghi &#x27;TBD&#x27; trong Datasheet tr.31.</tspan></text>
<text x="20" y="431.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>Con số 6.144 TOPS ở trên là phép tính lý thuyết minh họa ở tần số ví dụ 1 GHz.</tspan></text>
<text x="10" y="472" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TRM1 tr.1984; DS tr.7, tr.11, tr.31; UG232 tr.165; API232 tr.7; BAMB tr.1.</text>
</svg>