 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="580" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="48" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Hai họ kiểu dữ liệu số và đánh đổi khi giảm số bit</text>
<text x="10" y="82" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Hai họ kiểu dữ liệu số trong mạng nơ-ron</text>
<rect x="10" y="94" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Kiểu</text>
<text x="88" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Họ</text>
<text x="238" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Số bit</text>
<text x="308" y="108.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Điều nguồn cho (và nguồn)</text>
<path d="M10 122 L880 122" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="141.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>FP32</tspan></text>
<text x="88" y="141.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dấu phẩy động</tspan></text>
<text x="238" y="141.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>32</tspan></text>
<text x="308" y="134.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tên kiểu dùng khi huấn luyện (float32); khi không lượng tử,</tspan></text>
<text x="308" y="149.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>weight được chuyển sang float16 [UG232 tr.165]</tspan></text>
<path d="M10 161 L880 161" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="173.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>FP16</tspan></text>
<text x="88" y="173.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dấu phẩy động</tspan></text>
<text x="238" y="173.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>16</tspan></text>
<text x="308" y="173.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dải biểu diễn -65504 đến 65504; vượt dải thì tràn số [UG232 tr.133]</tspan></text>
<path d="M10 185 L880 185" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="197.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>BF16</tspan></text>
<text x="88" y="197.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dấu phẩy động</tspan></text>
<text x="238" y="197.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>16</tspan></text>
<text x="308" y="197.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>TRM và Datasheet liệt kê là kiểu phần cứng hỗ trợ [TRM1 tr.1984; DS tr.11]</tspan></text>
<path d="M10 209 L880 209" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="221.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT8</tspan></text>
<text x="88" y="221.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số nguyên</tspan></text>
<text x="238" y="221.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>8</tspan></text>
<text x="308" y="221.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số nguyên trên lưới lượng tử đều 2^b mức, có dấu hoặc không dấu [NAGEL tr.4, tr.5]</tspan></text>
<path d="M10 233 L880 233" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="245.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT4</tspan></text>
<text x="88" y="245.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số nguyên</tspan></text>
<text x="238" y="245.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>4</tspan></text>
<text x="308" y="245.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>16 mức; PTQ 4-bit trên YOLOv5s chỉ còn 7.0% mAP [NAGEL tr.4; QYOLO tr.2]</tspan></text>
<path d="M10 257 L880 257" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="269.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>INT16</tspan></text>
<text x="88" y="269.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số nguyên</tspan></text>
<text x="238" y="269.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>16</tspan></text>
<text x="308" y="269.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>TRM liệt kê là kiểu phần cứng hỗ trợ [TRM1 tr.1984]</tspan></text>
<rect x="10" y="94" width="870" height="187" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M80 94 L80 281" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M230 94 L230 281" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M300 94 L300 281" stroke="#CCCCCC" stroke-width="0.8"/>
<text x="10" y="301" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Đánh đổi khi giảm số bit</text>
<rect x="10" y="313" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="327.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Khía cạnh</text>
<text x="228" y="327.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Điều nguồn cho (và nguồn)</text>
<path d="M10 341 L880 341" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="360.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Bộ nhớ &amp; độ trễ</tspan></text>
<text x="228" y="353.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số nguyên 4 bit trở xuống: lý thuyết giảm bộ nhớ và độ trễ tới 16 lần,</tspan></text>
<text x="228" y="368.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>thực tế thường 4-8 lần [GHOLAMI tr.1]</tspan></text>
<path d="M10 380 L880 380" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="392.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Năng lượng &amp; diện tích</tspan></text>
<text x="228" y="392.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Nhân INT8 tốn ít năng lượng và ít diện tích hơn nhân dấu phẩy động 16 bit IEEE 754 [TPU tr.1]</tspan></text>
<path d="M10 404 L880 404" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="423.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Độ chính xác INT8 / FP16</tspan></text>
<text x="228" y="416.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>W8A8 thường trong khoảng 1% so FP32 [NAGEL tr.25]; không lượng tử: FP16 &#x27;almost no</tspan></text>
<text x="228" y="431.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>accuracy loss&#x27; [UG232 tr.165]</tspan></text>
<path d="M10 443 L880 443" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="462.5" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Độ chính xác INT4</tspan></text>
<text x="228" y="455.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Weight 4-bit còn &#x27;small additional drop&#x27; [NAGEL tr.25], nhưng EfficientDet-D1 W4A8</tspan></text>
<text x="228" y="470.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>per-tensor sụp còn 0.31 AP [NAGEL tr.17]; YOLOv5s PTQ 4-bit còn 7.0% mAP [QYOLO tr.2]</tspan></text>
<rect x="10" y="313" width="870" height="169" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M220 313 L220 482" stroke="#CCCCCC" stroke-width="0.8"/>
<rect x="10" y="494" width="870" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="508.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Cấu trúc bit chi tiết (bit dấu, số mũ, định trị) của FP32, FP16 và BF16 không có trong bộ nguồn.</tspan></text>
<text x="20" y="525.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>Nguồn chỉ cho tên kiểu, độ rộng và dải giá trị của FP16 (-65504 đến 65504).</tspan></text>
<text x="10" y="566" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TRM1 tr.1984; DS tr.11; UG232 tr.133, tr.165; NAGEL tr.4, tr.5, tr.17, tr.25; GHOLAMI tr.1; TPU tr.1; QYOLO tr.2.</text>
