<text x="410" y="249" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">1 output channel</text>
<line x1="490" y1="109" x2="490" y2="254" stroke="#CFD8DC" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="510" y="118" font-size="12.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Quy tắc cốt lõi (EYE tr.3):</text>
<text x="510" y="139" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Muốn có </tspan><tspan font-weight="700">C_out</tspan><tspan> channels đầu ra:</tspan></text>
<text x="510" y="157" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>cần đúng </tspan><tspan font-weight="700">C_out bộ lọc 3D độc lập</tspan><tspan> (# of 3D filters = # of ofmap channels).</tspan></text>
<text x="510" y="175" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Kích thước tensor trọng số tổng thể: </tspan><tspan font-weight="700">[C_out, C_in, K_h, K_w]</tspan></text>
<text x="510" y="193" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tổng số trọng số (weights): </tspan><tspan font-weight="700">C_out · C_in · K · K</tspan></text>
<text x="510" y="211" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Tại sao? </tspan><tspan>Mỗi filter tính ra 1 channel; C_out filters tính ra C_out channels.</tspan></text>
<text x="10" y="289" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Các phép biến đổi và tổ hợp Channel trong kiến trúc CNN</text>
<rect x="10" y="301" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="315.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Phép biến đổi</text>
<text x="168" y="315.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Kích thước Kernel</text>
<text x="358" y="315.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Cơ chế xuyên kênh (Cross-channel)</text>
<text x="598" y="315.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Ý nghĩa kiến trúc &amp; Hiệu năng</text>
<path d="M10 329 L880 329" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="341.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Standard Conv</tspan></text>
<text x="168" y="341.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>[C_out, C_in, K, K]</tspan></text>
<text x="358" y="341.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Cộng dồn toàn bộ C_in kênh</tspan></text>
<text x="598" y="341.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Trộn cả không gian lẫn kênh; chuẩn trong CNN</tspan></text>
<path d="M10 353 L880 353" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="365.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Pointwise (1x1 Conv)</tspan></text>
<text x="168" y="365.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>[C_out, C_in, 1, 1]</tspan></text>
<text x="358" y="365.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tổ hợp tuyến tính xuyên kênh</tspan></text>
<text x="598" y="365.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Không quét không gian (K=1); thay đổi số channel</tspan></text>
<path d="M10 377 L880 377" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="389.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Depthwise (DWConv)</tspan></text>
<text x="168" y="389.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>[C_in, 1, K, K]</tspan></text>
<text x="358" y="389.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tách rời, không trộn xuyên kênh</tspan></text>
<text x="598" y="389.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>groups = C_in; giảm FLOPs nhưng tốn băng thông</tspan></text>
<path d="M10 401 L880 401" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="413.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Grouped Conv</tspan></text>
<text x="168" y="413.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>[C_out, C_in/G, K, K]</tspan></text>
<text x="358" y="413.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Cộng dồn nội bộ từng nhóm G kênh</tspan></text>
<text x="598" y="413.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chia nhỏ mảng tính; trung gian giữa Conv và DWConv</tspan></text>
