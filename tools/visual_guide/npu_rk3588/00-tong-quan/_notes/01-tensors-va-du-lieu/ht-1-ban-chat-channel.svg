<text x="250" y="250" font-size="10" font-weight="400" fill="#E65100" text-anchor="middle" dominant-baseline="central" font-style="italic">(channel reduction)</text>
<text x="335" y="199" font-size="20" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">➔</text>
<text x="360" y="116" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">1 Channel đầu ra</text>
<text x="360" y="132" font-size="10.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">mặt phẳng đặc trưng mới</text>
<polygon points="375,169 389,159 444,159 444,214 430,224 375,224" fill="#E8F8F5" stroke="#2E7D32" stroke-width="1.2"/>
