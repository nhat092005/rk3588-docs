<text x="10" y="48" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Bản chất của Channel trong mạng nơ-ron và phép tích chập</text>
<text x="10" y="80" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Quan hệ giữa Channel đầu vào, Bộ lọc 3D (Filter) và Channel đầu ra</text>
