<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="460" fill="white"/>
<rect x="770" y="10" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="810.3" y="21.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="10" y="48" font-size="16" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Tổ chức Channel trên phần cứng NPU RK3588 và lượng tử hóa Per-Channel</text>
<text x="10" y="80" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. So sánh Per-Channel vs Per-Layer Quantization trên RKNN-Toolkit2</text>
<rect x="10" y="92" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="106.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Khía cạnh</text>
<text x="148" y="106.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Per-Layer (Per-Tensor)</text>
<text x="378" y="106.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Per-Channel (Channel-wise)</text>
<text x="618" y="106.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Ràng buộc trên NPU RK3588</text>
<path d="M10 120 L880 120" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="132.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Số lượng Scale/ZP</tspan></text>
<text x="148" y="132.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>1 cặp dùng chung cho cả layer</tspan></text>
<text x="378" y="132.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>1 cặp riêng cho mỗi output channel</tspan></text>
<text x="618" y="132.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Per-Channel chỉ áp dụng cho weight [UG232 tr.120]</tspan></text>
<path d="M10 144 L880 144" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="156.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Độ chính xác Weight</tspan></text>
<text x="148" y="156.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dễ méo khi biên độ các filter lệch</tspan></text>
<text x="378" y="156.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Bảo toàn phân phối từng filter</tspan></text>
<text x="618" y="156.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>NAGEL tr.16 khuyên dùng per-channel weight</tspan></text>
<path d="M10 168 L880 168" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="180.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Lượng tử Activation</tspan></text>
<text x="148" y="180.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Hỗ trợ và là chế độ bắt buộc</tspan></text>
<text x="378" y="180.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Không hỗ trợ cho activation</tspan></text>
<text x="618" y="180.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Activation phải cộng dồn xuyên kênh trước khi rescale</tspan></text>
<path d="M10 192 L880 192" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="204.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chi phí phần cứng NPU</tspan></text>
<text x="148" y="204.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tối thiểu</tspan></text>
<text x="378" y="204.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Không tăng diện tích mảng MAC</tspan></text>
<text x="618" y="204.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Scale được áp dụng ở bộ hoàn nguyên sau tích lũy</tspan></text>
<rect x="10" y="92" width="870" height="124" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M140 92 L140 216" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M370 92 L370 216" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M610 92 L610 216" stroke="#CCCCCC" stroke-width="0.8"/>
<text x="10" y="236" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Căn chỉnh khối Channel (Tiling) và ràng buộc toán tử NPU RK3588</text>
<rect x="10" y="248" width="870" height="110" rx="6" fill="#EAF2FF" stroke="#1E5BB8" stroke-width="1.4"/>
<text x="24" y="270" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Căn chỉnh bộ nhớ mảng MAC: </tspan><tspan>Mảng tính toán NPU RK3588 tổ chức theo các khối channel sub-K = 32</tspan></text>
<text x="24" y="287" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>(UG232 tr.49, Table 3-5 quy định shape hiệu năng cao Native như [K/32, M, 32] hoặc [N/64, K/32, 64, 32]).</tspan></text>
<text x="24" y="304" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Khuyến nghị thiết kế mô hình: </tspan><tspan>Nên chọn số channel là bội số của 32 (ví dụ 32, 64, 128, 256) để đạt 100% hiệu suất</tspan></text>
<text x="24" y="321" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>lấp đầy mảng PE; số channel lẻ buộc compiler phải chèn zero-padding gây lãng phí bộ đệm CBUF và chu kỳ.</tspan></text>
<text x="24" y="338" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Ràng buộc toán tử (OPL): </tspan><tspan>exSDPAttention giới hạn channel ∈ (0, 8192] [OPL tr.104]; Softmax tính theo trục channel (axis 1) [OPL tr.89].</tspan></text>
<rect x="10" y="374" width="870" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="388.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Vi kiến trúc cây cộng dồn channel (channel accumulation tree) nội bộ trong mảng MAC</tspan></text>
<text x="20" y="405.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>và cơ chế xử lý padding động khi C không chia hết cho 32 không được công bố chi tiết trong tài liệu vendor.</tspan></text>
<text x="10" y="446" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: UG232 tr.49, tr.120; NAGEL tr.16; OPL tr.89, tr.104; TRM1 tr.1984.</text>
</svg>