<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="548" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="24" font-size="16" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đánh đổi Lượng tử hóa INT8 so với FP16 và Quy tắc chọn model của đề tài</text>
<text x="10" y="56" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Bản chất phần cứng: Tại sao NPU RK3588 ưu tiên lượng tử hóa INT8?</text>
<rect x="10" y="72" width="425" height="130" rx="5" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.5"/>
<text x="222.5" y="90" font-size="12" font-weight="700" fill="#B78103" text-anchor="middle" dominant-baseline="central">FP16 (Float16) - Chuẩn suy luận dấu phẩy động</text>
<text x="20" y="108" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Năng lực tính toán: </tspan><tspan>512 MACs/chu kỳ/core [TRM1 tr.1984]</tspan></text>
<text x="20" y="126" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tổng 3 lõi @ 1 GHz: </tspan><tspan>3.072 TFLOPS (phép tính số học)</tspan></text>
<text x="20" y="144" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Dung lượng &amp; Băng thông: </tspan><tspan>2 bytes / tham số; chiếm nhiều SRAM/DDR</tspan></text>
<text x="20" y="162" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Độ chính xác: </tspan><tspan>Bảo toàn gần như nguyên vẹn kết quả FP32 của PC</tspan></text>
<rect x="465" y="72" width="425" height="130" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="677.5" y="90" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">INT8 (W8A8) - Chuẩn lượng tử hóa tối ưu NPU</text>
<text x="475" y="108" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Năng lực tính toán: </tspan><tspan>1024 MACs/chu kỳ/core (GẤP ĐÔI FP16) [TRM1 tr.1984]</tspan></text>
<text x="475" y="126" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tổng 3 lõi @ 1 GHz: </tspan><tspan>6.144 TOPS (Vendor công bố &#x27;up to 6TOPs&#x27;) [DS tr.7]</tspan></text>
<text x="475" y="144" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Dung lượng &amp; Băng thông: </tspan><tspan>1 byte / tham số; giảm 50% áp lực truyền dữ liệu DRAM</tspan></text>
<text x="475" y="162" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Độ chính xác: </tspan><tspan>Có sai số làm tròn (quantization noise), sụt giảm nhẹ mAP</tspan></text>
<rect x="10" y="212" width="880" height="48" rx="4" fill="#EAF2FF" stroke="#90CAF9" stroke-width="1.2"/>
<text x="20" y="226" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Độ sụt giảm do lượng tử hóa (Quantization Drop): </tspan><tspan font-weight="700">Delta_mAP = mAP50-95(FP32) - mAP50-95(INT8)</tspan></text>
<text x="20" y="243" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Mục tiêu tối ưu: </tspan><tspan>Đạt tốc độ tăng gấp đôi của INT8 nhưng khống chế Delta_mAP ở mức tối thiểu</tspan></text>
<text x="10" y="276" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Quy tắc chọn model triển khai của đề tài (Chốt trước khi có số thực nghiệm)</text>
<rect x="10" y="288" width="880" height="92" rx="5" fill="#FBE9E7" stroke="#E65100" stroke-width="1.5"/>
<text x="20" y="306" font-size="12" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">QUY TẮC CHỌN MODEL [REPO tmp/02_decisions/2026-10-11_model-selection-rule.md:25]:</text>
<text x="20" y="324" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">1. Tiêu chí chính: </tspan><tspan>Chọn model NHANH NHẤT (trung vị Tier 1 eval_perf ở core_mask=AUTO) có mAP50-95 INT8 trên board</tspan></text>
<text x="20" y="341" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>   </tspan><tspan font-weight="700">KHÔNG THẤP HƠN YOLOv8n SiLU INT8 QUÁ 1.0 ĐIỂM (tuyệt đối, ví dụ 0.560 so 0.570).</tspan></text>
<text x="20" y="358" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">2. Quy tắc an toàn (Fallback): </tspan><tspan>Nếu không có model nào nhanh hơn rõ ràng (chênh lệch nằm trong biên độ nhiễu giữa các phiên), GIỮ YOLOV8N SILU.</tspan></text>
<text x="10" y="396" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">C. Đặc tính kỹ thuật 3 mô hình ứng viên trên tập dữ liệu sfchd_5class</text>
<rect x="10" y="408" width="880" height="28" fill="#E8E8E8"/>
<text x="18" y="422.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Mô hình ứng viên</text>
<text x="198" y="422.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Activation</text>
<text x="308" y="422.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Khả năng NPU đa lõi</text>
<text x="478" y="422.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Ưu thế kỹ thuật &amp; Đánh đổi thực nghiệm</text>
<path d="M10 436 L890 436" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="448.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>YOLOv8n SiLU (Baseline)</tspan></text>
<text x="198" y="448.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU</tspan></text>
<text x="308" y="448.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chỉ Core 0 (ConvExSwish)</tspan></text>
<text x="478" y="448.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chuẩn đối chiếu; mAP50-95 cao nhất (0.5908); T_npu ~21.4 ms</tspan></text>
<path d="M10 460 L890 460" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="472.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>YOLOv8n ReLU (Fine-tuned)</tspan></text>
<text x="198" y="472.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ReLU</tspan></text>
<text x="308" y="472.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chia 3 lõi (~35/34/32%)</tspan></text>
<text x="478" y="472.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Nhanh hơn 35% trên NPU (~13.9 ms); Cần kiểm tra độ sụt mAP sau INT8</tspan></text>
<path d="M10 484 L890 484" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="496.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>YOLO26n (No-NMS Head)</tspan></text>
<text x="198" y="496.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU + PSA</tspan></text>
<text x="308" y="496.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chỉ Core 0</tspan></text>
<text x="478" y="496.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Bỏ NMS trên CPU; NPU trễ hơn 13-16% do nhiều lớp nhỏ tuần tự</tspan></text>
<rect x="10" y="408" width="880" height="100" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M190 408 L190 508" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M300 408 L300 508" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M470 408 L470 508" stroke="#CCCCCC" stroke-width="0.8"/>
<text x="10" y="534" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TRM1 tr.1984; DS tr.7; REPO tmp/02_decisions/2026-10-11_model-selection-rule.md; LOG 2026-10-10_yolo-phaseA; LOG 2026-10-10_t3-board-silu-resize.</text>
</svg>