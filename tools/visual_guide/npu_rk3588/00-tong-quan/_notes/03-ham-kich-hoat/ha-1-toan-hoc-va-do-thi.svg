<text x="666.65" y="123.19999999999999" font-size="11.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">f(x) = x · σ(x)</text>
<text x="712.55" y="164.79999999999998" font-size="10.5" font-weight="600" fill="#C62828" text-anchor="start" dominant-baseline="central">f&#x27;(x) trơn liên tục</text>
<text x="518.75" y="207.2" font-size="9.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Cực tiểu: x ≈ -1.28, y ≈ -0.28</text>
<text x="465" y="90" font-size="12.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">SiLU (Swish-1): f(x) = x · σ(x)</text>
<text x="465" y="106" font-size="10.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">x / (1 + e⁻ˣ), phi tuyến trơn (OPL tr.47)</text>
<text x="10" y="250" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. So sánh toàn diện các đặc tính giữa hai hàm kích hoạt</text>
<rect x="10" y="262" width="870" height="28" fill="#E8E8E8"/>
<text x="18" y="276.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Khía cạnh</text>
<text x="143" y="276.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">ReLU (max(0, x))</text>
<text x="388" y="276.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">SiLU (x · sigmoid(x))</text>
<text x="648" y="276.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Nhận xét &amp; Nguồn</text>
<path d="M10 290 L880 290" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="302.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Đạo hàm f&#x27;(x)</tspan></text>
<text x="143" y="302.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>f&#x27;(x) = 1 khi x &gt; 0; 0 khi x &lt; 0</tspan></text>
<text x="388" y="302.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>f&#x27;(x) = σ(x) + x·σ(x)(1 - σ(x))</tspan></text>
<text x="648" y="302.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU có đạo hàm trơn liên tục</tspan></text>
<path d="M10 314 L880 314" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="326.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Hiện tượng Dying</tspan></text>
<text x="143" y="326.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dễ chết nơ-ron nếu gradient dập về 0</tspan></text>
<text x="388" y="326.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tránh được nhờ dải gradient âm nhỏ</tspan></text>
<text x="648" y="326.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU giúp tối ưu mạng sâu tốt hơn</tspan></text>
<path d="M10 338 L880 338" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="350.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Độ chính xác</tspan></text>
<text x="143" y="350.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Thường thấp hơn SiLU 0.5 - 2% mAP</tspan></text>
<text x="388" y="350.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chuẩn trong YOLOv5/v8, mAP cao hơn</tspan></text>
<text x="648" y="350.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU performs with better accuracy [Y6 tr.8]</tspan></text>
<path d="M10 362 L880 362" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="374.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tốc độ ghép lớp</tspan></text>
<text x="143" y="374.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Ghép trực tiếp vào Conv cực nhanh</tspan></text>
<text x="388" y="374.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tốn bảng tra (LUT) hoặc xấp xỉ</tspan></text>
<text x="648" y="374.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ReLU speed advantage in Conv [Y6 tr.8]</tspan></text>
<path d="M10 386 L880 386" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="398.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Đánh đổi trên NPU</tspan></text>
<text x="143" y="398.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Ưu tiên độ trễ, tiết kiệm tài nguyên</tspan></text>
<text x="388" y="398.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Ưu tiên độ chính xác cao nhất</tspan></text>
<text x="648" y="398.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>impact more prominent on NPUs [ACTNAS tr.8]</tspan></text>
