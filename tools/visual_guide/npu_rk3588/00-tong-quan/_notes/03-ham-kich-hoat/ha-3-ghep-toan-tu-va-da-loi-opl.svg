<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="566" fill="white"/>
<rect x="770" y="10" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="810.3" y="21.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="10" y="24" font-size="16" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Cơ chế Ghép toán tử (Operator Fusion) và Hỗ trợ Đa lõi NPU RK3588 (OPL)</text>
<text x="10" y="56" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. So sánh đường đi dữ liệu: Toán tử ghép (Fused) so với Toán tử tách rời (Disjoint)</text>
<rect x="10" y="72" width="430" height="115" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="20" y="90" font-size="11.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Toán tử ghép (Fused Operator: ConvolutionRelu, ConvolutionSwish)</text>
<text x="20" y="108" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đường đi dữ liệu: </tspan><tspan>Chạy khép kín 100% trong SRAM nội bộ (CBUF 384KB).</tspan></text>
<text x="20" y="125" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cơ chế: </tspan><tspan>Mảng MAC tính chập xong -&gt; DPU áp dụng kích hoạt ngay lập tức.</tspan></text>
<text x="20" y="142" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Hiệu quả: </tspan><tspan font-weight="700">Không ghi feature map trung gian ra DRAM DDR. Băng thông tối ưu!</tspan></text>
<rect x="460" y="72" width="430" height="115" rx="5" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
<text x="470" y="90" font-size="11.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Toán tử tách rời (Disjoint Operator: exSwish, Add rời)</text>
<text x="470" y="108" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đường đi dữ liệu: </tspan><tspan>Conv chạy xong -&gt; Ghi feature map ra ngoài RAM DDR.</tspan></text>
<text x="470" y="125" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cơ chế: </tspan><tspan>Sau đó NPU nạp lại dữ liệu từ DDR vào để chạy lớp exSwish.</tspan></text>
<text x="470" y="142" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Hiệu quả: </tspan><tspan font-weight="700">Gây tắc nghẽn băng thông bộ nhớ (memory-bound), độ trễ đội lên cao.</tspan></text>
<text x="10" y="205" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Phân loại toán tử kích hoạt trong RKNN Compiler &amp; Khả năng chạy đa lõi (OPL)</text>
<rect x="10" y="217" width="880" height="28" fill="#E8E8E8"/>
<text x="18" y="231.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Hàm kích hoạt</text>
<text x="153" y="231.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Op sau ghép (Compiler)</text>
<text x="328" y="231.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Cơ chế phần cứng NPU</text>
<text x="558" y="231.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Hỗ trợ đa lõi (OPL)</text>
<text x="708" y="231.0" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Đánh giá thực tế</text>
<path d="M10 245 L890 245" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="257.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ReLU</tspan></text>
<text x="153" y="257.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ConvolutionRelu</tspan></text>
<text x="328" y="257.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Clamp ngưỡng sau mảng MAC</tspan></text>
<text x="558" y="257.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>多核联合: 支持 [tr.60]</tspan></text>
<text x="708" y="257.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Chia đều 3 core, tăng tốc ~35%</tspan></text>
<path d="M10 269 L890 269" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="281.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU (ghép)</tspan></text>
<text x="153" y="281.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ConvolutionSwish</tspan></text>
<text x="328" y="281.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Bảng tra LUT / xử lý phi tuyến</tspan></text>
<text x="558" y="281.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>多核联合: 暂不支持 [tr.63]</tspan></text>
<text x="708" y="281.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Dồn 100% vào Core 0 (T3)</tspan></text>
<path d="M10 293 L890 293" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="305.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>SiLU (rời)</tspan></text>
<text x="153" y="305.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>exSwish</tspan></text>
<text x="328" y="305.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Toán tử phần tử rời rạc</tspan></text>
<text x="558" y="305.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>多核联合: 尚不支持 [tr.98]</tspan></text>
<text x="708" y="305.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tốn bộ nhớ DDR, chỉ chạy Core 0</tspan></text>
<path d="M10 317 L890 317" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="329.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ReLU + Add</tspan></text>
<text x="153" y="329.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>ConvolutionAddRelu</tspan></text>
<text x="328" y="329.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>MAC + Tích lũy + Clamp</tspan></text>
<text x="558" y="329.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>多核联合: 支持 [tr.63]</tspan></text>
<text x="708" y="329.0" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Hỗ trợ shortcut residual 3 core</tspan></text>
<rect x="10" y="217" width="880" height="124" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M145 217 L145 341" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M320 217 L320 341" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M550 217 L550 341" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M700 217 L700 341" stroke="#CCCCCC" stroke-width="0.8"/>
<text x="10" y="359" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">C. Đo kiểm thực tế T3 trên board RK3588S và Quy tắc chọn model của đề tài</text>
<rect x="10" y="371" width="880" height="95" rx="5" fill="#EAF2FF" stroke="#1E5BB8" stroke-width="1.4"/>
<text x="24" y="387" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Đo thực tế trên board RK3588S (T3): </tspan><tspan>Mô hình YOLOv8n SiLU dồn 100% cả 57 lớp ConvExSwish vào Core 0 (100%/0%/0%),</tspan></text>
<text x="24" y="403" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan> </tspan><tspan>không tận dụng được 3 core khi đặt core_mask=CORE_0_1_2 [LOG 2026-10-10_yolo-phaseA].</tspan></text>
<text x="24" y="419" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Tốc độ ReLU: </tspan><tspan>Mô hình ReLU chạy nhanh hơn SiLU ~35% trên NPU nhờ ConvRelu chia đều trên cả 3 core [LOG].</tspan></text>
<text x="24" y="435" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Quy tắc chọn model (tmp/02_decisions/2026-10-11): </tspan><tspan font-weight="700">Chọn model nhanh nhất có mAP50-95 INT8 không thấp hơn SiLU quá 1.0 điểm; nếu không rõ thì giữ SiLU.</tspan></text>
<rect x="10" y="480" width="880" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="494.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Nguyên nhân vi kiến trúc cụ thể khiến NPU RK3588 không hỗ trợ đa lõi cho ConvolutionSwish và exSwish</tspan></text>
<text x="20" y="511.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>(trong khi ConvolutionRelu hỗ trợ hoàn toàn) không được tài liệu OPL giải thích chi tiết.</tspan></text>
<text x="10" y="552" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: OPL tr.47, tr.60, tr.63, tr.98; LOG 2026-10-10_t3-board-silu-resize; REPO tmp/02_decisions/2026-10-11_model-selection-rule.md.</text>
</svg>