<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="458" fill="white"/>
<rect x="770" y="10" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="810.3" y="21.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="10" y="24" font-size="16" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Vi kiến trúc Mạch Silicon NPU RK3588: MAC, Tích lũy, Clamp vs LUT và Residual Add</text>
<text x="10" y="54" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Luồng dữ liệu phần cứng bên trong một lõi NPU (CNA &amp; DPU) [TRM1 tr.1985]</text>
<rect x="10" y="94" width="170" height="110" rx="5" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.5"/>
<text x="95.0" y="112" font-size="11.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Bộ đệm CBUF 384KB</text>
<text x="95.0" y="126" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">&amp; Pre-process Controller</text>
<text x="18" y="144" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Chứa Feature Map &amp; Weight</tspan></text>
<text x="18" y="159" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Điều phối nạp dữ liệu</tspan></text>
<text x="18" y="174" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  cho mảng tính chập [TRM1]</tspan></text>
<polygon points="186,149 198,149 194,144 202,149 194,154 198,149" fill="#444444" stroke="#444444" stroke-width="2"/>
<rect x="206" y="94" width="185" height="110" rx="5" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5"/>
<text x="298.5" y="112" font-size="11.5" font-weight="700" fill="#7B1FA2" text-anchor="middle" dominant-baseline="central">Mảng MAC Array</text>
<text x="298.5" y="126" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">1024 MACs/lõi (INT8 32x32)</text>
<text x="214" y="144" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Phép nhân chập Conv:</tspan></text>
<text x="214" y="159" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  Input x Weight [TRM1 tr.2001]</tspan></text>
<text x="214" y="174" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Xuất ra các partial sums</tspan></text>
<polygon points="397,149 409,149 405,144 413,149 405,154 409,149" fill="#444444" stroke="#444444" stroke-width="2"/>
<rect x="417" y="94" width="185" height="110" rx="5" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5"/>
<text x="509.5" y="112" font-size="11.5" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Bộ tích lũy Accumulator</text>
<text x="509.5" y="126" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Thanh ghi tích lũy 32-bit</text>
<text x="425" y="144" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Cộng dồn partial sums</tspan></text>
<text x="425" y="159" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Nhận nhánh Residual Add</tspan></text>
<text x="425" y="174" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">  cộng tắt trực tiếp tại đây!</tspan></text>
<line x1="417" y1="80" x2="509" y2="80" stroke="#00796B" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="509" y1="80" x2="509" y2="94" stroke="#00796B" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="509,93 505,86 513,86" fill="#00796B"/>
<text x="417" y="72" font-size="10" font-weight="700" fill="#00796B" text-anchor="start" dominant-baseline="central">Nhánh Residual Shortcut (Tensor đầu vào tầng trước)</text>
<polygon points="608,149 620,149 616,144 624,149 616,154 620,149" fill="#444444" stroke="#444444" stroke-width="2"/>
<rect x="628" y="94" width="262" height="110" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="759.0" y="112" font-size="11.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Khối DPU (Data Processing Unit)</text>
<text x="759.0" y="126" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Thực thi hàm kích hoạt [TRM1 tr.1985]</text>
<text x="636" y="144" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đường A (ReLU): </tspan><tspan>Mạch Clamp cắt số âm</tspan></text>
<text x="636" y="159" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đường B (SiLU): </tspan><tspan>Bảng tra LUT / Bộ xấp xỉ</tspan></text>
<text x="636" y="174" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Xuất Feature Map đã kích hoạt</tspan></text>
<text x="10" y="224" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Đối chiếu cơ chế phần cứng: Mạch cắt ngưỡng Clamp (ReLU) so với Bảng tra LUT (SiLU)</text>
<rect x="10" y="238" width="430" height="120" rx="5" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="20" y="256" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">1. Cơ chế Clamp (ReLU / Leaky ReLU)</text>
<text x="20" y="274" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất mạch: </tspan><tspan>Mạch so sánh logic số nguyên (Comparator Logic).</tspan></text>
<text x="20" y="290" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cơ chế: </tspan><tspan>Kiểm tra bit dấu của thanh ghi Accumulator. Nếu x &lt; 0 thì dập</tspan></text>
<text x="20" y="306" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  toàn bộ bit về 0; nếu x &gt; 0 thì giữ nguyên giá trị.</tspan></text>
<text x="20" y="322" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Chi phí phần cứng: </tspan><tspan font-weight="700">Zero-cost (gần như 0 tốn thêm chu kỳ xung nhịp).</tspan></text>
<text x="20" y="338" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Ghép lớp: </tspan><tspan>Ghép trực tiếp sau Conv và Add thành ConvolutionAddRelu.</tspan></text>
<rect x="460" y="238" width="430" height="120" rx="5" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
<text x="470" y="256" font-size="12" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">2. Cơ chế Bảng tra LUT &amp; Bộ xấp xỉ phần cứng (SiLU / Swish)</text>
<text x="470" y="274" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất mạch: </tspan><tspan>Bảng tra Look-Up Table (LUT) hoặc xấp xỉ đa thức.</tspan></text>
<text x="470" y="290" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cơ chế: </tspan><tspan>Hàm x / (1 + e⁻ˣ) chứa số mũ e và phép chia, không thể tính</tspan></text>
<text x="470" y="306" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  bằng cổng logic đơn giản mà phải tra bảng giá trị rời rạc.</tspan></text>
<text x="470" y="322" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Chi phí phần cứng: </tspan><tspan font-weight="700">Tốn thêm chu kỳ đọc bộ đệm và diện tích silicon.</tspan></text>
<text x="470" y="338" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Ghép lớp: </tspan><tspan>RKNN ghép thành ConvolutionSwish nhưng chưa hỗ trợ đa lõi.</tspan></text>
<rect x="10" y="372" width="880" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="386.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>Vi kiến trúc mạch tính toán nội bộ (bảng tra LUT hay bộ xấp xỉ phần cứng) cho hàm phi tuyến SiLU</tspan></text>
<text x="20" y="403.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>không được công bố trong tài liệu kỹ thuật của NPU RK3588 (TRM và Datasheet chỉ mô tả danh mục op).</tspan></text>
<text x="10" y="444" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TRM1 tr.1984-1985, tr.2001; DS tr.7; OPL tr.47, tr.60, tr.63.</text>
</svg>