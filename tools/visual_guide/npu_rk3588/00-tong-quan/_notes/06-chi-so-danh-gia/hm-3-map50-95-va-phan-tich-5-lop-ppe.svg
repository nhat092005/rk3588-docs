<text x="10" y="24" font-size="16" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Bản chất Khắt khe của mAP50-95, Biểu đồ 5 Lớp PPE và Độ nhạy IoU của Vật thể nhỏ</text>
<text x="10" y="56" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Tại sao mAP50-95 lại khắt khe hơn nhiều so với mAP50? (Sự co rút diện tích AP qua 10 mốc IoU)</text>
