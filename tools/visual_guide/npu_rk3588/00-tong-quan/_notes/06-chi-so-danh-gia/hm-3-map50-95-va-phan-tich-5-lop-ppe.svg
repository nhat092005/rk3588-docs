<text x="162.5" y="156.5" font-size="13" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">AP@0.50 = 0.8924</text>
<text x="175.0" y="230" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Box chỉ cần chạm 50% diện tích nhãn</text>
