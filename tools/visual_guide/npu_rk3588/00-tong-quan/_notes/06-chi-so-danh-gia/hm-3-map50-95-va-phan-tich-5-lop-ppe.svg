<text x="10" y="425" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">C. Lý giải hình học: Tại sao vật thể nhỏ (head) lại có điểm mAP50-95 thấp nhất?</text>
<rect x="10" y="437" width="430" height="95" rx="5" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="20" y="453" font-size="11.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">1. Vật thể lớn: person (Ví dụ hộp 200 x 400 px)</text>
<text x="20" y="471" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Khi mô hình dự đoán bị lệch 10 pixel: </tspan></text>
<text x="20" y="487" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  Diện tích hộp rất lớn (80,000 px), độ lệch 10 px chỉ làm mất ~5% diện tích giao.</tspan></text>
<text x="20" y="503" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kết quả: </tspan><tspan font-weight="700">IoU vẫn đạt &gt; 0.90</tspan><tspan> -&gt; Vượt qua cả các mốc khắt khe (0.80 - 0.90)!</tspan></text>
<rect x="460" y="437" width="430" height="95" rx="5" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2"/>
<text x="470" y="453" font-size="11.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">2. Vật thể nhỏ: head (Ví dụ hộp 30 x 30 px)</text>
<text x="470" y="471" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Khi mô hình dự đoán bị lệch 10 pixel: </tspan></text>
<text x="470" y="487" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  Diện tích hộp rất nhỏ (900 px), độ lệch 10 px làm mất hơn 1/3 diện tích giao.</tspan></text>
<text x="470" y="503" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kết quả: </tspan><tspan font-weight="700">IoU tụt xuống dưới 0.50</tspan><tspan> -&gt; Bị loại khỏi hầu hết 10 mốc tính điểm!</tspan></text>
