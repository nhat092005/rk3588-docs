<text x="495.0" y="75" font-size="11" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Mốc IoU = 0.95 (Khắt khe)</text>
<text x="530" y="140" font-size="12" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">AP@0.95 &lt; 0.15</text>
<text x="495.0" y="230" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Lệch nhẹ 1 vài pixel lập tức bị coi là FP</text>
