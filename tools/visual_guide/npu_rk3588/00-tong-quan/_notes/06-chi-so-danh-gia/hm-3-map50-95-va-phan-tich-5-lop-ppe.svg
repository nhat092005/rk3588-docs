<text x="657" y="103" font-size="11.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Chuẩn COCO mAP50-95:</text>
<text x="657" y="121" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Lấy trung bình cộng tại 10 mốc:</tspan></text>
<text x="657" y="137" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  0.50, 0.55, 0.60, 0.65, 0.70,</tspan></text>
<text x="657" y="153" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  0.75, 0.80, 0.85, 0.90, 0.95</tspan></text>
<text x="657" y="169" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• mAP50: </tspan><tspan>0.8924 (Rất cao)</tspan></text>
<text x="657" y="185" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• mAP50-95: </tspan><tspan font-weight="700">0.5908 (Thực tế)</tspan></text>
<text x="10" y="253" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Biểu đồ mAP50-95 của 5 lớp đồ bảo hộ lao động (YOLOv8n baseline trên sfchd_5class)</text>
