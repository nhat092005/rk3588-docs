<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="560" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="24" font-size="16" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Cơ chế Đường cong Precision-Recall (P-R Curve), Average Precision và mAP</text>
<text x="10" y="56" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Sự đánh đổi giữa Precision và Recall khi trượt ngưỡng tin cậy (Confidence Threshold)</text>
<rect x="10" y="72" width="275" height="100" rx="5" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.5"/>
<text x="147.5" y="88" font-size="11.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Ngưỡng cao: Confidence ≥ 0.90</text>
<text x="20" y="108" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Chỉ giữ lại các hộp cực kỳ chắc chắn</tspan></text>
<text x="20" y="126" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Precision rất cao (~0.98): </tspan><tspan>Hầu như không báo nhầm</tspan></text>
<text x="20" y="144" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Recall rất thấp (~0.30): </tspan><tspan>Bỏ sót hầu hết vật thể che khuất</tspan></text>
<rect x="310" y="72" width="275" height="100" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="447.5" y="88" font-size="11.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Ngưỡng chuẩn: Confidence ≈ 0.50</text>
<text x="320" y="108" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Cân bằng tối ưu giữa phát hiện và báo nhầm</tspan></text>
<text x="320" y="126" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Precision cao (~0.90): </tspan><tspan>Báo sai dưới 10%</tspan></text>
<text x="320" y="144" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Recall cao (~0.84): </tspan><tspan>Bắt được 84% vật thể thực tế</tspan></text>
<rect x="610" y="72" width="275" height="100" rx="5" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5"/>
<text x="747.5" y="88" font-size="11.5" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Ngưỡng thấp: Confidence ≤ 0.10</text>
<text x="620" y="108" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Giữ lại toàn bộ các vết nghi ngờ</tspan></text>
<text x="620" y="126" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Recall tối đa (~0.95): </tspan><tspan>Bắt gần như toàn bộ vật thể</tspan></text>
<text x="620" y="144" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Precision sụt dốc (~0.35): </tspan><tspan>Rất nhiều báo động giả (FP)</tspan></text>
<text x="10" y="190" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Đồ thị P-R Curve và Diện tích dưới đường cong (Area Under Curve - AUC = AP)</text>
