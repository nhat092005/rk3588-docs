<text x="777.5" y="476" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">mAP (Mean AP)</text>
<text x="777.5" y="496" font-size="11.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">mAP = (1/C) * Σ AP_c = 0.5908</text>
<text x="10" y="546" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: REPO ai/automation/leaderboards/sfchd_5class.csv; Y6 tr.8.</text>
