<text x="450.79999999999995" y="342.0" font-size="10" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">Conf=0.1</text>
<text x="239.0" y="330.0" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Diện tích AP = ∫ P(R) dR</text>
<text x="239.0" y="348.0" font-size="10.5" font-weight="600" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">(Chất lượng toàn diện của 1 lớp đối tượng)</text>
<rect x="520" y="220" width="370" height="200" rx="5" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.2"/>
<text x="535" y="240" font-size="12" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ý nghĩa của Average Precision (AP):</text>
<text x="535" y="262" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Đường cong P-R càng phồng về góc trên bên phải,</tspan></text>
<text x="535" y="280" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  mô hình càng đạt cả Precision cao lẫn Recall cao.</tspan></text>
<text x="535" y="298" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Diện tích AP nhận giá trị từ 0.0 đến 1.0 (hoàn hảo).</tspan></text>
<text x="535" y="316" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Nếu chỉ nhìn Precision hoặc Recall đơn lẻ ở một</tspan></text>
<text x="535" y="334" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  ngưỡng, ta sẽ bị đánh lừa bởi hành vi thiên lệch.</tspan></text>
<text x="535" y="352" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• AP là thước đo tích phân bao quát toàn bộ dải</tspan></text>
<text x="535" y="370" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">  ngưỡng tin cậy từ khắt khe đến lỏng lẻo.</tspan></text>
<text x="10" y="446" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">C. Từ AP từng lớp đối tượng đến mAP (Mean Average Precision)</text>
