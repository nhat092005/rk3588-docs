<text x="442.5" y="494" font-size="10" font-weight="600" fill="#444444" text-anchor="middle" dominant-baseline="central">AP_4 = 0.5764</text>
<rect x="510" y="460" width="115" height="50" rx="4" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/>
