<text x="365.0" y="434" font-size="10" font-weight="400" fill="#666666" text-anchor="middle" dominant-baseline="central">0.75</text>
<text x="42" y="270.0" font-size="10" font-weight="400" fill="#666666" text-anchor="end" dominant-baseline="central">0.75</text>
