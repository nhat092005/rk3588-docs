<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="764" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="24" font-size="15.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Định lượng FLOPs, MACs, TOPS và Nghịch lý Bộ nhớ (Memory-Bound) trên NPU RK3588</text>
<text x="10" y="50" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">A. Bản chất toán học: Quy đổi 1 MAC = 2 FLOPs trong phép tính mạng nơ-ron</text>
<rect x="10" y="62" width="880" height="100" rx="5" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.4"/>
<text x="30" y="82" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Công thức cốt lõi: 1 phép MAC (Multiply-Accumulate) = 1 Phép nhân + 1 Phép cộng dồn = 2 FLOPs</text>
<text x="30" y="104" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Biểu thức MAC: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">y = y + (w · x)</tspan><tspan>  ==&gt;  </tspan><tspan>Gồm 1 phép nhân (w·x) và 1 phép cộng (+y) = 2 FLOPs.</tspan></text>
<text x="30" y="121" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Phép tính Conv 2D: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">Số MAC = Hout × Wout × Cout × (K² × Cin)</tspan></text>
<text x="30" y="138" font-size="11.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  ==&gt; </tspan><tspan font-weight="700">FLOPs lý thuyết = 2 × Số MAC = 2 × Hout × Wout × Cout × (K² × Cin)</tspan></text>
<rect x="540" y="72" width="330" height="80" rx="4" fill="white" stroke="#90CAF9" stroke-width="1.2"/>
<text x="550" y="90" font-size="11" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ví dụ thực tế trong YOLOv8n (640×640):</text>
<text x="550" y="108" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Tổng toàn mạng: </tspan><tspan font-weight="700">3,006,623 tham số, 8.087 GFLOPs</tspan></text>
<text x="550" y="123" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Riêng lớp Detect: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5">2.965 GFLOPs (chiếm 36.7% toàn mạng)</tspan></text>
<text x="550" y="138" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  [LOG 2026-10-10_yolo-arch/out/table_v8n.md]</tspan></text>
<text x="10" y="176" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">B. Phân biệt ba khái niệm dễ gây nhầm lẫn: FLOPs vs FLOPS/TOPS vs Latency</text>
<rect x="10" y="188" width="280" height="185" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="150.0" y="208" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">1. FLOPs (Khối lượng việc)</text>
<text x="150.0" y="224" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Floating Point Operations (chữ s thường)</text>
<text x="22" y="244" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Tổng số phép tính số học lý thuyết cần chạy.</tspan></text>
<text x="22" y="260" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đơn vị: </tspan><tspan>FLOPs, GFLOPs (10⁹), TFLOPs (10¹²).</tspan></text>
<text x="22" y="276" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Ý nghĩa: </tspan><tspan>Đo kích thước mô hình (độ phức tạp giải thuật).</tspan></text>
<text x="22" y="292" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Độc lập phần cứng: </tspan><tspan>Mô hình giữ nguyên cấu trúc thì FLOPs bất biến.</tspan></text>
<rect x="310" y="188" width="280" height="185" rx="5" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.4"/>
<text x="450.0" y="208" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">2. FLOPS / TOPS (Tốc độ máy)</text>
<text x="450.0" y="224" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Operations Per Second (chữ S hoa = mỗi giây)</text>
<text x="322" y="244" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Năng lực tính toán cực đại của phần cứng/giây.</tspan></text>
<text x="322" y="260" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đơn vị: </tspan><tspan>GFLOPS, TFLOPS, TOPS (Tera Ops/sec).</tspan></text>
<text x="322" y="276" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Thông số RK3588: </tspan><tspan>3 Cores, 1024 MACs/core/cycle INT8.</tspan></text>
<text x="322" y="292" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cực đại công bố: </tspan><tspan>&quot;up to 6TOPs&quot; INT8 @ 1 GHz [DS tr.7].</tspan></text>
<rect x="610" y="188" width="280" height="185" rx="5" fill="#FFF8E1" stroke="#E65100" stroke-width="1.4"/>
<text x="750.0" y="208" font-size="12.5" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">3. Latency &amp; FPS (Trải nghiệm thực)</text>
<text x="750.0" y="224" font-size="10" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Thời gian trễ (ms) và Khung hình/giây</text>
<text x="622" y="244" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Thời gian chờ thực tế từ lúc đưa ảnh tới lúc có kết quả.</tspan></text>
<text x="622" y="260" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Phụ thuộc: </tspan><tspan>Băng thông bộ nhớ (DDR/SRAM), driver, overhead từng lớp.</tspan></text>
<text x="622" y="276" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Thực tế quyết định: </tspan><tspan>Mô hình tối ưu trên chip là mô hình có FPS cao nhất, không</tspan></text>
<text x="622" y="292" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  chỉ riêng FLOPs trên giấy!</tspan></text>
<text x="10" y="393" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">C. Nghịch lý FLOPs và Mô hình Roofline trên NPU RK3588 (Vì sao FLOPs thấp vẫn chạy chậm?)</text>
<rect x="10" y="405" width="430" height="195" rx="5" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<text x="225.0" y="425" font-size="12" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">NGHỊCH LÝ THỰC NGHIỆM: YOLO26n vs YOLOV8n</text>
<text x="22" y="447.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• YOLOv8n (Gốc): </tspan><tspan>8.087 GFLOPs  ==&gt;  Latency NPU: </tspan><tspan font-weight="700">16.14 ms</tspan></text>
<text x="22" y="462.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• YOLO26n: </tspan><tspan>5.314 GFLOPs (</tspan><tspan font-weight="700">Giảm 34% FLOPs lý thuyết!</tspan><tspan>)</tspan></text>
<text x="22" y="478.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  ==&gt; Latency NPU: </tspan><tspan font-weight="700">18.66 ms (Chậm hơn 15% trên RK3588!)</tspan></text>
<text x="22" y="493.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Vì sao nghịch lý xảy ra? </tspan></text>
<text x="22" y="509.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  1. Phân mảnh lớp: YOLO26n có tới </tspan><tspan font-weight="700">180 lớp NPU</tspan><tspan> (so với 116 lớp).</tspan></text>
<text x="22" y="524.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>     Mỗi lớp nhỏ tốn overhead DMA setup và context switch.</tspan></text>
<text x="22" y="540.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  2. Lớp Depthwise 3×3 hiệu suất MAC cực thấp (chỉ </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8">0.30% - 1.24%</tspan><tspan>)</tspan></text>
<text x="22" y="555.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>     khiến mảng MAC 32×32 liên tục bị bỏ đói (underutilized).</tspan></text>
<rect x="460" y="405" width="430" height="195" rx="5" fill="#F1F8E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="675.0" y="425" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">CƠ CHẾ KỸ THUẬT: MÔ HÌNH ROOFLINE &amp; MEMORY-BOUND</text>
<text x="472" y="447.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cường độ tính toán (Arithmetic Intensity): </tspan></text>
<text x="472" y="462.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8">  Arithmetic Intensity = FLOPs / Byte nạp từ RAM DDR</tspan></text>
<text x="472" y="478.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Hai vùng vận hành của NPU RK3588:</tspan></text>
<text x="472" y="493.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  1. Vùng Compute-Bound (Standard Conv, Pointwise 1×1):</tspan></text>
<text x="472" y="509.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>     Tái sử dụng dữ liệu cao trong CBUF -&gt; Đạt đỉnh 6 TOPS.</tspan></text>
<text x="472" y="524.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  2. Vùng Memory-Bound (Depthwise Conv, Resize, Split):</tspan></text>
<text x="472" y="540.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>     Tính toán quá ít so với lượng byte phải nạp qua bus AXI.</tspan></text>
<text x="472" y="555.5" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>     NPU bị nghẽn bus bộ nhớ DDR, dù FLOPs thấp vẫn chờ lâu!</tspan></text>
<text x="472" y="571.0" font-size="10.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kết luận: </tspan><tspan>Giảm FLOPs bằng cách băm nhỏ lớp thường làm giảm FPS!</tspan></text>
<rect x="10" y="614" width="880" height="110" rx="6" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<rect x="20" y="622" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="60.300000000000004" y="633.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="122" y="633" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Liên hệ RK3588: điều nguồn T1 nói và số liệu thực nghiệm</text>
<text x="24" y="658" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">TRM1 tr.1984: </tspan><tspan>NPU RK3588 gồm 3 lõi, cấu hình &quot;1024x3 integer 8 MAC operations per cycle&quot;.</tspan></text>
<text x="24" y="674" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">DS tr.7: </tspan><tspan>Datasheet công bố năng lực tính toán cực đại đạt &quot;up to 6TOPs&quot; ở kiểu dữ liệu INT8.</tspan></text>
<text x="24" y="690" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">LOG 2026-10-10_yolo-arch/layer_table.py:2: </tspan><tspan>GFLOPs tính bằng PyTorch FlopCounterMode (2 FLOPs per MAC).</tspan></text>
<text x="24" y="706" font-size="11" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">LOG 2026-10-10_yolo-phaseA: </tspan><tspan>YOLO26n 5.314 GFLOPs (18.66 ms) chậm hơn YOLOv8n 8.087 GFLOPs (16.14 ms) trên board.</tspan></text>
<text x="10" y="750" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TRM1 tr.1984 (RK3588 TRM); DS tr.7 (Datasheet); LOG 2026-10-10_yolo-arch; LOG 2026-10-10_yolo-phaseA.</text>
</svg>