<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1114" width="900" height="1114" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="1114" fill="white"/>
<rect x="808" y="8" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="848.3" y="19.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<rect x="10" y="40" width="286" height="384" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
<text x="24" y="59" font-size="15" font-weight="700" fill="#333333" text-anchor="start" dominant-baseline="central">1. Simulator trên PC</text>
<rect x="307" y="40" width="286" height="384" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
<text x="321" y="59" font-size="15" font-weight="700" fill="#333333" text-anchor="start" dominant-baseline="central">2. PC nối board</text>
<rect x="604" y="40" width="286" height="384" rx="8" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
<text x="618" y="59" font-size="15" font-weight="700" fill="#333333" text-anchor="start" dominant-baseline="central">3. Trên board</text>
<rect x="26" y="76" width="254" height="66" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="153.0" y="93" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">RKNN-Toolkit2 (PC)</text>
<text x="153.0" y="114" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">init_runtime(), target=None</text>
<path d="M153 142 L153 182" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="26" y="184" width="254" height="66" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="153.0" y="201" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">simulator</text>
<text x="153.0" y="222" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">trên Linux x86_64, không cần board</text>
<text x="30" y="276" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Kết quả có thể khác board:</text>
<text x="30" y="293" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">mức lệch là unknown.</text>
<text x="30" y="310" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Có thể lấy kết quả suy luận</text>
<text x="30" y="327" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">khi chưa có board.</text>
<rect x="323" y="76" width="254" height="56" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="93" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">RKNN-Toolkit2 (PC)</text>
<text x="450.0" y="114" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">init_runtime(target=&#x27;rk3588&#x27;)</text>
<path d="M450 132 L450 166" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="460" y="149" font-size="12" font-weight="400" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">adb (USB hoặc mạng)</text>
<rect x="323" y="168" width="254" height="52" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="185" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">rknn_server (board)</text>
<text x="450.0" y="206" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">proxy nhận lệnh từ PC</text>
<path d="M450 220 L450 250" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="460" y="235" font-size="12" font-weight="400" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">gọi RKNPU2 C API</text>
<rect x="323" y="252" width="254" height="52" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="269" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">librknnrt.so (board)</text>
<text x="450.0" y="290" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">RKNPU2 Runtime</text>
<path d="M450 304 L450 328" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="323" y="330" width="254" height="44" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="347" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">NPU</text>
<text x="450" y="392" font-size="12" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Kết quả gửi về PC; thêm bước sao chép</text>
<text x="450" y="408" font-size="12" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">và truyền dữ liệu (UG232 tr.171)</text>
<rect x="620" y="76" width="254" height="66" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="747.0" y="93" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">Ứng dụng trên board</text>
<text x="747.0" y="114" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">RKNN-Toolkit-Lite2 (Python)</text>
<text x="747.0" y="130" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">hoặc C API</text>
<path d="M747 142 L747 176" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="620" y="178" width="254" height="52" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="747.0" y="195" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">librknnrt.so (board)</text>
<text x="747.0" y="216" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">RKNPU2 Runtime</text>
<path d="M747 230 L747 254" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="620" y="256" width="254" height="44" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="747.0" y="273" font-size="14.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">NPU</text>
<rect x="620" y="316" width="254" height="98" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="628" y="332" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>RKNN-Toolkit-Lite2 có cần</tspan></text>
<text x="628" y="349" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>rknn_server hay không; không có</tspan></text>
<text x="628" y="366" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>câu nào nói trực tiếp. rknn_server</tspan></text>
<text x="628" y="383" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>là proxy nhận lệnh từ PC qua USB</tspan></text>
<text x="628" y="400" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>(UG232 tr.16).</tspan></text>
<text x="10" y="446" font-size="15" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">So sánh ba chế độ</text>
<rect x="10" y="460" width="880" height="28" fill="#E8E8E8"/>
<text x="18" y="474.0" font-size="12" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Mục</text>
<text x="148" y="474.0" font-size="12" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Simulator</text>
<text x="398" y="474.0" font-size="12" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">PC nối board</text>
<text x="648" y="474.0" font-size="12" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Trên board</text>
<path d="M10 488 L890 488" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="508.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>init_runtime</tspan></text>
<text x="148" y="500.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>target=None</tspan></text>
<text x="148" y="516.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>(mặc định, API232 tr.16)</tspan></text>
<text x="398" y="500.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>target=&#x27;rk3588&#x27;</tspan></text>
<text x="398" y="516.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>(UG232 tr.29)</tspan></text>
<text x="648" y="500.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Lite2: init_runtime(core_mask=...)</tspan></text>
<text x="648" y="516.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>không đặt target (UG232 tr.39)</tspan></text>
<path d="M10 529 L890 529" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="557.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>eval_perf</tspan></text>
<text x="148" y="549.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>cần model chạy trên chip</tspan></text>
<text x="148" y="565.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>nối với PC (API232 tr.18)</tspan></text>
<text x="398" y="557.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>có (API232 tr.18)</tspan></text>
<text x="648" y="541.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>RKNNLite không có hàm eval_perf;</tspan></text>
<text x="648" y="557.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>log từng lớp: RKNN_LOG_LEVEL=4</tspan></text>
<text x="648" y="573.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>hoặc RKNNLite(verbose=True)</tspan></text>
<path d="M10 586 L890 586" stroke="#BBBBBB" stroke-width="0.8"/>
<text x="18" y="606.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Tốc độ</tspan></text>
<text x="148" y="598.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>tài liệu khuyên dùng board nối PC</tspan></text>
<text x="148" y="614.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>hoặc trên board hơn (UG232 tr.171)</tspan></text>
<text x="398" y="598.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>chậm hơn C API trên board</tspan></text>
<text x="398" y="614.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>vì sao chép và truyền dữ liệu</tspan></text>
<text x="648" y="598.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>hiệu năng thực của NPU</tspan></text>
<text x="648" y="614.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>lấy theo C API trên board</tspan></text>
<rect x="10" y="460" width="880" height="167" fill="none" stroke="#999999" stroke-width="1"/>
<path d="M140 460 L140 627" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M390 460 L390 627" stroke="#CCCCCC" stroke-width="0.8"/>
<path d="M640 460 L640 627" stroke="#CCCCCC" stroke-width="0.8"/>
<rect x="10" y="646" width="880" height="90" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="662" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Phiên bản: </tspan><tspan>RKNN Server, Runtime library và RKNN-Toolkit2 phải cùng phiên bản (UG232 tr.17).</tspan></text>
<text x="22" y="681" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Chuẩn bị nối board: </tspan><tspan>thường cần cập nhật rknn_server và librknnrt.so trên board rồi khởi động rknn_server bằng tay (rknn_server_proxy.md dòng 6).</tspan></text>
<text x="22" y="700" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Khởi động: </tspan><tspan>nohup /usr/bin/rknn_server &gt;/dev/null&amp; (UG232 tr.16); lỗi &quot;The rknn_server on the connected device is abnormal&quot; nghĩa là chưa chạy (QS232 tr.29).</tspan></text>
<text x="22" y="719" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">RKNN-Toolkit2 bản ARM64: </tspan><tspan>cài trên board, không cần adb và RKNN Server (UG232 tr.11, 16, 17); cần librknnrt.so.</tspan></text>
<rect x="10" y="752" width="51" height="22" rx="11" fill="white" stroke="#C62828" stroke-width="1.8"/>
<text x="35.5" y="763.5" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">T3 đo</text>
<text x="100" y="763" font-size="12.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Log nối board từ PC (2026-09-18) và log đo (2026-10-10), Orange Pi 5</text>
<rect x="10" y="780" width="880" height="90" rx="6" fill="#EAF6EA" stroke="#2E7D32" stroke-width="1"/>
<text x="22" y="796" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Board có librknnrt 2.3.0, PC dùng rknn-toolkit2 2.3.2: log ghi đây là nguyên nhân lỗi kết nối. Đẩy</tspan></text>
<text x="22" y="815" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>librknnrt.so 2.3.2 lên /usr/lib, khởi động lại rknn_server; get_sdk_version() ra 2.3.2 ở cả ba chỗ.</tspan></text>
<text x="22" y="834" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Log ghi: nếu init_runtime báo device not found, chạy tay adb connect &lt;ip&gt;:5555 bằng adb đi kèm toolkit.</tspan></text>
<text x="22" y="853" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>adb hệ thống v41 thay adb server v40 của toolkit làm lần chạy đầu thất bại; dùng adb của toolkit.</tspan></text>
<rect x="10" y="882" width="880" height="80" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="896.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>chỗ đặt librknnrt.so: UG232 tr.18 lệnh push tới /usr/lib64, QS232 tr.17 và rknn_server_proxy.md dòng 103 tới</tspan></text>
<text x="20" y="913.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>/usr/lib; log T3 chỉ cho biết board này có /usr/lib/librknnrt.so, không phân xử hai tài liệu;</tspan></text>
<text x="20" y="930.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>giao thức NTB của list_devices (API232 tr.23 chỉ nêu có hai chế độ ADB và NTB);</tspan></text>
<text x="20" y="947.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>độ trễ eval_perf qua board nối PC so với C API trên board (UG232 tr.175 chỉ so rknn.inference với eval_perf).</tspan></text>
<rect x="10" y="974" width="880" height="100" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="24" y="991" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Chú thích</text>
<path d="M26 1014 L66 1014" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="78" y="1014" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>gọi hàm, truyền lệnh hoặc dữ liệu</tspan></text>
<rect x="26" y="1028" width="38" height="16" rx="2" fill="#EAF6EA" stroke="#BBBBBB"/>
<text x="78" y="1036" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>T3: ghi trong log có trên đĩa</tspan></text>
<rect x="26" y="1050" width="38" height="16" rx="2" fill="#FFF3F3" stroke="#BBBBBB"/>
<text x="78" y="1058" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>unknown: nguồn không cho, hoặc hai tài liệu nói khác nhau</tspan></text>
<text x="10" y="1100" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: UG232 tr.11, 16, 17, 18, 29, 39, 74, 171, 175; API232 tr.16, 18, 23; QS232 tr.17, 29; rknn_server_proxy.md; LOG 2026-09-18, 2026-10-10.</text>
</svg>