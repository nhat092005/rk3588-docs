<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1288" width="900" height="1288" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="1288" fill="white"/>
<rect x="808" y="8" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="848.3" y="19.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="10" y="22" font-size="15" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Một op chạy trên NPU hay rơi sang CPU: những gì nguồn cho biết</text>
<rect x="10" y="46" width="290" height="123" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="63" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">1. Toolkit nhận op này khi convert?</text>
<text x="22" y="86" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">OPSUP: bảng &#x27;ONNX OPs supported by RKNN</text>
<text x="22" y="103" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Toolkit2&#x27;, cột Remarks (Not Supported hoặc</text>
<text x="22" y="120" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">trống). Giới hạn chi tiết nằm ở OPL.</text>
<rect x="360" y="46" width="530" height="123" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="372" y="63" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Không nhận: dừng ở bước convert</text>
<text x="372" y="86" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">UG232 tr.167: convert thử trực tiếp, nếu không hỗ trợ sẽ có thông báo.</text>
<text x="372" y="103" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">NonMaxSuppression ghi Not Supported trong OPSUP; UG232 tr.168 gợi ý bỏ phần hậu xử lý</text>
<text x="372" y="120" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">khỏi graph và xử lý riêng ở phía CPU.</text>
<text x="372" y="137" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Op 6 chiều: UG232 tr.168 &#x27;RKNN does not support 6-dimensional OP&#x27;; phần lớn chỉ hỗ trợ</text>
<text x="372" y="154" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">4 chiều.</text>
<path d="M300 107.5 L360 107.5" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="304" y="97.5" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Không</text>
<path d="M155 169 L155 203" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="163.0" y="186" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Có</text>
<rect x="10" y="203" width="290" height="171" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="220" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">2. Op có mục trong OPL 3.2 (RK3588),</text>
<text x="22" y="240" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">và kích thước, kiểu dữ liệu, thuộc</text>
<text x="22" y="260" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">tính nằm trong giới hạn của mục đó?</text>
<rect x="360" y="203" width="530" height="72" rx="6" fill="#EAF2FF" stroke="#1E5BB8" stroke-width="1"/>
<text x="372" y="220" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Đủ điều kiện: chạy trên NPU</text>
<text x="372" y="243" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Suy ra của bộ hình: UG232 tr.139 chỉ liệt kê ba lý do khiến op chạy ngoài NPU (hộp bên</text>
<text x="372" y="260" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">dưới); nguồn không có câu nói thẳng &#x27;đủ điều kiện thì chạy trên NPU&#x27;.</text>
<rect x="360" y="285" width="530" height="89" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="372" y="302" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Cấu trúc một mục OPL (ví dụ 3.2.1 Add, PDF 56)</text>
<text x="372" y="325" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Mô tả; input list (shape, kiểu lượng tử hóa); output list; ràng buộc kiểu dữ liệu</text>
<text x="372" y="342" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(int8, float16); thuộc tính; mục 其他支持 có dòng 多核联合 (chạy đa core).</text>
<text x="372" y="359" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Mục 3.2 là RK3588: PDF 56 đến 107, 79 mục (phép đếm của bộ hình).</text>
<path d="M300 239 L360 239" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="304" y="229.0" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Có</text>
<path d="M155 374 L155 408" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="163.0" y="391" font-size="12.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Không</text>
<rect x="10" y="408" width="290" height="123" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="425" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">3. Op không chạy trên NPU</text>
<text x="22" y="448" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Trong bảng lớp (eval_perf) cột Target ghi CPU</text>
<text x="22" y="465" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(UG232 tr.75 và tr.139 cho ví dụ bảng).</text>
<rect x="360" y="408" width="530" height="123" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="372" y="425" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Ba lý do theo UG232 tr.139</text>
<text x="372" y="448" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">1. The operator size exceeds the limit (see the operator size limit in the OpList</text>
<text x="372" y="465" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">document)</text>
<text x="372" y="482" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">2. The operator does not yet support operation on NPU (check whether OpList supports</text>
<text x="372" y="499" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">this operator)</text>
<text x="372" y="516" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">3. NPU hardware limitations cannot support it</text>
<path d="M300 469.5 L360 469.5" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<path d="M155 531 L155 561" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="10" y="561" width="880" height="106" rx="6" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="22" y="578" font-size="14" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Rơi sang thiết bị nào, theo quy tắc nào: OPL không nêu</text>
<text x="22" y="601" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">OPL mục 3.2 chỉ mô tả từng op NPU; chương 4 &#x27;CPU OPs&#x27; (PDF 319 đến 334) liệt kê op có phiên bản CPU, mục 4.1 chỉ ghi ngoại lệ của RK2118 và</text>
<text x="22" y="618" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">RV1106, RV1103, RV1106B, RV1103B. Nguồn không nói RK3588 dùng chương 4 thế nào.</text>
<text x="22" y="635" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Đã biết: API232 tr.17 fallback_prior_device, &#x27;gpu&#x27; hoặc &#x27;cpu&#x27;, mặc định &#x27;cpu&#x27;; &#x27;gpu&#x27; chỉ hợp lệ với chip có GPU.</text>
<text x="22" y="652" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Chưa biết (unknown): quy tắc rơi về CPU của OPL; thuật toán chọn đích của op_target = &#x27;auto&#x27;.</text>
<text x="10" y="689" font-size="15" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Người dùng can thiệp</text>
<rect x="10" y="703" width="430" height="140" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="720" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">op_target (API232 tr.9)</text>
<text x="22" y="743" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Ép đích chạy từng op: {&#x27;op0_output_name&#x27;:&#x27;cpu&#x27;, ...} hoặc theo</text>
<text x="22" y="760" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">op_type {&#x27;Add&#x27;:&#x27;cpu&#x27;}.</text>
<text x="22" y="777" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Giá trị: &#x27;cpu&#x27;, &#x27;npu&#x27;, &#x27;gpu&#x27;, &#x27;auto&#x27;; &#x27;auto&#x27; là tự chọn đích.</text>
<text x="22" y="794" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Tên tensor đầu ra của op lấy từ kết quả accuracy_analysis.</text>
<rect x="450" y="703" width="440" height="140" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="462" y="720" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">optimization_level (API232 tr.8)</text>
<text x="462" y="743" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Mặc định 3. Giá trị 2 hoặc 1 tắt một số tối ưu có thể ảnh hưởng độ</text>
<text x="462" y="760" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">chính xác; 0 tắt hết.</text>
<text x="462" y="777" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">UG232 tr.176: với optimization_level=2 &#x27;the Resize Op will use the</text>
<text x="462" y="794" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">CPU&#x27;.</text>
<text x="462" y="811" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">T3: không tái hiện với Resize nearest 2x INT8 (Target = NPU ở level 1,</text>
<text x="462" y="828" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">2, 3); bilinear và FP16 chưa thử, nên không kết luận UG232 sai.</text>
<text x="10" y="865" font-size="15" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Cách xem op thật sự chạy ở đâu</text>
<rect x="10" y="879" width="430" height="106" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="896" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Công cụ của vendor</text>
<text x="22" y="919" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Bảng lớp của eval_perf: cột Target (NPU hoặc CPU) và WorkLoad(0/1/2)</text>
<text x="22" y="936" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(UG232 tr.75).</text>
<text x="22" y="953" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">accuracy_analysis trả tên tensor đầu ra của từng op, dùng làm khóa</text>
<text x="22" y="970" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">cho op_target (API232 tr.9).</text>
<rect x="450" y="879" width="440" height="106" rx="6" fill="#EAF6EA" stroke="#2E7D32" stroke-width="1"/>
<text x="462" y="896" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">T3 đo</text>
<text x="462" y="919" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">YOLOv8n INT8, 119 lớp: Target = CPU chỉ ở Transpose (1 lớp) cùng</text>
<text x="462" y="936" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">InputOperator và OutputOperator; 116 lớp còn lại là NPU.</text>
<text x="462" y="953" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Một model (trọng số ngẫu nhiên, 640x640, toolkit 2.3.2, RK3588S); đếm</text>
<text x="462" y="970" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">từ bảng lớp CORE_0_1_2.</text>
<text x="10" y="1007" font-size="15" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Hai nghĩa khác nhau của &#x27;fallback&#x27;</text>
<rect x="10" y="1021" width="430" height="89" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="22" y="1038" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Rời NPU</text>
<text x="22" y="1061" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">API232 tr.17 fallback_prior_device: &#x27;set fallback prior device when</text>
<text x="22" y="1078" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">OP is not supported by NPU&#x27;. Op rời NPU, sang CPU (mặc định) hoặc</text>
<text x="22" y="1095" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">GPU.</text>
<rect x="450" y="1021" width="440" height="89" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="462" y="1038" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Về core 0 của NPU</text>
<text x="462" y="1061" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">UG152 tr.27: &#x27;Other type of op will fallback to Core0 to continue</text>
<text x="462" y="1078" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">running.&#x27; Op không có tách task đa core chạy ở core 0, vẫn là NPU</text>
<text x="462" y="1095" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(Hình 2.4).</text>
<rect x="10" y="1126" width="880" height="122" rx="6" fill="white" stroke="#999999" stroke-width="1"/>
<text x="24" y="1143" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Chú thích</text>
<path d="M26 1166 L66 1166" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="78" y="1166" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>thứ tự xét</tspan></text>
<rect x="26" y="1180" width="38" height="16" rx="2" fill="#EAF2FF" stroke="#BBBBBB"/>
<text x="78" y="1188" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>suy ra của bộ hình (không phải câu của vendor)</tspan></text>
<rect x="26" y="1202" width="38" height="16" rx="2" fill="#EAF6EA" stroke="#BBBBBB"/>
<text x="78" y="1210" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>số đo T3 có file log</tspan></text>
<rect x="26" y="1224" width="38" height="16" rx="2" fill="#FFF3F3" stroke="#BBBBBB"/>
<text x="78" y="1232" font-size="13" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>unknown: nguồn không cho</tspan></text>
<text x="10" y="1274" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: OPL PDF 56, 319, 335; UG232 tr.75, 139, 167, 168, 176; UG152 tr.27; API232 tr.8, 9, 17; OPSUP; LOG t3-board-silu-resize/raw.</text>
</svg>