<rect x="808" y="8" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="844.6" y="19.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="20" font-size="17" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Cùng một mảng MAC, vì sao không chạy ở đỉnh: kiểu số và shape của lớp</text>
<text x="10" y="52" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">A. TPU: tốc độ Matrix Unit theo độ rộng weight và activation (TPU tr.3)</text>
<rect x="10" y="66" width="450" height="178" rx="6" fill="white" stroke="#999999" stroke-width="1.2"/>
<text x="24" y="84" font-size="12.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">8-bit weight, 8-bit activation</text>
<rect x="24" y="94" width="260" height="20" rx="2" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="0.8"/>
<rect x="24" y="94" width="260.0" height="20" rx="2" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="0.8"/>
<text x="294" y="104" font-size="12.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">x1  đầy đủ (256x256 MAC)</text>
<text x="24" y="134" font-size="12.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">8-bit và 16-bit trộn (một chiều 16)</text>
<rect x="24" y="144" width="260" height="20" rx="2" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="0.8"/>
<rect x="24" y="144" width="130.0" height="20" rx="2" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="0.8"/>
