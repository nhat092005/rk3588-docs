<text x="24" y="184" font-size="12.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">cả hai 16-bit</text>
<rect x="24" y="194" width="260" height="20" rx="2" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="0.8"/>
<rect x="24" y="194" width="65.0" height="20" rx="2" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="0.8"/>
