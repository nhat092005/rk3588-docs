<text x="24" y="232" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Cùng phần cứng, đổi kiểu số là đổi số phép MAC mỗi chu kỳ.</tspan></text>
