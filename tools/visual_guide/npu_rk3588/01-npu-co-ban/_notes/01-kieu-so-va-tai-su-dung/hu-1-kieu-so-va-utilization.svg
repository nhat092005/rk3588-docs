<text x="50" y="514" font-size="12" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">non-matrix (không làm phép ma trận)</text>
<text x="20" y="540" font-size="11.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Hai phần xanh lá cộng lại là array active cycles (hàng 1 = hàng 2 + hàng 3 của Table 3).</text>
<rect x="10" y="554" width="880" height="70" rx="5" fill="#F7FBF7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="22" y="570" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">CNN1 (TPU tr.6): </tspan><tspan>&quot;only about half of the 65,536 MACs hold useful weights because some layers in CNN1</tspan></text>
<text x="22" y="588" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>have shallow feature depths&quot;. </tspan><tspan>Lớp có ít kênh không lấp đầy mảng 256x256: chu kỳ vẫn chạy nhưng</tspan></text>
<text x="22" y="606" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>nửa số MAC trống. MLP0 thì khác: 53.9% chu kỳ là chờ nạp weight (giới hạn bộ nhớ, Hình 1.4).</tspan></text>
<text x="10" y="648" font-size="14" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">C. Liên hệ RK3588</text>
<rect x="165" y="637" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="205.3" y="648.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<rect x="10" y="662" width="880" height="58" rx="5" fill="white" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="22" y="678" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>eval_perf có cột </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">MacUsage(%)</tspan><tspan> = &quot;MAC usage&quot; của từng lớp (UG232 tr.32; công cụ đo ở Hình 7.3).</tspan></text>
<text x="22" y="698" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>NPU load </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">/sys/kernel/debug/rknpu/load</tspan><tspan> không phải MAC utilization: &quot;does not directly represent&quot; (UG232 tr.137).</tspan></text>
<rect x="10" y="728" width="880" height="29" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="20" y="742.5" font-size="12" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">unknown: </tspan><tspan>RK3588 lấp mảng MAC thế nào khi lớp có ít kênh; TRM không mô tả. Căn kênh theo bội: xem Hình 6.4.</tspan></text>
<text x="10" y="780" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: TPU tr.3, tr.6, tr.7 (Table 3); TRM1 tr.1984; UG232 tr.32, tr.137.</text>
