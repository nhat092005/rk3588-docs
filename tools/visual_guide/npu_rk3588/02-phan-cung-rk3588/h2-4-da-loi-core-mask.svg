<rect x="140" y="476" width="176" height="124" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="228.0" y="493" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">1. Userspace gửi job</text>
<text x="228.0" y="514" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">core_mask và</text>
<text x="228.0" y="530" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">subcore_task[5]:</text>
<text x="228.0" y="546" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">mỗi phần tử gồm</text>
<text x="228.0" y="562" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">task_start, task_number</text>
<rect x="328" y="476" width="176" height="124" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="416.0" y="493" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">2. Chọn core</text>
<text x="416.0" y="514" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">mask hợp lệ: 0x1 0x2 0x4</text>
<text x="416.0" y="530" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">0x3 0x7 (khác: báo lỗi)</text>
<text x="416.0" y="546" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">AUTO = 0x0: core có</text>
<text x="416.0" y="562" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">task_num nhỏ nhất;</text>
<text x="416.0" y="578" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">hòa: core số nhỏ; chạy 1 core</text>
<rect x="516" y="476" width="176" height="124" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="604.0" y="493" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">3. Hàng đợi</text>
<text x="604.0" y="514" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">mỗi core có todo_list</text>
<text x="604.0" y="530" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">riêng; job nhiều core</text>
<text x="604.0" y="546" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">vào hàng đợi của</text>
<text x="604.0" y="562" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">từng core được chọn</text>
<rect x="704" y="476" width="176" height="124" rx="4" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="792.0" y="493" font-size="14" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">4. Commit xuống HW</text>
<text x="792.0" y="514" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">khi mọi core của job</text>
<text x="792.0" y="530" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">đã lấy job (run_count</text>
<text x="792.0" y="546" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">về 0); xong khi</text>
<text x="792.0" y="562" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">interrupt_count về 0</text>
