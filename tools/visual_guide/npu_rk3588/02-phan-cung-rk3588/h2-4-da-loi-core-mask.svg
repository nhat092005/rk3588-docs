<text x="150" y="721.5" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>          </tspan><tspan>vì sao op ngoài danh sách của UG152 tr.27 chạy về Core0.</tspan></text>
