<text x="154" y="638" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Phần việc theo core do userspace gửi sẵn: với 1 hoặc 2 core, task của core i lấy từ subcore_task[i];</tspan></text>
<text x="154" y="658" font-size="12.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>với 3 core, lấy từ subcore_task[i + 2]. Chỉ rknpu_job.c đọc subcore_task, để lấy task_start và task_number.</tspan></text>
<rect x="140" y="690" width="740" height="46" rx="4" fill="#FFF3F3" stroke="#C62828" stroke-width="1.3" stroke-dasharray="5 3"/>
