<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="390" fill="white"/>
<rect x="750" y="12" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="23.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="18" y="22" font-size="13.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Nghịch lý TOPS Danh định và Băng thông DRAM: So sánh Thực nghiệm trên eIQ Neutron</text>
<text x="18" y="36" font-size="7.5" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">Đối chiếu giữa NPU rời rạc 11 TOPS nghẽn bộ nhớ vs eIQ Neutron 2 TOPS có HW/SW Co-Design [T2 BAMB Table I &amp; III]</text>
<rect x="18" y="48" width="416" height="300" rx="6" fill="#FFF9F9" stroke="#DC2626" stroke-width="1.3"/>
<rect x="18" y="48" width="416" height="32" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.0"/>
<rect x="26" y="54" width="5" height="20" rx="2" fill="#C62828" stroke="#C62828" stroke-width="1"/>
<text x="36" y="61" font-size="9.6" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">A. NPU Rời rạc 11 TOPS: Nghẽn Băng thông DRAM</text>
<text x="36" y="72" font-size="6.8" font-weight="400" fill="#7F1D1D" text-anchor="start" dominant-baseline="central">Mảng MAC lớn nhưng thiếu Co-Design với Compiler &amp; SRAM [T2 BAMB tr.1, tr.9]</text>
<rect x="26" y="86" width="400" height="78" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="32" y="98" font-size="7.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Số liệu Đo lường Thực tế trên Phần cứng [Table I &amp; Table III]:</text>
<rect x="32" y="110" width="190" height="20" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="0.7"/>
<text x="38" y="120" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Peak TOPS Danh định:</text>
<text x="216" y="120" font-size="6.6" font-weight="700" fill="#444444" text-anchor="end" dominant-baseline="central">11.0 TOPS</text>
<rect x="228" y="110" width="190" height="20" rx="2" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.7"/>
<text x="234" y="120" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Effective ResNet50:</text>
<text x="412" y="120" font-size="6.6" font-weight="700" fill="#B91C1C" text-anchor="end" dominant-baseline="central">0.89 TOPS (8.1%)</text>
<rect x="32" y="134" width="190" height="20" rx="2" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.7"/>
<text x="38" y="144" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Effective EfficientNet:</text>
<text x="216" y="144" font-size="6.6" font-weight="700" fill="#B91C1C" text-anchor="end" dominant-baseline="central">0.26 TOPS (2.4%)</text>
<rect x="228" y="134" width="190" height="20" rx="2" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.7"/>
<text x="234" y="144" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Độ trễ MobileNetV3:</text>
<text x="412" y="144" font-size="6.6" font-weight="700" fill="#B91C1C" text-anchor="end" dominant-baseline="central">2.0 ms (LTP: 22.3)</text>
<rect x="26" y="170" width="400" height="80" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.0"/>
<rect x="26" y="170" width="400" height="16" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.8"/>
<text x="32" y="178" font-size="7.2" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">Cơ chế Vật lý: Mảng MAC Đói Dữ liệu (DRAM Starvation)</text>
<rect x="32" y="192" width="160" height="48" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="112" y="208" font-size="7.0" font-weight="700" fill="#64748B" text-anchor="middle" dominant-baseline="central">Mảng MAC 11 TOPS</text>
<text x="112" y="224" font-size="6.8" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">97.6% thời gian NHÀN RỖI!</text>
<path d="M198 216 L242 216" fill="none" stroke="#C62828" stroke-width="3.0" marker-end="url(#mC62828t)"/>
<text x="223" y="204" font-size="6.6" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Nghẽn DRAM</text>
<rect x="254" y="192" width="158" height="48" rx="3" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.9"/>
<text x="333" y="208" font-size="7.0" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">DRAM Bus 100% Quá tải</text>
<text x="333" y="224" font-size="6.6" font-weight="400" fill="#7F1D1D" text-anchor="middle" dominant-baseline="central">Tensor trung gian tràn ra DDR</text>
<rect x="26" y="256" width="400" height="84" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.8"/>
<text x="32" y="268" font-size="7.0" font-weight="700" fill="#991B1B" text-anchor="start" dominant-baseline="central">Kết luận Vật lý về NPU Rời rạc [T2 BAMB tr.1, tr.9]:</text>
<text x="32" y="284" font-size="6.6" font-weight="400" fill="#7F1D1D" text-anchor="start" dominant-baseline="central">• TOPS danh định cao chỉ phản ánh số nhân MAC trên silicon, không phản ánh hiệu năng</text>
<text x="32" y="300" font-size="6.6" font-weight="400" fill="#7F1D1D" text-anchor="start" dominant-baseline="central">• Thiếu SRAM và thiếu Layer Fusion -&gt; Mọi tensor trung gian đều phải qua DRAM ngoài</text>
<text x="32" y="316" font-size="6.6" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">• Kết quả: NPU 11 TOPS chậm hơn cả NPU 2 TOPS trên EfficientNet Lite0!</text>
<text x="32" y="330" font-size="6.6" font-weight="400" fill="#7F1D1D" text-anchor="start" dominant-baseline="central">• Độ trễ MobileNetV3 đạt 2.0 ms (chậm hơn 2.5x so với eIQ Neutron có co-design)</text>
<rect x="446" y="48" width="416" height="300" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<rect x="446" y="48" width="416" height="32" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.0"/>
<rect x="454" y="54" width="5" height="20" rx="2" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="464" y="61" font-size="9.6" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">B. eIQ Neutron 2 TOPS: Tối ưu nhờ HW/SW Co-Design</text>
<text x="464" y="72" font-size="6.8" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">Mảng tính toán vừa phải, giữ trọn dữ liệu trong TCM nhờ CP Solver [T2 BAMB tr.8-9]</text>
<rect x="454" y="86" width="400" height="78" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.9"/>
<text x="460" y="98" font-size="7.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Số liệu Đo lường Thực tế trên Phần cứng [Table I &amp; Table III]:</text>
<rect x="460" y="110" width="190" height="20" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="0.7"/>
<text x="466" y="120" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Peak TOPS Danh định:</text>
<text x="644" y="120" font-size="6.6" font-weight="700" fill="#444444" text-anchor="end" dominant-baseline="central">2.0 TOPS (Tiết kiệm silicon)</text>
<rect x="656" y="110" width="190" height="20" rx="2" fill="#ECFDF5" stroke="#22C55E" stroke-width="0.7"/>
<text x="662" y="120" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Effective ResNet50:</text>
<text x="840" y="120" font-size="6.6" font-weight="700" fill="#15803D" text-anchor="end" dominant-baseline="central">0.73 TOPS (Hiệu suất 36.5%)</text>
<rect x="460" y="134" width="190" height="20" rx="2" fill="#ECFDF5" stroke="#22C55E" stroke-width="0.7"/>
<text x="466" y="144" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Effective EfficientNet:</text>
<text x="644" y="144" font-size="6.6" font-weight="700" fill="#15803D" text-anchor="end" dominant-baseline="central">0.82 TOPS (41.0% - Gấp 3.15x!)</text>
<rect x="656" y="134" width="190" height="20" rx="2" fill="#ECFDF5" stroke="#22C55E" stroke-width="0.7"/>
<text x="662" y="144" font-size="6.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Độ trễ MobileNetV3:</text>
<text x="840" y="144" font-size="6.6" font-weight="700" fill="#15803D" text-anchor="end" dominant-baseline="central">0.8 ms (Nhanh gấp 2.5x!)</text>
<rect x="454" y="170" width="400" height="80" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.0"/>
<rect x="454" y="170" width="400" height="16" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.8"/>
<text x="460" y="178" font-size="7.2" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">Cơ chế Vật lý: Khai thác Triệt để TCM On-Chip (Memory Locality)</text>
<rect x="460" y="192" width="160" height="48" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.9"/>
<text x="540" y="208" font-size="7.0" font-weight="700" fill="#047857" text-anchor="middle" dominant-baseline="central">Mảng 4 Engine (2 TOPS)</text>
<text x="540" y="224" font-size="6.6" font-weight="400" fill="#065F46" text-anchor="middle" dominant-baseline="central">Hiệu suất tính toán cao (Compute-bound)</text>
<path d="M626 216 L670 216" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<text x="651" y="204" font-size="6.6" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">TCM Hit 100%</text>
<rect x="682" y="192" width="158" height="48" rx="3" fill="#F0FDF4" stroke="#22C55E" stroke-width="0.9"/>
<text x="761" y="208" font-size="7.0" font-weight="700" fill="#15803D" text-anchor="middle" dominant-baseline="central">TCM On-Chip (1 MiB SRAM)</text>
<text x="761" y="224" font-size="6.6" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">Layer Fusion giữ trọn activation</text>
<rect x="454" y="256" width="400" height="84" rx="4" fill="#F0FDF4" stroke="#22C55E" stroke-width="0.8"/>
<text x="460" y="268" font-size="7.0" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">Bài học Cốt lõi cho Kiến trúc Suy luận Biên [T2 BAMB tr.9]:</text>
<text x="460" y="284" font-size="6.6" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">• Đồng thiết kế HW/SW thông minh, không phải raw TOPS, quyết định hiệu năng biên thực tế</text>
<text x="460" y="300" font-size="6.6" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Tích hợp SRAM on-chip vừa vặn kết hợp CP tiling/fusion loại bỏ 90% truy cập DRAM</text>
<text x="460" y="316" font-size="6.6" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Tiết kiệm năng lượng và chi phí silicon mà vẫn đạt tốc độ suy luận vượt trội</text>
<text x="460" y="330" font-size="6.6" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Độ trễ MobileNetV3 chỉ 0.8 ms (vượt trội so với 2.0 ms của NPU 11 TOPS không co-design)</text>
<text x="10" y="376" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: T2 BAMB tr.1, tr.8-9 (Bamberg et al., IEEE 2025: Real-world effective TOPS vs advertised peak TOPS on production MPUs).</text>
</svg>