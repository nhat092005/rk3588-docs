<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 467" width="880" height="467" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="467" fill="white"/>
<rect x="750" y="14" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="25.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Huấn luyện nhận thức lượng tử (QAT) và Ước lượng Gradient STE (Nagel / Gholami)</text>
<rect x="20" y="50" width="480" height="148" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="20" y="50" width="480" height="32" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<text x="32" y="71" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="start" dominant-baseline="central">1. Lan truyền thuận: Mô phỏng lượng tử hóa (FakeQuant / Simulated Quant)</text>
<rect x="40" y="95" width="75" height="42" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="77" y="113" font-size="9.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Trọng số W</text>
<text x="77" y="126" font-size="8.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">FP32 liên tục</text>
<rect x="155" y="90" width="175" height="52" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="242" y="108" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle" dominant-baseline="central">Khối FakeQuant (Simulated)</text>
<text x="242" y="122" font-size="8.2" font-weight="400" fill="#78350F" text-anchor="middle" dominant-baseline="central">clamp(x, α, β) → round(x/s)</text>
<text x="242" y="134" font-size="8.2" font-weight="400" fill="#78350F" text-anchor="middle" dominant-baseline="central">→ dequantize = s × (q - z)</text>
<rect x="370" y="95" width="105" height="42" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="422" y="113" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">W_hat (FakeQuant)</text>
<text x="422" y="126" font-size="8.5" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">Giá trị rời rạc (FP32)</text>
<path d="M115 116 L149 116" fill="none" stroke="#1E5BB8" stroke-width="3.0" marker-end="url(#m1E5BB8t)"/>
<path d="M330 116 L364 116" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<text x="35" y="160" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Thực thi bằng phép toán float nhưng ép giá trị rơi đúng vào các mức rời rạc.</text>
<text x="35" y="175" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Giúp đồ thị học cách thích ứng với nhiễu lượng tử ngay trong quá trình hội tụ.</text>
<rect x="20" y="210" width="480" height="142" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="20" y="210" width="480" height="32" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<text x="32" y="231" font-size="10" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">2. Lan truyền ngược: Ước lượng Gradient STE (Straight-Through Estimator)</text>
<rect x="370" y="255" width="105" height="42" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.1"/>
<text x="422" y="273" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">dL / dW_hat</text>
<text x="422" y="286" font-size="8.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Gradient từ Loss</text>
<rect x="155" y="250" width="175" height="52" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="242" y="268" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">Ước lượng STE</text>
<text x="242" y="282" font-size="8.2" font-weight="400" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">dW_hat / dW ≈ 1 nếu α ≤ W ≤ β</text>
<text x="242" y="294" font-size="8.2" font-weight="400" fill="#7F1D1D" text-anchor="middle" dominant-baseline="central">dW_hat / dW = 0 nếu W &lt; α hoặc W &gt; β</text>
<rect x="40" y="255" width="75" height="42" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="77" y="273" font-size="9.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Cập nhật W</text>
<text x="77" y="286" font-size="8.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">W - η × dL/dW</text>
<path d="M370 276 L336 276" fill="none" stroke="#C62828" stroke-width="3.0" marker-end="url(#mC62828t)"/>
<path d="M155 276 L121 276" fill="none" stroke="#C62828" stroke-width="3.0" marker-end="url(#mC62828t)"/>
<text x="35" y="323" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Phép làm tròn round(x) có đạo hàm bằng 0 khắp nơi, khiến SGD bị tê liệt.</text>
<text x="35" y="338" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• STE bỏ qua làm tròn, truyền thẳng gradient 100% qua bộ lượng tử hóa [T2 Nagel].</text>
<rect x="520" y="50" width="340" height="335" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
<rect x="520" y="50" width="340" height="32" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<text x="690" y="71" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Đồ thị: Phép làm tròn bậc thang vs Đạo hàm STE</text>
<text x="535" y="98" font-size="9" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">(a) Hàm chuyển đổi FakeQuant(x): Bậc thang rời rạc</text>
<rect x="550" y="106" width="280" height="106" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<path d="M565 196 L815 196" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m64748Bn)"/>
<path d="M575 202 L575 114" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m64748Bn)"/>
<text x="810" y="204" font-size="8" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">x</text>
<text x="568" y="120" font-size="8" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">y</text>
<path d="M585 190 L800 122" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m94A3B8n)"/>
<text x="782" y="112" font-size="7.8" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="central">y = x (lý tưởng)</text>
<path d="M585 185 L629 185" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M635 185 L635 168" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M635 162 L689 162" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M695 162 L695 146" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M695 140 L749 140" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M755 140 L755 126" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<path d="M755 120 L794 120" fill="none" stroke="#2563EB" stroke-width="3.0" marker-end="url(#m2563EBt)"/>
<text x="585" y="136" font-size="7.8" font-weight="400" fill="#B91C1C" text-anchor="start" dominant-baseline="central">Đạo hàm thật = 0</text>
<text x="585" y="148" font-size="7.8" font-weight="400" fill="#B91C1C" text-anchor="start" dominant-baseline="central">tại mặt phẳng</text>
<text x="535" y="226" font-size="9" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">(b) Xấp xỉ đạo hàm STE: Hàm chữ nhật (Boxcar)</text>
<rect x="550" y="234" width="280" height="100" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<path d="M565 310 L815 310" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#m64748Bn)"/>
<text x="570" y="305" font-size="8" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">0</text>
<path d="M565 310 L620 310" fill="none" stroke="#DC2626" stroke-width="3.0"/>
<path d="M620 310 L620 256" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M620 256 L750 256" fill="none" stroke="#DC2626" stroke-width="3.0"/>
<text x="685" y="248" font-size="8.5" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">d(y)/dx = 1.0 (STE)</text>
<path d="M750 256 L750 310" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M750 310 L815 310" fill="none" stroke="#DC2626" stroke-width="3.0"/>
<text x="620" y="322" font-size="8" font-weight="400" fill="#0F172A" text-anchor="middle" dominant-baseline="central">α (q_min)</text>
<text x="750" y="322" font-size="8" font-weight="400" fill="#0F172A" text-anchor="middle" dominant-baseline="central">β (q_max)</text>
<text x="685" y="324" font-size="8" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">Vùng gradient truyền thẳng</text>
<text x="535" y="350" font-size="8.2" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">• Ngoài [α, β]: gradient = 0 triệt tiêu các trọng số trôi quá xa.</text>
<text x="535" y="365" font-size="8.2" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">• Trong [α, β]: gradient giữ nguyên cho phép cập nhật FP32.</text>
<rect x="20" y="385" width="840" height="50" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="32" y="403" font-size="10" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Ý nghĩa thực tiễn của QAT (Nagel 2021 tr.19, Gholami 2021 tr.9):</text>
<text x="32" y="419" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">QAT giải quyết tình trạng sụt giảm độ chính xác ở các lớp cực kỳ nhạy cảm (như 4-bit hoặc activation hẹp) mà PTQ không khắc phục được.</text>
<text x="10" y="463" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T2 Nagel 2021 tr.6, tr.19] [T2 Gholami 2021 tr.9]</text>
</svg>