 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="460" fill="white"/>
<rect x="750" y="14" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="25.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Quy trình tái tham số hóa RepVGG: Huấn luyện đa nhánh → Suy luận đơn nhánh (Ding 2021)</text>
<rect x="20" y="52" width="214" height="314" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="20" y="52" width="214" height="32" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<text x="127" y="72" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">1. Khi Huấn luyện (Multi-Branch)</text>
<rect x="34" y="90" width="186" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="127" y="102" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Tensor đầu vào M^(1)</text>
<rect x="62" y="126" width="126" height="28" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
<text x="125" y="137" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle" dominant-baseline="central">Conv 3×3 + BN</text>
<text x="125" y="147" font-size="7.2" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Trích đặc trưng sâu</text>
<rect x="62" y="162" width="126" height="28" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="125" y="173" font-size="8.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Conv 1×1 + BN</text>
<text x="125" y="183" font-size="7.2" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Tương quan kênh</text>
<rect x="62" y="198" width="126" height="28" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.1"/>
<text x="125" y="209" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="central">Identity + BN</text>
<text x="125" y="219" font-size="7.2" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Đường tắt gradient</text>
