<text x="278" y="318" font-size="8.5" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Tương đương toán học 100% với mạng gốc [T2 REPVGG tr.5].</text>
<text x="278" y="332" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Quá trình hợp nhất diễn ra hoàn toàn offline trước khi nạp.</text>
<text x="278" y="346" font-size="8.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">• Triệt tiêu hoàn toàn toán tử Add (+) trong runtime NPU.</text>
<rect x="648" y="52" width="214" height="314" rx="5" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.3"/>
<rect x="648" y="52" width="214" height="32" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.0"/>
<text x="755" y="72" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">3. Khi Suy luận (Single Conv)</text>
<rect x="668" y="92" width="174" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="755" y="108" font-size="9" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">Tensor đầu vào M^(1)</text>
<path d="M755 118 L755 142" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<rect x="666" y="148" width="178" height="76" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<text x="755" y="170" font-size="10" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">DUY NHẤT CONV 3×3</text>
<text x="755" y="186" font-size="8.5" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">W_final (kernel 3×3)</text>
<text x="755" y="200" font-size="8.5" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">+ b_final (bias 1D)</text>
<text x="755" y="214" font-size="8.5" font-weight="400" fill="#166534" text-anchor="middle" dominant-baseline="central">+ Hàm kích hoạt ReLU</text>
<path d="M755 224 L755 248" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<rect x="668" y="254" width="174" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="755" y="270" font-size="9" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">Tensor đầu ra M^(2)</text>
<text x="662" y="302" font-size="9" font-weight="700" fill="#166534" text-anchor="start" dominant-baseline="central">+ Tối ưu bộ nhớ SRAM:</text>
<text x="662" y="317" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">  Giải phóng ngay M^(1) khi tính xong.</text>
<text x="662" y="332" font-size="9" font-weight="700" fill="#166534" text-anchor="start" dominant-baseline="central">+ Tăng tốc thông lượng phần cứng:</text>
<text x="662" y="347" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">  Không overhead khởi động kernel [T2].</text>
<path d="M234 204 L252 204" fill="none" stroke="#222222" stroke-width="3.0" marker-end="url(#m222222t)"/>
<path d="M626 204 L642 204" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<rect x="20" y="380" width="840" height="48" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="32" y="398" font-size="10" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Ý nghĩa then chốt trên NPU vi xử lý biên (Rockchip RK3588):</text>
<text x="32" y="414" font-size="8.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">NPU hoạt động hiệu quả nhất với các lớp Conv 3×3 tuần tự dày đặc. Tái tham số hóa RepVGG loại bỏ hoàn toàn các toán tử Add và BN rời rạc, tối đa hóa tỷ lệ lấp đầy mảng PE MAC [T2 REPVGG tr.2, Chu 2024 QARepVGG tr.1].</text>
<text x="10" y="456" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T2 Ding et al. RepVGG 2021 tr.2, tr.5] [T2 Chu et al. QARepVGG 2024 tr.1, tr.5]</text>
</svg>