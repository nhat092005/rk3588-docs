<text x="278" y="264" font-size="9" font-weight="700" fill="#92400E" text-anchor="start" dominant-baseline="central">Bước 4: Cộng đại số toàn bộ trọng số và vector bias</text>
<text x="278" y="279" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="start" dominant-baseline="central">W_final = W&#x27;_3x3 + pad(W&#x27;_1x1) + pad(W&#x27;_id)</text>
<text x="278" y="293" font-size="8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">b_final = b&#x27;_3x3 + b&#x27;_1x1 + b&#x27;_id  (Biến đổi tuyến tính)</text>
