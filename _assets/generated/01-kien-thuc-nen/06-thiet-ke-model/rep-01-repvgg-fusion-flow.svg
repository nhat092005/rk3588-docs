<rect x="34" y="298" width="186" height="26" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
<text x="127" y="311" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Đầu ra M^(2) (trước ReLU)</text>
<text x="26" y="335" font-size="8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Nhiều nhánh giúp gradient hội tụ tốt.</text>
<text x="26" y="348" font-size="8" font-weight="400" fill="#B91C1C" text-anchor="start" dominant-baseline="central">• Tốn thêm SRAM để giữ bản sao M^(1).</text>
<text x="26" y="360" font-size="8" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">• Phân mảnh toán tử trên NPU [T2 REPVGG].</text>
<rect x="258" y="52" width="368" height="314" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="258" y="52" width="368" height="32" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<text x="442" y="72" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">2. Bốn bước biến đổi toán học offline (Ding 2021)</text>
<rect x="270" y="92" width="344" height="46" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="278" y="107" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="start" dominant-baseline="central">Bước 1: Gộp BN vào từng nhánh Conv &amp; Identity</text>
<text x="278" y="123" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">W&#x27; = (γ / σ) × W,   b&#x27; = β - (μ × γ / σ)  [T2 REPVGG Eq. 3]</text>
<rect x="270" y="144" width="344" height="46" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="278" y="159" font-size="9" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Bước 2: Đệm không (Zero-pad) kernel 1×1 thành 3×3</text>
<text x="278" y="175" font-size="8.3" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">pad(W&#x27;_1x1): Đặt 1×1 vào tâm ma trận 3×3</text>
