<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 473" width="880" height="473" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="473" fill="white"/>
<rect x="750" y="14" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="25.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Quá trình biến đổi từ Đồ thị Huấn luyện (Training DAG) sang Đồ thị Suy luận (Inference DAG)</text>
<rect x="16" y="40" width="250" height="395" rx="5" fill="#FFF9F9" stroke="#C62828" stroke-width="1.3"/>
<rect x="26" y="50" width="160" height="22" rx="3" fill="#C62828" stroke="#C62828" stroke-width="1"/>
<text x="106" y="61" font-size="9.2" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">ĐỒ THỊ HUẤN LUYỆN (Train)</text>
<rect x="26" y="78" width="230" height="34" rx="3" fill="#F8FAFC" stroke="#444444" stroke-width="1"/>
<text x="141.0" y="90" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Input đa tỷ lệ (Dynamic)</text>
<text x="141.0" y="103" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Kích thước biến thiên (320..640)</text>
<rect x="26" y="118" width="230" height="34" rx="3" fill="#FEE2E2" stroke="#C62828" stroke-width="1"/>
<text x="141.0" y="130" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Lớp tích chập tuần tự</text>
<text x="141.0" y="143" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Conv(W) tách biệt BatchNorm(mean, var)</text>
<rect x="26" y="158" width="230" height="34" rx="3" fill="#FFFBEB" stroke="#E65100" stroke-width="1"/>
<text x="141.0" y="170" font-size="8.5" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Đầu kép (Dual Heads)</text>
<text x="141.0" y="183" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Nhánh một-nhiều (Aux) + Nhánh 1-1</text>
<rect x="26" y="198" width="230" height="34" rx="3" fill="#FEE2E2" stroke="#C62828" stroke-width="1"/>
<text x="141.0" y="210" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Cụm tính Loss (Phức tạp)</text>
<text x="141.0" y="223" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">ProgLoss, STAL, CIoU, DFL, BCE</text>
<rect x="26" y="238" width="230" height="34" rx="3" fill="#FFF1F2" stroke="#C62828" stroke-width="1"/>
<text x="141.0" y="250" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Băng ghi Gradient (Autograd)</text>
<text x="141.0" y="263" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Lưu intermediate activations trên VRAM</text>
<rect x="26" y="278" width="230" height="34" rx="3" fill="#F8FAFC" stroke="#444444" stroke-width="1"/>
<text x="141.0" y="290" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Cập nhật Optimizer</text>
<text x="141.0" y="303" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Momentum, AdamW trạng thái động</text>
<rect x="26" y="320" width="230" height="105" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="34" y="336" font-size="8.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc điểm pha huấn luyện:</text>
<text x="34" y="354" font-size="8" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">• Đồ thị động, kích thước lớn</text>
<text x="34" y="372" font-size="8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Bộ nhớ VRAM tiêu tốn nhiều</text>
<text x="34" y="390" font-size="8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Không thể chạy trên NPU biên</text>
<text x="34" y="408" font-size="8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Nhiều nhánh chỉ dùng backward</text>
<rect x="296" y="40" width="280" height="395" rx="5" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.3"/>
<rect x="306" y="50" width="185" height="22" rx="3" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="1"/>
<text x="398" y="61" font-size="9.2" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">CƠ CHẾ BIẾN ĐỔI (model.fuse)</text>
<rect x="306" y="78" width="260" height="44" rx="3" fill="white" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="436.0" y="93" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">1. Conv + BatchNorm Fusion</text>
<text x="436.0" y="108" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Gấp affine BN vào trọng số: W_fuse, b_fuse</text>
<rect x="306" y="134" width="260" height="44" rx="3" fill="white" stroke="#E65100" stroke-width="1.2"/>
<text x="436.0" y="149" font-size="8.8" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">2. Cắt tỉa nhánh phụ trợ (Prune)</text>
<text x="436.0" y="164" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Xóa bỏ hoàn toàn One-to-Many Auxiliary Head</text>
<rect x="306" y="190" width="260" height="44" rx="3" fill="white" stroke="#444444" stroke-width="1.2"/>
<text x="436.0" y="205" font-size="8.8" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">3. Ngắt toàn bộ nút tính Loss</text>
<text x="436.0" y="220" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">ProgLoss, CIoU chỉ dùng train, không export</text>
<rect x="306" y="246" width="260" height="44" rx="3" fill="white" stroke="#2E7D32" stroke-width="1.2"/>
<text x="436.0" y="261" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">4. Khóa hằng số (Constant Fold)</text>
<text x="436.0" y="276" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Cố định input (1,3,640,640), gỡ dead code</text>
<rect x="306" y="302" width="260" height="44" rx="3" fill="white" stroke="#00796B" stroke-width="1.2"/>
<text x="436.0" y="317" font-size="8.8" font-weight="700" fill="#00796B" text-anchor="middle" dominant-baseline="central">5. Loại bỏ DFL &amp; NMS (YOLO26)</text>
<text x="436.0" y="332" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Thay bằng hồi quy trực tiếp 4 kênh tuyến tính</text>
<rect x="306" y="356" width="260" height="69" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="436.0" y="372" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Chuyển trạng thái: model.eval()</text>
<text x="436.0" y="390" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Tắt requires_grad, vô hiệu hóa Dropout</text>
<text x="436.0" y="408" font-size="8" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">Giải phóng toàn bộ cache gradient</text>
<path d="M269 230 L287 230" fill="none" stroke="#1E5BB8" stroke-width="3.0" marker-end="url(#m1E5BB8t)"/>
<rect x="606" y="40" width="258" height="395" rx="5" fill="#F6FBF7" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="616" y="50" width="175" height="22" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="703" y="61" font-size="9.2" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">ĐỒ THỊ SUY LUẬN (Inference)</text>
<rect x="616" y="78" width="238" height="34" rx="3" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1"/>
<text x="735.0" y="90" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Input tĩnh: (1, 3, 640, 640)</text>
<text x="735.0" y="103" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Bộ đệm tĩnh, không cấp phát động</text>
<rect x="616" y="118" width="238" height="34" rx="3" fill="#F8FAFC" stroke="#444444" stroke-width="1"/>
<text x="735.0" y="130" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Các lớp Tích chập đã gộp</text>
<text x="735.0" y="143" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Conv duy nhất có bias tích hợp sẵn</text>
<rect x="616" y="158" width="238" height="34" rx="3" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1"/>
<text x="735.0" y="170" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Chỉ giữ Đầu một-một (1-to-1)</text>
<text x="735.0" y="183" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Đầu ra đơn nhất, sẵn sàng NMS-free</text>
<rect x="616" y="198" width="238" height="34" rx="3" fill="#FAF5FF" stroke="#7B1FA2" stroke-width="1"/>
<text x="735.0" y="210" font-size="8.5" font-weight="700" fill="#7B1FA2" text-anchor="middle" dominant-baseline="central">Khối Attention P5 (C2PSA)</text>
<text x="735.0" y="223" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">4× MatMul, 2× Softmax cố định</text>
<rect x="616" y="238" width="238" height="34" rx="3" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1"/>
<text x="735.0" y="250" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Hồi quy trực tiếp 4 kênh</text>
<text x="735.0" y="263" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">0 Softmax phân mảnh, thuần INT8</text>
<rect x="616" y="278" width="238" height="34" rx="3" fill="#F8FAFC" stroke="#444444" stroke-width="1"/>
<text x="735.0" y="290" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Đầu ra: Box(4) + Score(80)</text>
<text x="735.0" y="303" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Tối ưu hóa bảng trang IOMMU &amp; DMA</text>
<rect x="616" y="320" width="238" height="105" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="624" y="336" font-size="8.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Lợi thế triển khai phần cứng:</text>
<text x="624" y="354" font-size="8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Đồ thị tĩnh (DAG) tất định</text>
<text x="624" y="372" font-size="8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Dễ dàng lượng tử hóa INT8</text>
<text x="624" y="390" font-size="8" font-weight="400" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Giảm 30% tham số, 37% FLOPs</text>
<text x="624" y="408" font-size="8" font-weight="400" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Không phụ thuộc NMS trên CPU</text>
<path d="M579 230 L597 230" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<text x="10" y="459" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Ultralytics (yolo26.yaml:13), Sapkota et al. (YOLO26 2025 tr.17), Jocher (YOLO26 2026 tr.11)</text>
</svg>