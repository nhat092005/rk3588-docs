<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 473" width="880" height="473" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="473" fill="white"/>
<rect x="750" y="14" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="25.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đối chiếu Đầu dự đoán (Detect Head): YOLOv8 có DFL (reg_max=16) vs YOLO26 NMS-Free (reg_max=1)</text>
<rect x="18" y="40" width="412" height="395" rx="5" fill="#FFF9F9" stroke="#C62828" stroke-width="1.3"/>
<rect x="28" y="50" width="165" height="22" rx="3" fill="#C62828" stroke="#C62828" stroke-width="1"/>
<text x="110" y="61" font-size="9.8" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">YOLOv8 DECOUPLED HEAD</text>
<text x="203" y="61" font-size="9.2" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Hồi quy phân phối DFL + NMS</text>
<rect x="53" y="74" width="342" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="224.0" y="86" font-size="8.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Bản đồ đặc trưng P3, P4, P5 từ Neck</text>
<path d="M131 100 L131 116" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<path d="M320 100 L320 116" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="233" y="118" width="175" height="38" rx="3" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="320" y="131" font-size="9" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Nhánh Phân loại (Cls Conv)</text>
<text x="320" y="145" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2× Conv 3×3 (Kênh ẩn C=64)</text>
<rect x="40" y="118" width="182" height="38" rx="3" fill="#FEE2E2" stroke="#C62828" stroke-width="1.2"/>
<text x="131" y="131" font-size="9" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Nhánh Hồi quy (Reg Conv)</text>
<text x="131" y="145" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2× Conv 3×3 (Kênh ẩn C=64)</text>
<path d="M131 158 L131 174" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<path d="M320 158 L320 174" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="40" y="176" width="182" height="100" rx="3" fill="white" stroke="#C62828" stroke-width="1.2"/>
<text x="131" y="190" font-size="8.8" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">GIẢI MÃ DFL (Distribution)</text>
<text x="131" y="206" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">1. Conv 1×1 -&gt; 64 kênh (4×16)</text>
<text x="131" y="222" font-size="7.8" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">2. Softmax phi tuyến 16 bin</text>
<text x="131" y="238" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">3. MatMul tích phân [0..15]</text>
<text x="131" y="254" font-size="7.8" font-weight="400" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">4. Tọa độ hộp = 4 kênh</text>
<text x="131" y="267" font-size="7.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">8,400 anchor candidates</text>
<rect x="233" y="176" width="175" height="100" rx="3" fill="white" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="320" y="190" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">DỰ ĐOÁN XÁC SUẤT LỚP</text>
<text x="320" y="206" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">1. Conv 1×1 -&gt; 80 classes logit</text>
<text x="320" y="222" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Hàm Sigmoid kích hoạt xác suất</text>
<text x="320" y="238" font-size="7.8" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">3. Sinh nhiều hộp trùng lặp</text>
<text x="320" y="254" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">4. Gán nhãn One-to-Many (TAL)</text>
<text x="320" y="267" font-size="7.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">Cần CPU lọc loại bỏ dư thừa</text>
<path d="M131 277 L131 292" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<path d="M320 277 L320 292" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="40" y="294" width="368" height="36" rx="4" fill="#FFF1F2" stroke="#C62828" stroke-width="1.3"/>
<text x="224.0" y="307" font-size="9.2" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">HẬU XỬ LÝ NMS TRÊN CPU (Non-Maximum Suppression)</text>
<text x="224.0" y="321" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Lọc triệt tiêu hộp dư thừa bằng ngưỡng IoU; độ trễ phi tất định</text>
<path d="M224 332 L224 346" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<rect x="83" y="348" width="282" height="24" rx="3" fill="white" stroke="#333333" stroke-width="1"/>
<text x="224.0" y="360" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Tập hộp dự đoán cuối cùng (Variable count)</text>
<rect x="33" y="380" width="382" height="46" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="43" y="394" font-size="8.2" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Rào cản NPU: Softmax phi tuyến cực kỳ khó lượng tử hóa INT8.</text>
<text x="43" y="410" font-size="8.2" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">NMS chạy trên CPU chiếm tới 30-50% tổng độ trễ thực thi tại biên.</text>
<rect x="450" y="40" width="412" height="395" rx="5" fill="#F6FBF7" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="460" y="50" width="165" height="22" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="542" y="61" font-size="9.8" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">YOLO26 DECOUPLED HEAD</text>
<text x="635" y="61" font-size="9.2" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Hồi quy trực tiếp + NMS-Free</text>
<rect x="485" y="74" width="342" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="656.0" y="86" font-size="8.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Bản đồ đặc trưng P3, P4, P5 từ Neck</text>
<path d="M563 100 L563 116" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<path d="M752 100 L752 116" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="665" y="118" width="175" height="38" rx="3" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="752" y="131" font-size="9" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Nhánh Phân loại (Cls Conv)</text>
<text x="752" y="145" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2× Conv 3×3 (Kênh ẩn C=64)</text>
<rect x="472" y="118" width="182" height="38" rx="3" fill="#DCFCE7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="563" y="131" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Nhánh Hồi quy (Reg Conv)</text>
<text x="563" y="145" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2× Conv 3×3 (Kênh ẩn C=64)</text>
<path d="M563 158 L563 174" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<path d="M752 158 L752 174" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="472" y="176" width="182" height="100" rx="3" fill="white" stroke="#2E7D32" stroke-width="1.2"/>
<text x="563" y="190" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">HỒI QUY TRỰC TIẾP (Direct)</text>
<text x="563" y="206" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">1. Conv 1×1 -&gt; Đúng 4 kênh (reg_max=1)</text>
<text x="563" y="222" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Loại bỏ hoàn toàn DFL &amp; Softmax</text>
<text x="563" y="238" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">3. Không Reshape, không bảng LUT</text>
<text x="563" y="254" font-size="7.8" font-weight="400" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">4. Tọa độ hộp tính bằng thuần INT8</text>
<text x="563" y="267" font-size="7.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">q_out = M × (q_in * q_w) + Z_out</text>
<rect x="665" y="176" width="175" height="100" rx="3" fill="white" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="752" y="190" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">PHÂN LOẠI ĐỐI SÁNH 1-1</text>
<text x="752" y="206" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">1. Conv 1×1 -&gt; 80 classes logit</text>
<text x="752" y="222" font-size="7.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Sigmoid kích hoạt xác suất</text>
<text x="752" y="238" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">3. Huấn luyện Hungarian 1-1</text>
<text x="752" y="254" font-size="7.8" font-weight="400" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">4. Đúng 1 dự đoán cho 1 vật thể</text>
<text x="752" y="267" font-size="7.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">Triệt tiêu trùng lặp ngay từ NPU</text>
<path d="M563 277 L563 292" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<path d="M752 277 L752 292" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="472" y="294" width="368" height="36" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.3"/>
<text x="656.0" y="307" font-size="9.2" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">CƠ CHẾ NMS-FREE (Lọc Top-K Tĩnh Đơn Định)</text>
<text x="656.0" y="321" font-size="8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Không cần CPU IoU loop; thời gian thực thi cố định (deterministic latency)</text>
<path d="M656 332 L656 346" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="515" y="348" width="282" height="24" rx="3" fill="white" stroke="#333333" stroke-width="1"/>
<text x="656.0" y="360" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Tập hộp dự đoán chuẩn xác (Thời gian đơn định)</text>
<rect x="465" y="380" width="382" height="46" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<text x="475" y="394" font-size="8.2" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Lợi thế NPU: Lượng tử hóa INT8 thuần số nguyên, tính toán cực nhanh.</text>
<text x="475" y="410" font-size="8.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Độ trễ đơn định (deterministic latency), xuất trực tiếp end2end không phụ thuộc CPU.</text>
<text x="10" y="459" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Ultralytics (yolo26.yaml:9-10), Chakrabarty et al. (YOLO26 2026 tr.5, tr.8)</text>
</svg>