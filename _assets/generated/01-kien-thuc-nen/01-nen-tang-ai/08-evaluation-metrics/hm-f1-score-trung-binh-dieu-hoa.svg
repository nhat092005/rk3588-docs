<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="270" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="20" font-size="14.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Chỉ số F1-Score (Trung bình điều hòa giữa Precision và Recall)</text>
<rect x="10" y="38" width="435" height="190" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="24" y="53" font-size="11.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. Cơ chế tự phạt: Trung bình cộng vs Trung bình điều hòa (F1)</text>
<rect x="20" y="63" width="415" height="40" rx="3" fill="#FFF5F5" stroke="#FFCDD2" stroke-width="1.0"/>
<text x="26" y="75" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Trường hợp 1: Quá khắt khe (Confidence quá cao)</text>
<text x="26" y="90" font-size="8.5" fill="#444444" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Precision = </tspan><tspan font-weight="700">0.95</tspan><tspan>  |  </tspan><tspan>Recall = </tspan><tspan font-weight="700">0.10</tspan><tspan> (bỏ sót 90%)</tspan><tspan>  -&gt;  </tspan><tspan>Cộng: 52.5%  |  </tspan><tspan font-weight="700">F1: 18.1% (Phạt nặng)</tspan></text>
<rect x="20" y="108" width="415" height="40" rx="3" fill="#FFF5F5" stroke="#FFCDD2" stroke-width="1.0"/>
<text x="26" y="120" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Trường hợp 2: Quá khoan dung (Confidence quá thấp)</text>
<text x="26" y="135" font-size="8.5" fill="#444444" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Precision = </tspan><tspan font-weight="700">0.15</tspan><tspan> (báo nhầm nhiều)  |  </tspan><tspan>Recall = </tspan><tspan font-weight="700">0.95</tspan><tspan>  -&gt;  </tspan><tspan>Cộng: 55.0%  |  </tspan><tspan font-weight="700">F1: 25.9% (Phạt nặng)</tspan></text>
<rect x="20" y="153" width="415" height="40" rx="3" fill="#F1F8E9" stroke="#C8E6C9" stroke-width="1.0"/>
<text x="26" y="165" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Trường hợp 3: Cân bằng tối ưu (Đạt chuẩn triển khai)</text>
<text x="26" y="180" font-size="8.5" fill="#2E7D32" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>Precision = </tspan><tspan font-weight="700">0.85</tspan><tspan>  |  </tspan><tspan>Recall = </tspan><tspan font-weight="700">0.85</tspan><tspan>  -&gt;  </tspan><tspan>Cộng: 85.0%  |  </tspan><tspan font-weight="700">F1-Score: 85.0% (Cân bằng tốt)</tspan></text>
<rect x="20" y="198" width="415" height="20" rx="3" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="227.5" y="208" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">F1-Score chỉ cao khi CẢ HAI chỉ số Precision và Recall cùng đạt mức tốt</text>
<rect x="455" y="38" width="435" height="190" rx="5" fill="#FCFDFD" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="469" y="53" font-size="11.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Công thức toán học và Ứng dụng thực tế</text>
<rect x="465" y="63" width="415" height="46" rx="4" fill="#EAF2FF" stroke="#90CAF9" stroke-width="1.0"/>
<text x="672.5" y="77" font-size="11.0" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">F1-Score = </tspan><tspan font-weight="700">2 × (Precision × Recall) / (Precision + Recall)</tspan></text>
<text x="672.5" y="95" font-size="8.8" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central" font-style="italic">Trung bình điều hòa luôn bị kéo mạnh về phía giá trị thấp hơn</text>
<text x="469" y="123.0" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Thước đo đánh giá sự cân bằng giữa bắt đúng và ít báo nhầm.</tspan></text>
<text x="469" y="137.5" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cơ chế tự phạt: </tspan><tspan>Nếu một trong hai chỉ số sụt giảm nghiêm trọng,</tspan></text>
<text x="469" y="152.0" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  F1 sẽ lập tức giảm mạnh, không che giấu khiếm khuyết như trung bình cộng.</tspan></text>
<text x="469" y="166.5" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Ứng dụng chọn ngưỡng (max-F1): </tspan><tspan>Ngưỡng confidence tại đó F1 đạt</tspan></text>
<text x="469" y="181.0" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  cực đại thường được chọn làm ngưỡng kích hoạt cảnh báo camera tự động.</tspan></text>
<text x="469" y="195.5" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Khác biệt với mAP: </tspan><tspan>F1 đánh giá tại một ngưỡng cố định, còn mAP</tspan></text>
<text x="469" y="210.0" font-size="9.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  quét và tính diện tích tích phân trên toàn bộ đường cong P-R.</tspan></text>
<text x="10" y="256" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Ultralytics utils/metrics.py (max-F1); SHEL5K tr.8 (Equation 3).</text>
</svg>