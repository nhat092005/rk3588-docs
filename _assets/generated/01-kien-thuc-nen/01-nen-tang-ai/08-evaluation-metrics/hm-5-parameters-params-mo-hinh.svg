<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="280" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="22" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Thông số Mô hình (Parameters / Params) và Ý nghĩa Bộ nhớ trên RK3588</text>
<rect x="10" y="38" width="440" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="24" y="54" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. Bản chất: Trọng số (Weights) và Bias trong Tầng Conv2D</text>
<rect x="24" y="66" width="412" height="62" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.0"/>
<text x="230.0" y="82" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Công thức tính số Parameters của một tầng tích chập:</text>
<text x="230.0" y="100" font-size="10.0" fill="#444444" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Params = </tspan><tspan font-weight="700">(K × K × C</tspan><tspan>in</tspan><tspan font-weight="700">) × C</tspan><tspan>out</tspan><tspan font-weight="700"> + C</tspan><tspan>out</tspan><tspan> (với K: kernel, C: số kênh)</tspan></text>
<text x="230.0" y="116" font-size="7.5" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Ví dụ Conv 3x3 (Cin=64, Cout=128): (3 × 3 × 64) × 128 + 128 = 73,856 params</text>
<rect x="24" y="136" width="412" height="88" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="32" y="152" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Phân bố Parameters trong kiến trúc YOLO (Ví dụ YOLOv8n ~ 3.2M):</text>
<rect x="32" y="162" width="126" height="52" rx="3" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="95.0" y="176" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Backbone (~45%)</text>
<text x="95.0" y="190" font-size="8.0" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">~1.44M params</text>
<text x="95.0" y="204" font-size="7.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Trích xuất đặc trưng</text>
<rect x="166" y="162" width="126" height="52" rx="3" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="229.0" y="176" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Neck / PANet (~35%)</text>
<text x="229.0" y="190" font-size="8.0" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">~1.12M params</text>
<text x="229.0" y="204" font-size="7.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Hợp nhất đa tỷ lệ</text>
<rect x="300" y="162" width="126" height="52" rx="3" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="363.0" y="176" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Detect Head (~20%)</text>
<text x="363.0" y="190" font-size="8.0" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">~0.64M params</text>
<text x="363.0" y="204" font-size="7.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Phân loại &amp; Box reg</text>
<rect x="460" y="38" width="430" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="474" y="54" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Dung lượng Bộ nhớ Tĩnh (RAM / ROM) theo Kiểu Dữ liệu</text>
<rect x="474" y="66" width="402" height="86" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<rect x="474" y="66" width="402" height="20" rx="3" fill="#ECEFF1" stroke="none" stroke-width="1.2"/>
<text x="490" y="80" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Định dạng</text>
<text x="570" y="80" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Byte / Param</text>
<text x="660" y="80" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Dung lượng (3.2M)</text>
<text x="760" y="80" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Tác động phần cứng RK3588</text>
<text x="490" y="102" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">FP32 (PyTorch)</text>
<text x="570" y="102" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">4 bytes</text>
<text x="660" y="102" font-size="8.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">12.8 MB</text>
<text x="760" y="102" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Nặng, NPU không tối ưu</text>
<text x="490" y="120" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">FP16 (Nửa chính xác)</text>
<text x="570" y="120" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">2 bytes</text>
<text x="660" y="120" font-size="8.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">6.4 MB (-50%)</text>
<text x="760" y="120" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Chạy tốt trên NPU core</text>
<text x="490" y="138" font-size="7.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">INT8 (RKNN)</text>
<text x="570" y="138" font-size="7.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">1 byte</text>
<text x="660" y="138" font-size="8.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">3.2 MB (-75%)</text>
<text x="760" y="138" font-size="7.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Vừa vặn SRAM, siêu nhanh</text>
<rect x="474" y="160" width="402" height="66" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="482" y="175" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Lưu ý then chốt khi thiết kế cho Edge AI:</text>
<text x="482" y="191" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• </tspan><tspan font-weight="700">Parameters = Bộ nhớ tĩnh: </tspan><tspan>Chỉ phụ thuộc số tầng và số kênh, không đổi theo cỡ ảnh.</tspan></text>
<text x="482" y="205" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• </tspan><tspan font-weight="700">Không đại diện cho Tốc độ: </tspan><tspan>Mô hình ít params vẫn có thể chậm nếu kiến trúc phân mảnh.</tspan></text>
<text x="482" y="219" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• </tspan><tspan font-weight="700">Khác biệt Activations: </tspan><tspan>RAM runtime phụ thuộc lớn vào feature map (ảnh to thì RAM tăng).</tspan></text>
<text x="10" y="266" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Ultralytics YOLO Architecture; Rockchip RK3588 TRM; Lin et al. MCUNet 2020.</text>
</svg>