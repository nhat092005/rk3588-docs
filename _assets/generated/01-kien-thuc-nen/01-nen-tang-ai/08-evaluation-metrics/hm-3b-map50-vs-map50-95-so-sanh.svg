 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="242" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">So sánh Chuẩn mAP@0.50 (PASCAL VOC) vs mAP@0.50:0.95 (MS COCO)</text>
<rect x="10" y="38" width="275" height="166" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="147.5" y="52" font-size="9.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">A. Chuẩn VOC: mAP@0.50 (Khoan dung)</text>
<line x1="40" y1="148" x2="255" y2="148" stroke="#444444" stroke-width="1.2"/>
<line x1="40" y1="68" x2="40" y2="148" stroke="#444444" stroke-width="1.2"/>
<path d="M 40 72 C 170 76, 220 92, 249 148 L 249 148 L 40 148 Z" fill="#C8E6C9" opacity="0.6"/>
<path d="M 40 72 C 170 76, 220 92, 249 148" fill="none" stroke="#2E7D32" stroke-width="2.2"/>
<text x="136.75" y="112.0" font-size="10.0" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">mAP@0.50 = 0.8924</text>
<text x="22" y="163.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tiêu chí: </tspan><tspan>Hộp chỉ cần chạm IoU ≥ 0.50.</tspan></text>
<text x="22" y="177.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Đo xem có tìm thấy vật thể hay không.</tspan></text>
<text x="22" y="192.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Hạn chế: </tspan><tspan>Hộp méo hoặc lệch biên vẫn được điểm tối đa.</tspan></text>
<polygon points="290,108 305,108 301,104 309,108 301,112 305,108" fill="#444444" stroke="#444444" stroke-width="1.5"/>
<text x="300" y="94" font-size="7.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Siết IoU</text>
<text x="300" y="122" font-size="7.5" font-weight="400" fill="#666666" text-anchor="middle" dominant-baseline="central">0.5 →</text>
<text x="300" y="132" font-size="7.5" font-weight="400" fill="#666666" text-anchor="middle" dominant-baseline="central">0.95</text>
<rect x="314" y="38" width="275" height="166" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="451.5" y="52" font-size="9.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">B. Mốc khắt khe: IoU = 0.95</text>
<line x1="344" y1="148" x2="559" y2="148" stroke="#444444" stroke-width="1.2"/>
<line x1="344" y1="68" x2="344" y2="148" stroke="#444444" stroke-width="1.2"/>
<path d="M 344 92 C 374 112, 394 134, 419 148 L 419 148 L 344 148 Z" fill="#FFCDD2" opacity="0.6"/>
<path d="M 344 92 C 374 112, 394 134, 419 148" fill="none" stroke="#C62828" stroke-width="2.2"/>
<text x="474" y="110" font-size="9.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">AP@0.95 &lt; 0.1500</text>
<text x="326" y="163.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tiêu chí: </tspan><tspan>Hộp phải trùng khít 95% diện tích nhãn.</tspan></text>
<text x="326" y="177.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Lệch vài pixel lập tức bị phạt thành FP.</tspan></text>
<text x="326" y="192.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Thách thức: </tspan><tspan>Rất khó với vật thể nhỏ và mạng INT8.</tspan></text>
<rect x="597" y="38" width="293" height="166" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="743.5" y="52" font-size="9.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">C. Chuẩn COCO: mAP@0.50:0.95</text>
<rect x="607" y="66" width="273" height="56" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="743.5" y="80" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Trung bình cộng tại 10 mốc IoU:</text>
<text x="743.5" y="95" font-size="7.5" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95</text>
<text x="743.5" y="110" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">mAP50-95 = 0.5908 (Điểm thực tế)</text>
<text x="609" y="132.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đánh giá kép: </tspan><tspan>Đo cả nhận diện và độ chuẩn xác pixel.</tspan></text>
<text x="609" y="146.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Chuẩn vàng hiện đại: </tspan><tspan>Mọi bảng xếp hạng quốc tế</tspan></text>
<text x="609" y="161.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  (COCO, Ultralytics, Paper) đều dùng thước đo này.</tspan></text>
<text x="609" y="175.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Phản ánh thực chiến: </tspan><tspan>Loại bỏ hiện tượng ăn may khi box</tspan></text>
<text x="609" y="190.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  bắt trúng đối tượng nhưng vị trí viền méo mó.</tspan></text>
<text x="10" y="228" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: COCO Evaluation Protocol; Lin et al. ECCV 2014; Y6 tr.8.</text>
</svg>