<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="350" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="22" font-size="14.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Chỉ số Recall (Độ nhạy / Độ bao phủ) trong Phát hiện Vật thể</text>
<rect x="10" y="48" width="435" height="260" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="24" y="64" font-size="11.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. Mô phỏng phát hiện trên ảnh (Tổng 5 vật thể thật)</text>
<rect x="20" y="78" width="415" height="175" rx="3" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="427" y="90" font-size="9.0" font-weight="400" fill="#777777" text-anchor="end" dominant-baseline="central" font-style="italic">Camera giám sát công trường</text>
<rect x="36" y="116" width="80" height="48" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.8"/>
<rect x="36" y="104" width="80" height="12" rx="2" fill="#2E7D32" stroke="none" stroke-width="1.2"/>
<text x="39" y="110" font-size="8.0" font-weight="700" fill="white" text-anchor="start" dominant-baseline="central">TP: helmet 0.94</text>
<rect x="140" y="116" width="80" height="48" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.8"/>
<rect x="140" y="104" width="80" height="12" rx="2" fill="#2E7D32" stroke="none" stroke-width="1.2"/>
<text x="143" y="110" font-size="8.0" font-weight="700" fill="white" text-anchor="start" dominant-baseline="central">TP: helmet 0.91</text>
<rect x="244" y="116" width="80" height="48" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.8"/>
<rect x="244" y="104" width="80" height="12" rx="2" fill="#2E7D32" stroke="none" stroke-width="1.2"/>
<text x="247" y="110" font-size="8.0" font-weight="700" fill="white" text-anchor="start" dominant-baseline="central">TP: helmet 0.88</text>
<rect x="75" y="190" width="105" height="50" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.8"/>
<rect x="75" y="178" width="105" height="12" rx="2" fill="#2E7D32" stroke="none" stroke-width="1.2"/>
<text x="78" y="184" font-size="8.0" font-weight="700" fill="white" text-anchor="start" dominant-baseline="central">TP: safety_vest 0.92</text>
<rect x="225" y="190" width="105" height="50" rx="2" fill="#FFF3E0" stroke="#E65100" stroke-width="1.8" stroke-dasharray="5 3"/>
<rect x="225" y="178" width="105" height="12" rx="2" fill="#E65100" stroke="none" stroke-width="1.2"/>
<text x="228" y="184" font-size="8.0" font-weight="700" fill="white" text-anchor="start" dominant-baseline="central">FN: helmet (Bỏ sót)</text>
<text x="277" y="215" font-size="8.0" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">(Mô hình không phát hiện)</text>
<rect x="20" y="268" width="415" height="28" rx="3" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="227.5" y="282" font-size="9.5" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan>Tổng số vật thể thật: </tspan><tspan font-weight="700">5 đối tượng</tspan><tspan> = </tspan><tspan font-weight="700">4 Bắt trúng (TP)</tspan><tspan> + </tspan><tspan font-weight="700">1 Bỏ sót (FN)</tspan></text>
<rect x="455" y="48" width="435" height="260" rx="5" fill="#FCFDFD" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="469" y="64" font-size="11.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Công thức và Ý nghĩa bản chất</text>
<rect x="465" y="78" width="415" height="56" rx="4" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.0"/>
<text x="672.5" y="94" font-size="11.5" fill="#E65100" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Recall = </tspan><tspan font-weight="700">TP / (TP + FN)</tspan><tspan> = </tspan><tspan font-weight="700">4 / (4 + 1)</tspan><tspan> = </tspan><tspan font-weight="700">4 / 5 = 80%</tspan></text>
<text x="672.5" y="116" font-size="9.5" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central" font-style="italic">Mẫu số là toàn bộ số vật thể thực tế có trong ảnh</text>
<text x="469" y="160" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bản chất: </tspan><tspan>Trong tổng số vật thể thật, bắt được bao nhiêu %?</tspan></text>
<text x="469" y="185" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Ý nghĩa an toàn: </tspan><tspan>Recall cao -&gt; Cực kỳ ít bỏ sót vi phạm.</tspan></text>
<text x="469" y="210" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  Đảm bảo không bỏ lọt công nhân không đội mũ hoặc thiếu bảo hộ.</tspan></text>
<text x="469" y="235" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Không xét đến FP: </tspan><tspan>Chỉ đo mức độ bao phủ vật thể thật,</tspan></text>
<text x="469" y="260" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  hoàn toàn không bị giảm điểm khi có báo động giả (FP).</tspan></text>
<text x="469" y="285" font-size="10.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Đánh đổi: </tspan><tspan>Tăng ngưỡng confidence -&gt; Lọc bớt box -&gt; Dễ tăng FN -&gt; Recall giảm.</tspan></text>
<text x="10" y="336" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Ultralytics utils/metrics.py; SHEL5K tr.8 (Equation 2).</text>
</svg>