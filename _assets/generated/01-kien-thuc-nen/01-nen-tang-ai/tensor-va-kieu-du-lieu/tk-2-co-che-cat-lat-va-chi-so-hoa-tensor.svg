<text x="612" y="300" font-size="7.0" font-weight="400" fill="#455A64" text-anchor="start" dominant-baseline="central">• Là pixel biểu diễn màu sắc tại vị trí (h, w).</text>
<text x="10" y="331" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: [T2 D2L tr.31, tr.44, tr.135]. Chỉ số nguyên cố định làm giảm bậc (rank); dấu : giữ nguyên trục.</text>
