<text x="490" y="133" font-size="9" font-weight="400" fill="#546E7A" text-anchor="middle" dominant-baseline="central">Loss</text>
<text x="486" y="226" font-size="8.5" font-weight="400" fill="#78909C" text-anchor="end" dominant-baseline="central">0</text>
<path d="M770 135 L770 217" fill="none" stroke="#E2E8F0" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="770" y="226" font-size="8.5" font-weight="400" fill="#546E7A" text-anchor="middle" dominant-baseline="central">1.0</text>
