<text x="570" y="147" font-size="9.5" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">l = -log(ŷ_c) (Tiệm cận vô cùng)</text>
<path d="M555 167 L515 150" fill="none" stroke="#C62828" stroke-width="1.1" marker-end="url(#mC62828n)"/>
<text x="560" y="171" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Phạt vô hạn nếu ŷ_c → 0!</text>
<rect x="445" y="244" width="390" height="56" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="455" y="258" font-size="9.2" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính kỹ thuật:</text>
<text x="455" y="273" font-size="8.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi dự đoán sai tự tin (ŷ_c ≈ 0): Loss vọt lên vô hạn, gradient cực mạnh ép học lại.</text>
<text x="455" y="289" font-size="8.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi dự đoán chuẩn xác (ŷ_c ≈ 1.0): Loss triệt tiêu về 0, gradient ∂l/∂o tiệm cận 0.</text>
<text x="10" y="330" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Dive into Deep Learning (2023, Mục 3.1 &amp; 4.1), Deep Learning (Goodfellow et al., 2016).</text>
