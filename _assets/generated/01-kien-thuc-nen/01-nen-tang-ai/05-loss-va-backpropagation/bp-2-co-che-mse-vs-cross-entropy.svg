 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="344" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">So sánh cơ chế toán học hàm Loss: Squared Error (MSE) vs Cross-Entropy</text>
<rect x="15" y="34" width="410" height="275" rx="5" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="50" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Panel A: Squared Error (MSE) cho Hồi quy</text>
<rect x="25" y="65" width="390" height="52" rx="4" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="35" y="80" font-size="9.8" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Công thức: l(y, ŷ) = ½ (ŷ - y)²   |   Đạo hàm: ∂l/∂ŷ = ŷ - y</text>
<text x="35" y="96" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Đạo hàm tuyến tính theo độ lệch: Độ dốc kéo về tỷ lệ thuận với sai số.</text>
<text x="35" y="110" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Tương đương ước lượng hợp lý cực đại (MLE) khi nhiễu cộng tính Gaussian.</text>
<rect x="30" y="125" width="380" height="110" rx="3" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<path d="M45 217 L395 217" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<path d="M220 135 L220 227" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="395" y="211" font-size="9" font-weight="400" fill="#546E7A" text-anchor="end" dominant-baseline="central">ŷ - y</text>
<text x="220.0" y="133" font-size="9" font-weight="400" fill="#546E7A" text-anchor="middle" dominant-baseline="central">Loss</text>
<text x="216.0" y="226" font-size="8.5" font-weight="400" fill="#78909C" text-anchor="end" dominant-baseline="central">0</text>
<path d="M 73.0 137.0 L 77.2 141.5 L 81.4 145.9 L 85.6 150.1 L 89.8 154.2 L 94.0 158.2 L 98.2 162.1 L 102.4 165.8 L 106.6 169.4 L 110.8 172.9 L 115.0 176.2 L 119.2 179.4 L 123.4 182.5 L 127.6 185.4 L 131.8 188.2 L 136.0 190.9 L 140.2 193.4 L 144.4 195.8 L 148.6 198.1 L 152.8 200.3 L 157.0 202.3 L 161.2 204.2 L 165.4 206.0 L 169.6 207.6 L 173.8 209.1 L 178.0 210.5 L 182.2 211.7 L 186.4 212.8 L 190.6 213.8 L 194.8 214.6 L 199.0 215.4 L 203.2 216.0 L 207.4 216.4 L 211.6 216.7 L 215.8 216.9 L 220.0 217.0 L 224.2 216.9 L 228.4 216.7 L 232.6 216.4 L 236.8 216.0 L 241.0 215.4 L 245.2 214.6 L 249.4 213.8 L 253.6 212.8 L 257.8 211.7 L 262.0 210.5 L 266.2 209.1 L 270.4 207.6 L 274.6 206.0 L 278.8 204.2 L 283.0 202.3 L 287.2 200.3 L 291.4 198.1 L 295.6 195.8 L 299.8 193.4 L 304.0 190.9 L 308.2 188.2 L 312.4 185.4 L 316.6 182.5 L 320.8 179.4 L 325.0 176.2 L 329.2 172.9 L 333.4 169.4 L 337.6 165.8 L 341.8 162.1 L 346.0 158.2 L 350.2 154.2 L 354.4 150.1 L 358.6 145.9 L 362.8 141.5 L 367.0 137.0" fill="none" stroke="#1E5BB8" stroke-width="2.4"/>
<path d="M160 225 L330 162" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="260.0" y="159" font-size="8.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Đạo hàm: ŷ - y</text>
<text x="130.0" y="147" font-size="9.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">l = ½(ŷ - y)² (Parabol)</text>
<rect x="25" y="244" width="390" height="56" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="35" y="258" font-size="9.2" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính kỹ thuật:</text>
<text x="35" y="273" font-size="8.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi sai số lớn (outliers): Loss tăng bậc hai, gradient cực đại kéo lệch model.</text>
<text x="35" y="289" font-size="8.6" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi gần điểm tối ưu: Đạo hàm tiến êm dịu về 0, không bị nhảy bước.</text>
<rect x="435" y="34" width="410" height="275" rx="5" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="50" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Panel B: Cross-Entropy + Softmax cho Phân loại</text>
<rect x="445" y="65" width="390" height="52" rx="4" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.0"/>
<text x="455" y="80" font-size="9.8" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">Công thức: l = -log(ŷ_c)   |   Đạo hàm logit: ∂l/∂o_j = ŷ_j - y_j</text>
<text x="455" y="96" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Đạo hàm theo logit cực kỳ trang nhã: Bằng xác suất dự đoán trừ nhãn One-hot.</text>
<text x="455" y="110" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Ghép Softmax + Cross-Entropy triệt tiêu số mũ, chống tràn số cực tốt.</text>
<rect x="450" y="125" width="380" height="110" rx="3" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<path d="M480 217 L815 217" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<path d="M490 135 L490 227" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
