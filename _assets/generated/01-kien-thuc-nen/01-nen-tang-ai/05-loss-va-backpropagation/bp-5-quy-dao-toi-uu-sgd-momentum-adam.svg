<text x="168.0" y="180.0" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Momentum</text>
<rect x="155.0" y="116.0" width="115" height="15" rx="4" fill="#FCFDFD" stroke="none" stroke-width="1.2"/>
<text x="158.0" y="128.0" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Adam (Thẳng &amp; nhanh)</text>
<text x="243.0" y="183.0" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">SGD (Zigzag)</text>
<path d="M105 241 L105 286" fill="none" stroke="#222222" stroke-width="1.0" marker-end="url(#m222222n)"/>
<text x="110.0" y="276.0" font-size="8.0" font-weight="400" fill="#546E7A" text-anchor="start" dominant-baseline="central">Độ dốc lớn (sườn núi)</text>
<path d="M285 271 L355 271" fill="none" stroke="#222222" stroke-width="1.0" marker-end="url(#m222222n)"/>
<text x="295.0" y="283.0" font-size="8.0" font-weight="400" fill="#546E7A" text-anchor="start" dominant-baseline="central">Độ dốc thoải (đáy thung lũng)</text>
<rect x="510" y="36" width="335" height="78" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1.1"/>
<text x="522" y="50" font-size="10" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">1. Stochastic Gradient Descent (SGD)</text>
<text x="522" y="66" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Quy tắc: θ ← θ - η · gₜ</text>
<text x="522" y="82" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Nhược điểm: Bị chi phối bởi độ dốc tức thời. Trong thung lũng,</text>
<text x="522" y="97" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  SGD nảy qua lại giữa 2 vách, tiến dọc đáy cực kỳ chậm.</text>
<rect x="510" y="122" width="335" height="85" rx="4" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.1"/>
<text x="522" y="136" font-size="10" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">2. SGD kèm Momentum (Xung lượng)</text>
<text x="522" y="152" font-size="8.8" font-weight="600" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Vận tốc: vₜ ← β · vₜ₋₁ + gₜ  |  θ ← θ - η · vₜ</text>
<text x="522" y="169" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Cơ chế: Trung bình trượt (EMA) làm triệt tiêu các thành phần</text>
<text x="522" y="185" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  dao động đổi dấu liên tục, cộng dồn vận tốc theo hướng đáy.</text>
<text x="522" y="200" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Tăng tốc hội tụ rõ rệt trong các mạng CNN sâu.</text>
<rect x="510" y="215" width="335" height="91" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/>
<text x="522" y="229" font-size="10" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">3. Adam (Adaptive Moment Estimation)</text>
<text x="522" y="245" font-size="8.8" font-weight="600" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Bậc 1: vₜ (hướng đi)  |  Bậc 2: sₜ (bình phương gradient)</text>
<text x="522" y="262" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Hiệu chỉnh bước: θ ← θ - η · v̂ₜ / (√ŝₜ + ε)</text>
<text x="522" y="278" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ưu điểm độc tôn: Tự động co bước ở chiều dốc mạnh và tăng</text>
<text x="522" y="294" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  bước ở chiều dốc thoải, hội tụ ổn định gần như độc lập với scale.</text>
<text x="10" y="330" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Dive into Deep Learning (2023, Mục 12.4, 12.6 &amp; 12.10), Adam (Kingma &amp; Ba, ICLR 2015).</text>
</svg>