<ellipse cx="265.0" cy="171.0" rx="105" ry="48" fill="none" stroke="#CFD8DC" stroke-width="1.2"/>
<ellipse cx="265.0" cy="171.0" rx="68" ry="28" fill="none" stroke="#CFD8DC" stroke-width="1.2"/>
<ellipse cx="265.0" cy="171.0" rx="32" ry="13" fill="none" stroke="#CFD8DC" stroke-width="1.2"/>
<circle cx="265.0" cy="171.0" r="3.5" fill="#2E7D32"/>
<text x="273.0" y="165.0" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">θ* (Cực tiểu)</text>
