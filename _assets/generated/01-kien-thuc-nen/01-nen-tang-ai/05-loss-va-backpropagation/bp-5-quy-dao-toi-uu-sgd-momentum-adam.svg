 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="344" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Quỹ đạo tối ưu hóa trong không gian hàm mất mát thung lũng (Ravine): SGD, Momentum, Adam</text>
<rect x="15" y="36" width="480" height="270" rx="5" fill="#FCFDFD" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="25" y="52" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Không gian tham số Loss Surface dạng thung lũng hẹp</text>
