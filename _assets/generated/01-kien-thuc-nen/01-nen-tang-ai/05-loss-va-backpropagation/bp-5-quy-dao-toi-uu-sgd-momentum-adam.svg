<text x="92.0" y="85.0" font-size="9.0" font-weight="700" fill="#444444" text-anchor="end" dominant-baseline="central">Khởi tạo θ₀</text>
<path d="M 100.0 91.0 L 122.0 243.0 L 144.0 111.0 L 166.0 219.0 L 188.0 133.0 L 208.0 199.0 L 225.0 153.0 L 238.0 183.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-dasharray="4 3"/>
<path d="M 100.0 91.0 L 130.0 209.0 L 170.0 159.0 L 215.0 177.0 L 250.0 169.0 L 260.0 171.0" fill="none" stroke="#1E5BB8" stroke-width="2.4"/>
<path d="M 100.0 91.0 L 148.0 136.0 L 200.0 159.0 L 240.0 168.0 L 265.0 171.0" fill="none" stroke="#2E7D32" stroke-width="2.6"/>
