<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="344" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Chu trình huấn luyện mạng nơ-ron 4 bước khép kín: Forward, Loss, Backward, Update</text>
<rect x="15" y="42" width="185" height="110" rx="6" fill="#F0F7FF" stroke="#1E5BB8" stroke-width="1.4"/>
<circle cx="32" cy="60" r="10" fill="#1E5BB8" stroke="white" stroke-width="1.5"/>
<text x="32" y="60.5" font-size="12.5" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">1</text>
<text x="48" y="60" font-size="10.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Lan truyền xuôi (Forward)</text>
<text x="25" y="82" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tính ŷ = f(x; θ) qua các tầng</text>
<text x="25" y="99" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Lưu trữ tensor kích hoạt z, h</text>
<text x="25" y="116" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Giữ bộ đệm trong bộ nhớ VRAM</text>
<text x="25" y="133" font-size="8.6" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Tốn bộ nhớ tỉ lệ thuận độ sâu</text>
<rect x="660" y="42" width="185" height="110" rx="6" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.4"/>
<circle cx="677" cy="60" r="10" fill="#E65100" stroke="white" stroke-width="1.5"/>
<text x="677" y="60.5" font-size="12.5" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">2</text>
<text x="693" y="60" font-size="10.5" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">Tính hàm mất mát (Loss)</text>
<text x="670" y="82" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Đo sai lệch giữa ŷ và nhãn y</text>
<text x="670" y="99" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• L = l(ŷ, y) (MSE / Cross-Entropy)</text>
<text x="670" y="116" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• L ≥ 0, tiến dần về 0 khi đúng</text>
<text x="670" y="133" font-size="8.6" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">• Điểm xuất phát của gradient</text>
<rect x="660" y="195" width="185" height="110" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<circle cx="677" cy="213" r="10" fill="#C62828" stroke="white" stroke-width="1.5"/>
<text x="677" y="213.5" font-size="12.5" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">3</text>
<text x="693" y="213" font-size="10.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Lan truyền ngược (Backward)</text>
<text x="670" y="235" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Quy tắc chuỗi (Chain Rule)</text>
<text x="670" y="252" font-size="8.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">• Tính ∇_θ L = ∂L/∂θ theo từng lớp</text>
<text x="670" y="269" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tái sử dụng activations đã lưu</text>
<text x="670" y="286" font-size="8.6" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Giải phóng bộ đệm forward</text>
<rect x="15" y="195" width="185" height="110" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<circle cx="32" cy="213" r="10" fill="#2E7D32" stroke="white" stroke-width="1.5"/>
<text x="32" y="213.5" font-size="12.5" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">4</text>
<text x="48" y="213" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Cập nhật tham số (Optimizer)</text>
<text x="25" y="235" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thuật toán: SGD, Momentum, Adam</text>
<text x="25" y="252" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• θ ← θ - η · Δθ (đi ngược dốc)</text>
<text x="25" y="269" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Điều chỉnh tốc độ học qua Scheduler</text>
<text x="25" y="286" font-size="8.6" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Chuẩn bị tham số cho bước sau</text>
<path d="M205 97 L649 97" fill="none" stroke="#1E5BB8" stroke-width="3.0" marker-end="url(#m1E5BB8t)"/>
<text x="430" y="82" font-size="10" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Luồng Tensor Forward (Giá trị kích hoạt ŷ, z, h)</text>
<path d="M752 157 L752 184" fill="none" stroke="#C62828" stroke-width="3.0" marker-end="url(#mC62828t)"/>
<text x="760" y="173.5" font-size="9.2" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Khởi tạo ∂L/∂o</text>
<path d="M655 250 L211 250" fill="none" stroke="#C62828" stroke-width="3.0" marker-end="url(#mC62828t)"/>
<text x="430" y="235" font-size="10" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Luồng Gradient Backward (Đạo hàm riêng ∂L/∂θ)</text>
<path d="M107 190 L107 163" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<text x="115" y="173.5" font-size="9.2" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Trọng số mới θ*</text>
<rect x="240" y="126" width="380" height="95" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="430.0" y="142" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Bản chất toán học của quá trình học</text>
<text x="255" y="161" font-size="9.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Hàm mục tiêu: Tìm θ* = argmin L(θ) trên tập dữ liệu.</text>
<text x="255" y="178" font-size="9.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Xung đột bộ nhớ: Backward cần giữ lại toàn bộ activations của</text>
<text x="255" y="195" font-size="9.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  lượt Forward, làm bộ nhớ lúc huấn luyện gấp 3 - 5 lần lúc suy luận.</text>
<text x="255" y="212" font-size="8.8" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Đơn vị chu trình: 1 Minibatch = 1 bước lặp; 1 Epoch = quét hết dataset.</text>
<text x="10" y="330" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Dive into Deep Learning (2023, Mục 3.1 &amp; 5.3), Deep Learning (Goodfellow et al., 2016).</text>
</svg>