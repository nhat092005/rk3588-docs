<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="344" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Hình học các biến thể hàm mất mát Bounding Box trong Object Detection: Họ IoU</text>
<rect x="15" y="34" width="200" height="275" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="115.0" y="48" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">1. Standard IoU Loss</text>
<text x="115.0" y="63" font-size="9.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">L_IoU = 1 - IoU</text>
<rect x="25" y="74" width="180" height="88" rx="3" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.0"/>
<rect x="39" y="84" width="68" height="56" rx="2" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.4"/>
<rect x="79" y="98" width="72" height="54" rx="2" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<rect x="79" y="98" width="28" height="42" rx="1" fill="#FFE082" stroke="#E65100" stroke-width="1.2"/>
<text x="93" y="122" font-size="8.5" font-weight="700" fill="#B71C1C" text-anchor="middle" dominant-baseline="central">A ∩ B</text>
<text x="45" y="100" font-size="8.5" font-weight="600" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Box A</text>
<text x="103" y="144" font-size="8.2" font-weight="600" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Box B (GT)</text>
<rect x="23" y="168" width="184" height="132" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="29" y="183" font-size="9.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính toán học:</text>
<text x="29" y="199" font-size="8.5" font-weight="600" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• IoU = |A ∩ B| / |A ∪ B|</text>
<text x="29" y="215" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Bất biến theo tỉ lệ hộp.</text>
<text x="29" y="231" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Giá trị: 0 ≤ IoU ≤ 1.0.</text>
<text x="29" y="248" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Nhược điểm chí tử:</text>
<text x="29" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi A và B không giao nhau:</text>
<text x="29" y="279" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">  IoU = 0 =&gt; L_IoU = 1.0</text>
<text x="29" y="294" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">  ∇_θ = 0: Mất sạch gradient!</text>
<rect x="225" y="34" width="200" height="275" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="325.0" y="48" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Generalized IoU (GIoU)</text>
<text x="325.0" y="63" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">L_GIoU = 1 - IoU + |C\(A∪B)|/|C|</text>
<rect x="235" y="74" width="180" height="88" rx="3" fill="#FFFDE7" stroke="#F57F17" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="243" y="87" font-size="8.0" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">Hộp bao nhỏ nhất C</text>
<rect x="245" y="96" width="45" height="46" rx="2" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="267" y="123" font-size="8.5" font-weight="600" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Box A</text>
<rect x="360" y="106" width="45" height="46" rx="2" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/>
<text x="382" y="133" font-size="8.5" font-weight="600" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Box B</text>
<rect x="295" y="100" width="60" height="44" rx="2" fill="#FFF8E1" stroke="#FFA000" stroke-width="0.8"/>
<text x="325" y="117" font-size="8.0" font-weight="700" fill="#D84315" text-anchor="middle" dominant-baseline="central">Vùng trống</text>
<text x="325" y="132" font-size="8.0" font-weight="700" fill="#D84315" text-anchor="middle" dominant-baseline="central">|C \ (A ∪ B)|</text>
<rect x="233" y="168" width="184" height="132" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="239" y="183" font-size="9.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính toán học:</text>
<text x="239" y="199" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phạt diện tích trống trong C.</text>
<text x="239" y="215" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Vẫn có gradient khi box rời nhau.</text>
<text x="239" y="231" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khoảng giá trị: 0 ≤ L_GIoU ≤ 2.</text>
<text x="239" y="248" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Hạn chế thực tế:</text>
<text x="239" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khi một box bao trọn box kia,</text>
<text x="239" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  phần trống = 0 =&gt; thoái hóa IoU.</text>
<text x="239" y="294" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Hội tụ chậm vì ưu tiên phình to.</text>
<rect x="435" y="34" width="200" height="275" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="535.0" y="48" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">3. Distance-IoU (DIoU)</text>
<text x="535.0" y="63" font-size="9.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">L_DIoU = 1 - IoU + ρ² / c²</text>
<rect x="445" y="74" width="180" height="88" rx="3" fill="#F8FAFC" stroke="#78909C" stroke-width="1.1" stroke-dasharray="5 3"/>
<rect x="455" y="82" width="44" height="38" rx="2" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.3"/>
<circle cx="477" cy="101" r="2.5" fill="#1E5BB8"/>
<text x="467" y="97" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">b</text>
<rect x="571" y="116" width="44" height="38" rx="2" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/>
<circle cx="593" cy="135" r="2.5" fill="#2E7D32"/>
<text x="593" y="129" font-size="8.2" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">b_gt</text>
<path d="M477 101 L593 135" fill="none" stroke="#C62828" stroke-width="1.6"/>
<rect x="513" y="88" width="52" height="20" rx="2" fill="white" stroke="#C62828" stroke-width="0.8"/>
<text x="539" y="102" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">d = ρ</text>
<path d="M451 156 L619 80" fill="none" stroke="#546E7A" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="613" y="92" font-size="9.0" font-weight="700" fill="#546E7A" text-anchor="end" dominant-baseline="central">c</text>
<rect x="443" y="168" width="184" height="132" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="449" y="183" font-size="9.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính toán học:</text>
<text x="449" y="199" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phạt chuẩn hóa khoảng cách tâm.</text>
<text x="449" y="215" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Kéo trực tiếp 2 tâm lại gần nhau.</text>
<text x="449" y="231" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Ưu điểm vượt trội:</text>
<text x="449" y="248" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tốc độ hội tụ nhanh hơn hẳn GIoU.</text>
<text x="449" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Dùng làm tiêu chí lọc DIoU-NMS.</text>
<text x="449" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Không phình to diện tích vô ích.</text>
<text x="449" y="294" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Chưa xét tới tỉ lệ khung hình w/h.</text>
<rect x="645" y="34" width="200" height="275" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="745.0" y="48" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">4. Complete IoU (CIoU)</text>
<text x="745.0" y="63" font-size="9.8" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">L_CIoU = L_DIoU + α · v</text>
<rect x="655" y="74" width="180" height="88" rx="3" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.0"/>
<rect x="667" y="84" width="42" height="68" rx="2" fill="#E3F2FD" stroke="#1E5BB8" stroke-width="1.4"/>
<text x="688" y="112" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">w / h</text>
<text x="688" y="128" font-size="7.8" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">(Hẹp, cao)</text>
<rect x="771" y="99" width="54" height="38" rx="2" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="798" y="116" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">w* / h*</text>
<text x="798" y="128" font-size="7.8" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">(Rộng, thấp)</text>
<rect x="717" y="98" width="46" height="40" rx="3" fill="white" stroke="#EF9A9A" stroke-width="1.0"/>
<text x="740" y="114" font-size="15" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">≠</text>
<text x="740" y="130" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">+ α · v</text>
<rect x="653" y="168" width="184" height="132" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="659" y="183" font-size="9.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Đặc tính 3 yếu tố hình học:</text>
<text x="659" y="199" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">1. Diện tích chồng lấn (IoU)</text>
<text x="659" y="215" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">2. Khoảng cách tâm (ρ² / c²)</text>
<text x="659" y="231" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">3. Nhất quán tỉ lệ cạnh (α · v)</text>
<text x="659" y="248" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Chuẩn mực hiện đại:</text>
<text x="659" y="264" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Hàm loss mặc định trong YOLOv8.</text>
<text x="659" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• α ưu tiên overlap trước tỉ lệ.</text>
<text x="659" y="294" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Cân đối hoàn hảo vị trí &amp; hình dáng.</text>
<text x="10" y="330" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: GIoU (Rezatofighi et al., CVPR 2019), DIoU/CIoU (Zheng et al., AAAI 2020), Ultralytics YOLO.</text>
</svg>