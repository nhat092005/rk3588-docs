 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="344" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ảnh hưởng của Learning Rate và các chiến lược điều chỉnh (Schedulers)</text>
<rect x="15" y="34" width="410" height="275" rx="5" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="50" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Panel A: 3 tình huống lựa chọn Learning Rate (η)</text>
<rect x="28" y="66" width="384" height="150" rx="3" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<path d="M58 198 L397 198" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<path d="M58 78 L58 204" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="397" y="210" font-size="8.8" font-weight="400" fill="#546E7A" text-anchor="end" dominant-baseline="central">Số bước lặp (Steps)</text>
<text x="58" y="74" font-size="8.8" font-weight="400" fill="#546E7A" text-anchor="middle" dominant-baseline="central">Loss</text>
<path d="M 58 123 L 83 108 L 113 143 L 143 88 L 173 163 L 203 78" fill="none" stroke="#C62828" stroke-width="2.0"/>
<text x="209" y="78" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">η quá lớn (Phân kỳ / Vọt lố)</text>
<path d="M 58 118 L 76 120.8 L 94 123.6 L 112 126.4 L 130 129.2 L 148 132.0 L 166 134.8 L 184 137.6 L 202 140.4 L 220 143.2 L 238 146.0" fill="none" stroke="#777777" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="244" y="146.0" font-size="8.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">η quá nhỏ (Hội tụ rùa bò)</text>
<path d="M 58 118 L 76 141.62495282250293 L 94 158.27317569668725 L 112 170.00498007110755 L 130 178.27224288467147 L 148 184.0980845239644 L 166 188.20348573976145 L 184 191.09651308005036 L 202 193.13519498998255 L 220 194.5718298506368 L 238 195.58420932621453" fill="none" stroke="#2E7D32" stroke-width="2.4"/>
<text x="244" y="191.58420932621453" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">η tối ưu (Hội tụ mượt)</text>
<rect x="25" y="224" width="390" height="75" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="35" y="239" font-size="9.2" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Nguyên lý toán học:</text>
<text x="35" y="254" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khai triển Taylor: f(x - η∇f) ≈ f(x) - η||∇f||² chỉ đúng khi bước η nhỏ.</text>
<text x="35" y="270" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Nếu η quá lớn: Vượt quá bán kính xấp xỉ bậc 1, loss bật nảy phân kỳ.</text>
<text x="35" y="286" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Giải pháp: Dùng Learning Rate Scheduler điều chỉnh η linh hoạt.</text>
<rect x="435" y="34" width="410" height="275" rx="5" fill="white" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="50" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Panel B: Các chiến lược Scheduler hiện đại</text>
<rect x="448" y="66" width="384" height="150" rx="3" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<path d="M478 198 L817 198" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<path d="M478 78 L478 204" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
<text x="817" y="210" font-size="8.8" font-weight="400" fill="#546E7A" text-anchor="end" dominant-baseline="central">Epochs</text>
<text x="458" y="74" font-size="8.8" font-weight="400" fill="#546E7A" text-anchor="start" dominant-baseline="central">Learning Rate η</text>
<path d="M 478 98 L 578 98 L 578 148.0 L 678 148.0 L 678 173.0 L 788 173.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="688" y="143.0" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Step Decay (Giảm theo bậc)</text>
<path d="M 478.0 193.0 L 523.0 98.0 L 531.5 98.3 L 540.0 99.0 L 548.5 100.3 L 557.0 102.1 L 565.5 104.4 L 574.0 107.1 L 582.5 110.2 L 591.0 113.7 L 599.5 117.6 L 608.0 121.8 L 616.5 126.2 L 625.0 130.8 L 633.5 135.6 L 642.0 140.5 L 650.5 145.5 L 659.0 150.5 L 667.5 155.4 L 676.0 160.2 L 684.5 164.8 L 693.0 169.2 L 701.5 173.4 L 710.0 177.3 L 718.5 180.8 L 727.0 183.9 L 735.5 186.6 L 744.0 188.9 L 752.5 190.7 L 761.0 192.0 L 769.5 192.7 L 778.0 193.0" fill="none" stroke="#1E5BB8" stroke-width="2.5"/>
<text x="593" y="110.0" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Warmup + Cosine Annealing</text>
<rect x="478" y="78" width="45" height="120" fill="#1E5BB8" fill-opacity="0.1"/>
<text x="500.5" y="186" font-size="8.0" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Warmup</text>
<rect x="445" y="224" width="390" height="75" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="455" y="239" font-size="9.2" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Chiến lược Warmup + Cosine (Khuyến nghị trong YOLO):</text>
<text x="455" y="254" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Warmup: Tăng dần η ở 3 - 5 epoch đầu để ổn định trọng số, tránh sốc gradient.</text>
<text x="455" y="270" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Cosine Decay: Giảm mượt mà không gây sốc, giữ độ dốc vừa đủ ở pha cuối.</text>
<text x="455" y="286" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Giúp mô hình chạm tới cực tiểu sắc nét hơn hẳn Step Decay.</text>
<text x="10" y="330" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Dive into Deep Learning (2023, Mục 12.11), SGDR: Cosine Annealing (Loshchilov &amp; Hutter, ICLR 2017).</text>
</svg>