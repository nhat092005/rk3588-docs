<text x="10" y="368" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: [T2 D2L tr.263-265, tr.279]. CNN trừu tượng hóa đặc trưng từ cục bộ hình học sang ngữ nghĩa toàn cục; liên hệ NPU RK3588.</text>
