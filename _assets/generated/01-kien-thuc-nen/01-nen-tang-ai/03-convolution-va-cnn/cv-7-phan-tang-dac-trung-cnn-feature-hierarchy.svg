<text x="165" y="311" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Giảm dần 32× (640 → 20) qua Stride/Pooling để nén tọa độ không gian và mở rộng Receptive Field.</text>
<rect x="18" y="323" width="135" height="17" rx="3" fill="#F5F5F5" stroke="#444444" stroke-width="0.8"/>
<text x="85" y="332" font-size="8.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">SỐ LƯỢNG KÊNH (C)</text>
