<text x="620" y="299.5" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Với K=3: Giảm </tspan><tspan font-weight="700">8 đến 9 lần</tspan><tspan> phép MAC!</tspan></text>
<text x="620" y="313.0" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• MOBILENET tr.3, Eq. 5: Tiết kiệm lớn.</tspan></text>
<text x="10" y="366" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: [T2 MOBILENET tr.2, tr.3], [T2 D2L tr.309]. Depthwise separable conv giảm 8-9 lần tính toán so với standard conv.</text>
