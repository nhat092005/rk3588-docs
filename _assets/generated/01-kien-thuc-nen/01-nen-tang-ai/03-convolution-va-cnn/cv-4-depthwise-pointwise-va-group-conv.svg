<text x="10" y="42" font-size="15.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Phổ phân rã tích chập: Standard Conv, Group Conv và Depthwise Separable Conv</text>
<rect x="10" y="64" width="280" height="280" rx="5" fill="#FAFAFA" stroke="#333333" stroke-width="1.2"/>
<text x="150.0" y="80" font-size="13.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">1. Standard Conv (g = 1)</text>
<text x="22" y="98.0" font-size="10.2" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kết nối dày đặc: </tspan><tspan>Mọi kênh vào nối với</tspan></text>
<text x="22" y="112.5" font-size="10.2" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  mọi kênh ra (Full channel mixing).</tspan></text>
<text x="22" y="127.0" font-size="10.2" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Filter 3D: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2">K × K × C_in</tspan><tspan> cho mỗi kênh ra.</tspan></text>
