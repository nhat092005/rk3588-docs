<text x="742.0" y="80" font-size="13.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">3. Depthwise Separable (g = C_in)</text>
<text x="614" y="98.0" font-size="10.2" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tách thành 2 bước riêng biệt: </tspan></text>
