<text x="446.0" y="80" font-size="13.5" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="central">2. Group Conv (1 &lt; g &lt; C_in)</text>
<text x="318" y="98.0" font-size="10.2" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Chia </tspan><tspan font-weight="700">g nhóm độc lập: </tspan><tspan>Không có sự trao</tspan></text>
