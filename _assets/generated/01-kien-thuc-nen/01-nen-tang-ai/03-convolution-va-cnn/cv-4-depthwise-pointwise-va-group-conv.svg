<text x="28" y="299.5" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Phép MAC: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5">H · W · C_out · C_in · K²</tspan></text>
<text x="28" y="313.0" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• Chi phí tính toán cao nhất.</tspan></text>
