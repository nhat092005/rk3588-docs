<rect x="30" y="268" width="485" height="64" rx="3" fill="#F0F4F8" stroke="#1E5BB8" stroke-width="1"/>
<text x="42" y="284" font-size="10.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Công thức tích lũy Receptive Field qua từng tầng:</text>
<text x="42" y="300.0" font-size="9.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Công thức: </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8">RF_k = RF_{k-1} + (k_l - 1) · s_{prev}</tspan><tspan>  (với stride s = 1)</tspan></text>
<text x="42" y="314.5" font-size="9.8" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Tầng 1: </tspan><tspan>1 + (3 - 1) = </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8">3 × 3</tspan><tspan>  |  </tspan><tspan font-weight="700">Tầng 2: </tspan><tspan>3 + (3 - 1) = </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="8.8">5 × 5 (Bao trùm toàn bộ ảnh gốc)</tspan></text>
<rect x="530" y="100" width="345" height="232" rx="3" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1"/>
<text x="702" y="118" font-size="11.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Định nghĩa &amp; Quy luật tích lũy:</text>
<text x="544" y="138" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Trích dẫn D2L tr.245: </tspan></text>
<text x="544" y="157" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  &quot;its receptive field refers to all the elements</tspan></text>
<text x="544" y="176" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  that may affect the calculation of x during</tspan></text>
<text x="544" y="195" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  the forward propagation.&quot;</tspan></text>
<text x="544" y="214" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bước 1: </tspan><tspan>1 phần tử ở Layer 1 phụ thuộc</tspan></text>
<text x="544" y="233" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  vào vùng 3×3 của Layer 0.</tspan></text>
<text x="544" y="252" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Bước 2: </tspan><tspan>1 phần tử </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.6">z</tspan><tspan> ở Layer 2 phụ thuộc</tspan></text>
<text x="544" y="271" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  vào toàn bộ 3×3 của Layer 1.</tspan></text>
<text x="544" y="290" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kết luận: </tspan><tspan>Receptive field của </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.6">z</tspan><tspan> trên</tspan></text>
<text x="544" y="309" font-size="10.6" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  ảnh gốc Layer 0 bao phủ trọn vẹn </tspan><tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="9.6">5 × 5</tspan><tspan font-weight="700">!</tspan></text>
<text x="10" y="366" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: [T2 D2L tr.245, tr.279]. Xếp chồng hai lớp 3x3 cho cùng receptive field 5x5 nhưng giảm 28% tham số và tăng tính phi tuyến.</text>
