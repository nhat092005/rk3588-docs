<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="384" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="20" y="24" font-size="13" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">CẤU TRÚC PHÂN BỔ BIT VÀ ĐÁNH ĐỔI KIỂU DỮ LIỆU: FP32, FP16, BFLOAT16 VÀ INT8</text>
<text x="20" y="42" font-size="9.2" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">So sánh các trường bit (Sign, Exponent, Mantissa), dung lượng bộ nhớ, dải động (Dynamic Range) và độ chính xác</text>
<text x="110" y="68" font-size="7.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Trường bit:</text>
<rect x="175" y="60" width="12" height="12" rx="3" fill="#EF5350" stroke="#C62828" stroke-width="0.8"/>
<text x="192" y="67" font-size="7.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Sign (Dấu: s)</text>
<rect x="270" y="60" width="12" height="12" rx="3" fill="#FFA726" stroke="#EF6C00" stroke-width="0.8"/>
<text x="287" y="67" font-size="7.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Exponent (Mũ: e)</text>
<rect x="380" y="60" width="12" height="12" rx="3" fill="#42A5F5" stroke="#1565C0" stroke-width="0.8"/>
<text x="397" y="67" font-size="7.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Mantissa (Định trị: m)</text>
<rect x="510" y="60" width="12" height="12" rx="3" fill="#66BB6A" stroke="#2E7D32" stroke-width="0.8"/>
<text x="527" y="67" font-size="7.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Integer (Số nguyên)</text>
<rect x="16" y="82" width="86" height="36" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="0.8"/>
<text x="59" y="94" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">FP32</text>
<text x="59" y="107" font-size="6.8" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">4 Byte (32 bit)</text>
<rect x="110" y="82" width="14" height="36" rx="3" fill="#EF5350" stroke="#C62828" stroke-width="0.8"/>
<text x="117.0" y="100.0" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">s</text>
<rect x="124" y="82" width="115" height="36" rx="3" fill="#FFA726" stroke="#EF6C00" stroke-width="0.8"/>
<text x="181.5" y="100.0" font-size="6.8" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Exponent: 8 bit</text>
<rect x="239" y="82" width="331" height="36" rx="3" fill="#BBDEFB" stroke="#1565C0" stroke-width="0.8"/>
<text x="404.5" y="100.0" font-size="6.8" font-weight="700" fill="#0D47A1" text-anchor="middle" dominant-baseline="central">Mantissa: 23 bit</text>
<rect x="582" y="82" width="302" height="36" rx="3" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.8"/>
<text x="590" y="93" font-size="6.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">• Dải số: Max: 3.40 × 10³⁸</text>
<text x="590" y="106" font-size="6.5" font-weight="400" fill="#455A64" text-anchor="start" dominant-baseline="central">• Chuẩn gốc huấn luyện</text>
<rect x="16" y="126" width="86" height="36" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="0.8"/>
<text x="59" y="138" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">FP16</text>
<text x="59" y="151" font-size="6.8" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">2 Byte (16 bit)</text>
<rect x="110" y="126" width="14" height="36" rx="3" fill="#EF5350" stroke="#C62828" stroke-width="0.8"/>
<text x="117.0" y="144.0" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">s</text>
<rect x="124" y="126" width="72" height="36" rx="3" fill="#FFA726" stroke="#EF6C00" stroke-width="0.8"/>
<text x="160.0" y="144.0" font-size="6.8" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Exp: 5 bit</text>
<rect x="196" y="126" width="144" height="36" rx="3" fill="#BBDEFB" stroke="#1565C0" stroke-width="0.8"/>
<text x="268.0" y="144.0" font-size="6.8" font-weight="700" fill="#0D47A1" text-anchor="middle" dominant-baseline="central">Mantissa: 10 bit</text>
<rect x="340" y="126" width="230" height="36" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="455.0" y="144.0" font-size="6.8" font-weight="400" fill="#757575" text-anchor="middle" dominant-baseline="central">Không dùng: Tiết kiệm 50% RAM so với FP32</text>
<rect x="582" y="126" width="302" height="36" rx="3" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.8"/>
<text x="590" y="137" font-size="6.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">• Dải số: Max: 6.55 × 10⁴ (dải hẹp)</text>
<text x="590" y="150" font-size="6.5" font-weight="400" fill="#455A64" text-anchor="start" dominant-baseline="central">• Tiết kiệm 50% RAM (suy luận), cần loss-scaling</text>
<rect x="16" y="170" width="86" height="36" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="0.8"/>
<text x="59" y="182" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">BFLOAT16</text>
<text x="59" y="195" font-size="6.8" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">2 Byte (16 bit)</text>
<rect x="110" y="170" width="14" height="36" rx="3" fill="#EF5350" stroke="#C62828" stroke-width="0.8"/>
<text x="117.0" y="188.0" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">s</text>
<rect x="124" y="170" width="115" height="36" rx="3" fill="#FFA726" stroke="#EF6C00" stroke-width="0.8"/>
<text x="181.5" y="188.0" font-size="6.8" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Exponent: 8 bit (như FP32)</text>
<rect x="239" y="170" width="101" height="36" rx="3" fill="#BBDEFB" stroke="#1565C0" stroke-width="0.8"/>
<text x="289.5" y="188.0" font-size="6.8" font-weight="700" fill="#0D47A1" text-anchor="middle" dominant-baseline="central">Mantissa: 7 bit</text>
<rect x="340" y="170" width="230" height="36" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="455.0" y="188.0" font-size="6.8" font-weight="400" fill="#757575" text-anchor="middle" dominant-baseline="central">Không dùng: Tiết kiệm 50% RAM so với FP32</text>
<rect x="582" y="170" width="302" height="36" rx="3" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.8"/>
<text x="590" y="181" font-size="6.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">• Dải số: Max: 3.38 × 10³⁸ (như FP32)</text>
<text x="590" y="194" font-size="6.5" font-weight="400" fill="#455A64" text-anchor="start" dominant-baseline="central">• Tiết kiệm 50% RAM (suy luận), dải rộng như FP32</text>
<rect x="16" y="214" width="86" height="36" rx="3" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="0.8"/>
<text x="59" y="226" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">INT8</text>
<text x="59" y="239" font-size="6.8" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">1 Byte (8 bit)</text>
<rect x="110" y="214" width="115" height="36" rx="3" fill="#A5D6A7" stroke="#2E7D32" stroke-width="0.8"/>
<text x="167.5" y="232.0" font-size="6.8" font-weight="700" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Integer: 8 bit (b=8)</text>
<rect x="225" y="214" width="345" height="36" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="397.5" y="232.0" font-size="6.8" font-weight="400" fill="#757575" text-anchor="middle" dominant-baseline="central">Không dùng: Tiết kiệm 75% RAM (4×) so với FP32</text>
<rect x="582" y="214" width="302" height="36" rx="3" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.8"/>
<text x="590" y="225" font-size="6.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">• Dải số: [-128, 127] hoặc [0, 255]</text>
<text x="590" y="238" font-size="6.5" font-weight="400" fill="#455A64" text-anchor="start" dominant-baseline="central">• Tiết kiệm 75% RAM, tối ưu NPU RK3588</text>
<rect x="16" y="258" width="428" height="88" rx="4" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="0.9"/>
<rect x="22" y="264" width="416" height="18" rx="2" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="0.6"/>
<text x="230.0" y="273" font-size="7.2" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">1. ĐÁNH ĐỔI GIỮA DẢI ĐỘNG (EXPONENT) VÀ ĐỘ CHÍNH XÁC (MANTISSA)</text>
<text x="26" y="294" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• BFLOAT16 giữ trọn 8 bit Exponent như FP32 nên giữ nguyên dải động (~10³⁸),</text>
<text x="26" y="307" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  giúp quá trình training hội tụ ổn định không cần sửa thuật toán loss-scaling.</text>
<text x="26" y="320" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• FP16 có 10 bit Mantissa cho độ chính xác cao hơn BF16, nhưng Exponent chỉ có 5 bit,</text>
<text x="26" y="333" font-size="6.8" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">  dẫn tới dải số cực đại chỉ 6.55 × 10⁴, rất dễ tràn số (overflow) hoặc tắt về 0 (underflow).</text>
<rect x="456" y="258" width="428" height="88" rx="4" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="0.9"/>
<rect x="462" y="264" width="416" height="18" rx="2" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="0.6"/>
<text x="670.0" y="273" font-size="7.2" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Ý NGHĨA KHI TRIỂN KHAI TRÊN NPU RK3588 (6 TOPS INT8)</text>
<text x="466" y="294" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• INT8 (1 byte): Giảm tải 4× băng thông DRAM và SRAM cache so với FP32.</text>
<text x="466" y="307" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phép cộng INT8 tiết kiệm năng lượng 30× và diện tích silicon 116× so với FP32.</text>
<text x="466" y="320" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• NPU RK3588 tối ưu hóa tuyệt đối cho INT8 (đạt đỉnh 6 TOPS với 3 lõi NPU),</text>
<text x="466" y="333" font-size="6.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">  trong khi FP16/BF16 được hỗ trợ nhưng tốn băng thông gấp đôi (datasheet không nêu thông lượng).</text>
<text x="10" y="370" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: [T2 BF16 tr.4, Table 1], [T2 MIXP tr.1-3], [T2 GHOLAMI pdf 12-13], [T1 RK3588 Datasheet V0.1 §1.2.6]. Tự tính: 1 byte = 8 bit.</text>
</svg>