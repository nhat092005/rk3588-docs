<text x="687" y="196" font-size="5.2" font-weight="400" fill="#991B1B" text-anchor="middle" dominant-baseline="central">(Memory Wall)</text>
<rect x="735" y="102" width="125" height="148" rx="4" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.1"/>
<text x="797" y="114" font-size="7.2" font-weight="700" fill="#9F1239" text-anchor="middle" dominant-baseline="central">External DRAM</text>
<text x="797" y="125" font-size="6.0" font-weight="400" fill="#E11D48" text-anchor="middle" dominant-baseline="central">(LPDDR4x / LPDDR5)</text>
<rect x="743" y="134" width="109" height="108" rx="3" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="0.8"/>
<text x="797" y="146" font-size="6.8" font-weight="700" fill="#BE123C" text-anchor="middle" dominant-baseline="central">RAM Ngoại Vi</text>
<text x="749" y="162" font-size="6.2" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">• Dung lượng: 4 - 16 GB</text>
<text x="749" y="176" font-size="6.2" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">• Băng thông: ~34 GB/s</text>
<text x="749" y="190" font-size="6.2" font-weight="700" fill="#E11D48" text-anchor="start" dominant-baseline="central">• Tràn ra ngoài (Spill):</text>
<text x="749" y="204" font-size="6.2" font-weight="700" fill="#E11D48" text-anchor="start" dominant-baseline="central">  Tiêu hao điện x10-50!</text>
<text x="749" y="218" font-size="5.8" font-weight="400" fill="#9F1239" text-anchor="start" dominant-baseline="central">  Độ trễ cao (~100+ chu kỳ)</text>
<text x="749" y="230" font-size="6.2" font-weight="700" fill="#DC2626" text-anchor="start" dominant-baseline="central">  Kéo tụt FPS thực tế</text>
<rect x="465" y="268" width="405" height="50" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
<text x="471" y="279" font-size="7.2" font-weight="700" fill="#166534" text-anchor="start" dominant-baseline="central">CHIẾN LƯỢC TỐI ƯU CỦA RKNN COMPILER &amp; SYSTEM DESIGNER:</text>
<text x="471" y="293" font-size="7.0" font-weight="400" fill="#14532D" text-anchor="start" dominant-baseline="central">• Operator Fusion: Ghép Conv + BN + ReLU để giam giữ feature map trung gian trong SRAM.</text>
<text x="471" y="305" font-size="7.0" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">• Cân đối độ phân giải: Giữ ảnh 640×640 để vừa vặn SRAM, tránh sập bẫy nghẽn Bus DDR.</text>
<rect x="20" y="334" width="860" height="24" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="450" y="346" font-size="7.5" font-weight="700" fill="#1E293B" text-anchor="middle" dominant-baseline="central">BẢN CHẤT: Parameters quyết định dung lượng file (.rknn); Activations quyết định RAM thực thi và nguy cơ nghẽn phần cứng.</text>
<text x="10" y="382" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Rockchip RK3588 TRM; Chen et al. Eyeriss ISCA 2016; Lin et al. MCUNet 2020.</text>
