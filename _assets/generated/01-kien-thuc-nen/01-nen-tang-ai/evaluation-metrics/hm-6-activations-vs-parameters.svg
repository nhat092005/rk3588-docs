<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="20" y="24" font-size="13" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">BỘ NHỚ ĐỘNG (ACTIVATIONS) VS. TRỌNG SỐ TĨNH (PARAMETERS) VÀ NÚT THẮT SRAM/DDR</text>
<text x="20" y="42" font-size="9.2" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Đối chiếu trực quan: Trọng số mô hình bất biến vs. Feature Map bùng nổ theo diện tích ảnh dẫn đến tràn SRAM ra DDR ngoài</text>
<rect x="20" y="56" width="425" height="270" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="32" y="70" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. ĐỐI CHIẾU DUNG LƯỢNG: PARAMETERS (TĨNH) VS. ACTIVATIONS (ĐỘNG)</text>
<text x="32" y="82" font-size="6.8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Weights cố định theo model; Activations tăng bậc 2 theo diện tích H × W</text>
<rect x="30" y="92" width="405" height="168" rx="3" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="0.8"/>
<line x1="45" y1="222" x2="415" y2="222" stroke="#90A4AE" stroke-width="1.0"/>
