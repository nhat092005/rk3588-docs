<text x="176" y="198" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">~15 MB</text>
<text x="176" y="232" font-size="6.8" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">Ảnh 320²</text>
<text x="176" y="244" font-size="6.0" font-weight="400" fill="#78909C" text-anchor="middle" dominant-baseline="central">(1x diện tích)</text>
<rect x="235" y="184" width="52" height="38" rx="2" fill="#FED7AA" stroke="#EA580C" stroke-width="1.2"/>
