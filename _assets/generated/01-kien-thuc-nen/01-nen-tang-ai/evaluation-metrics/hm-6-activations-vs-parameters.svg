<text x="91" y="232" font-size="6.8" font-weight="700" fill="#0369A1" text-anchor="middle" dominant-baseline="central">Parameters</text>
<text x="91" y="244" font-size="6.0" font-weight="400" fill="#78909C" text-anchor="middle" dominant-baseline="central">(Cố định)</text>
<rect x="150" y="206" width="52" height="16" rx="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
