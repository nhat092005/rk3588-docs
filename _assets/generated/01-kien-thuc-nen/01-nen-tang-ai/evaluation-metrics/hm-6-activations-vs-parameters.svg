<text x="261" y="161" font-size="5.5" font-weight="700" fill="#9A3412" text-anchor="middle" dominant-baseline="central">x4 diện tích</text>
<text x="261" y="232" font-size="6.8" font-weight="700" fill="#9A3412" text-anchor="middle" dominant-baseline="central">Ảnh 640²</text>
<text x="261" y="244" font-size="6.0" font-weight="400" fill="#78909C" text-anchor="middle" dominant-baseline="central">(Chuẩn phổ biến)</text>
<rect x="320" y="126" width="52" height="96" rx="2" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
<rect x="320" y="112" width="52" height="12" rx="2" fill="#DC2626" stroke="#B91C1C" stroke-width="0.8"/>
<text x="346" y="118" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">~240 MB</text>
<rect x="320" y="98" width="52" height="11" rx="2" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.7"/>
<text x="346" y="103" font-size="5.8" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="central">x16 lần!</text>
<text x="346" y="232" font-size="6.8" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="central">Ảnh 1280²</text>
<text x="346" y="244" font-size="6.0" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">(Bùng nổ bộ nhớ)</text>
<path d="M 195 190 Q 255 155 320 108" stroke="#DC2626" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#mDC2626n)"/>
<rect x="240" y="134" width="76" height="13" rx="2" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.7"/>
<text x="278" y="140.5" font-size="6.2" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">Bùng nổ O(H×W)</text>
<rect x="30" y="268" width="405" height="50" rx="3" fill="#FFF5F5" stroke="#FFCDD2" stroke-width="0.8"/>
<text x="36" y="279" font-size="7.2" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">• Đặc tính cốt lõi: Trọng số (weights) bất biến, chỉ nạp 1 lần vào RAM khi khởi động.</text>
<text x="36" y="293" font-size="7.2" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">• Nguy cơ thực tế: NPU hiếm khi nghẽn vì weights (chỉ 3.2 MB), mà luôn bị đe dọa</text>
<text x="36" y="305" font-size="7.2" font-weight="700" fill="#B71C1C" text-anchor="start" dominant-baseline="central">  bởi Feature Maps của ảnh độ phân giải cao vượt quá dung lượng SRAM nội bộ.</text>
<rect x="455" y="56" width="425" height="270" rx="4" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="467" y="70" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. SƠ ĐỒ PHẦN CỨNG: NÚT THẮT BĂNG THÔNG ON-CHIP SRAM VS. DDR NGOÀI</text>
<text x="467" y="82" font-size="6.8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">SRAM nội bộ siêu tốc vs. DDR ngoài nghẽn cổ chai (Memory Wall)</text>
<rect x="465" y="92" width="405" height="168" rx="3" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="0.8"/>
<rect x="475" y="102" width="165" height="148" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="483" y="114" font-size="7.2" font-weight="700" fill="#1E293B" text-anchor="start" dominant-baseline="central">Lõi NPU RK3588 (Core 0/1/2)</text>
<rect x="483" y="124" width="149" height="38" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.9"/>
<text x="557" y="137" font-size="6.8" font-weight="700" fill="#0369A1" text-anchor="middle" dominant-baseline="central">Mảng Tính Toán MAC</text>
<text x="557" y="150" font-size="6.0" font-weight="400" fill="#0284C7" text-anchor="middle" dominant-baseline="central">Đỉnh 2.0 TOPS / Core</text>
<rect x="483" y="178" width="149" height="64" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="557" y="192" font-size="7.2" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">ON-CHIP SRAM CACHE</text>
<text x="557" y="206" font-size="6.2" font-weight="400" fill="#15803D" text-anchor="middle" dominant-baseline="central">Dung lượng giới hạn (~vài MB)</text>
<text x="557" y="219" font-size="6.2" font-weight="700" fill="#166534" text-anchor="middle" dominant-baseline="central">Băng thông siêu tốc &gt; hàng trăm GB/s</text>
<text x="557" y="232" font-size="5.8" font-weight="400" fill="#15803D" text-anchor="middle" dominant-baseline="central">Độ trễ 0 ns · Tiêu hao điện cực thấp</text>
