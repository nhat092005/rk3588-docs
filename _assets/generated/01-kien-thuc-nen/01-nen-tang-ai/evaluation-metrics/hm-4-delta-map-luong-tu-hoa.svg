<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="280" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="22" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Độ sụt giảm do Lượng tử hóa (ΔmAP) và Đánh đổi Hiệu năng trên NPU RK3588</text>
<rect x="10" y="38" width="440" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="24" y="54" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. Đánh đổi mô hình gốc (FP32) vs Lượng tử hóa (INT8)</text>
<rect x="28" y="72" width="114" height="86" rx="4" fill="#E1F5FE" stroke="#1E5BB8" stroke-width="1.5"/>
<text x="85.0" y="89" font-size="9.5" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">FP32 Baseline</text>
<text x="85.0" y="109" font-size="12.0" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">mAP: 45.2%</text>
<text x="85.0" y="127" font-size="8.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Bộ nhớ: 100% (Gốc)</text>
<text x="85.0" y="143" font-size="8.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Tốc độ: 1.0x (NPU chậm)</text>
<line x1="170" y1="98" x2="216" y2="98" stroke="#C62828" stroke-width="2.0"/>
<polygon points="216,94 224,98 216,102" fill="#C62828"/>
<text x="195" y="86" font-size="9.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">ΔmAP</text>
<text x="195" y="114" font-size="11.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">-1.4%</text>
<rect x="252" y="72" width="114" height="86" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="309.0" y="89" font-size="9.5" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">INT8 (RKNN)</text>
<text x="309.0" y="109" font-size="12.0" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">mAP: 43.8%</text>
<text x="309.0" y="127" font-size="8.0" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Bộ nhớ: -75% (Tiết kiệm)</text>
<text x="309.0" y="143" font-size="8.0" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Tốc độ: x3.8 (Tối đa 3 Core)</text>
<rect x="24" y="168" width="412" height="56" rx="4" fill="#F1F8E9" stroke="#C8E6C9" stroke-width="1.0"/>
<text x="32" y="184" font-size="9.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Tiêu chuẩn đánh giá suy giảm:</text>
<text x="32" y="200" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• </tspan><tspan font-weight="700">ΔmAP ≤ 1.5 - 2.0%: </tspan><tspan>PASS. Đạt chuẩn đưa thẳng vào vận hành công nghiệp.</tspan></text>
<text x="32" y="214" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>• </tspan><tspan font-weight="700">ΔmAP &gt; 3.0%: </tspan><tspan>FAIL. Cần can thiệp QAT hoặc Hybrid Quantization (FP16).</tspan></text>
<rect x="460" y="38" width="430" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="474" y="54" font-size="10.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Bản chất sai số: Lệch viền do làm tròn số học (Jitter)</text>
<rect x="474" y="68" width="186" height="56" rx="4" fill="#E1F5FE" stroke="#90CAF9" stroke-width="1.0"/>
<text x="482" y="82" font-size="8.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">A. FP32 (Độ chính xác cao)</text>
<rect x="484" y="88" width="36" height="28" rx="2" fill="white" stroke="#78909C" stroke-width="1.0" stroke-dasharray="5 3"/>
<rect x="483" y="87" width="38" height="30" rx="2" fill="none" stroke="#1E5BB8" stroke-width="1.6"/>
<text x="530" y="100" font-size="8.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">IoU = 0.91 (Khớp 91%)</text>
<text x="530" y="114" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Viền ôm sát nhãn thực tế</text>
<rect x="474" y="130" width="186" height="56" rx="4" fill="#FFF3E0" stroke="#FFE0B2" stroke-width="1.0"/>
<text x="482" y="144" font-size="8.0" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">B. INT8 (Làm tròn số học)</text>
<rect x="484" y="150" width="36" height="28" rx="2" fill="white" stroke="#78909C" stroke-width="1.0" stroke-dasharray="5 3"/>
<rect x="489" y="154" width="35" height="27" rx="2" fill="none" stroke="#E65100" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="530" y="162" font-size="8.0" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">IoU = 0.63 (Lệch 4px)</text>
<text x="530" y="176" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Nhiễu làm tròn (Jitter)</text>
<rect x="668" y="68" width="208" height="118" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="678" y="84" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Sát hạch qua 2 thước đo:</text>
<text x="678" y="103" font-size="8.0" fill="#2E7D32" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• mAP@0.50: </tspan><tspan font-weight="700">Cả 2 đều PASS</tspan></text>
<text x="686" y="117" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">Cả 0.91 và 0.63 đều ≥ 0.50</text>
<text x="686" y="129" font-size="7.5" font-weight="400" fill="#2E7D32" text-anchor="start" dominant-baseline="central">-&gt; mAP50 hầu như không đổi</text>
<text x="678" y="148" font-size="8.0" fill="#C62828" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• mAP@0.75: </tspan><tspan font-weight="700">INT8 bị FAIL</tspan></text>
<text x="686" y="162" font-size="7.5" font-weight="400" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">FP32: 0.91 ≥ 0.75 (Đạt TP)</text>
<text x="686" y="174" font-size="7.5" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">INT8: 0.63 &lt; 0.75 (Rớt thành FP)</text>
<text x="474" y="202" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Hệ quả: Lệch 3-5px không ảnh hưởng mAP50 nhưng kéo tụt mAP50-95.</text>
<text x="474" y="218" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Giải pháp: Dùng QAT hoặc Hybrid Quantization (giữ Head ở FP16).</text>
<text x="10" y="266" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Rockchip RKNN-Toolkit2 Docs; Nagel et al. White Paper 2021; Y6 tr.12.</text>
</svg>