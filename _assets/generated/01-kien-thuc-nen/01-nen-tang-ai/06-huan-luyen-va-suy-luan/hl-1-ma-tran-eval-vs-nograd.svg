<text x="715" y="158" font-size="7.5" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">-&gt; Dự đoán bị nhiễu ngẫu nhiên!</text>
<text x="710" y="174" font-size="8.0" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">• BN vẫn cập nhật running stats</text>
<text x="715" y="188" font-size="7.5" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">-&gt; Làm trôi lệch trọng số gốc!</text>
<text x="530" y="222" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">-&gt; Lỗi ngầm cực kỳ nguy hiểm trong inference pipeline.</text>
