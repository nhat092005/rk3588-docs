 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="452" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ma trận phối hợp PyTorch: Cấu trúc mạng (Dropout, BN) và Luồng Gradient theo 4 trạng thái</text>
<rect x="165" y="38" width="340" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="335.0" y="53" font-size="9.8" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Autograd BẬT: torch.enable_grad() (Mặc định)</text>
<text x="335.0" y="67" font-size="8.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">Ghi chép đồ thị DAG, lưu intermediate activations vào VRAM</text>
<rect x="515" y="38" width="340" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="685.0" y="53" font-size="9.8" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Autograd TẮT: with torch.no_grad()</text>
<text x="685.0" y="67" font-size="8.2" font-weight="400" fill="#777777" text-anchor="middle" dominant-baseline="central">Tắt ghi DAG, kết quả requires_grad=False, giải phóng bộ nhớ</text>
<rect x="15" y="82" width="140" height="160" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="25" y="104" font-size="11" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">model.train()</text>
<text x="25" y="122" font-size="9" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Chế độ Huấn luyện</text>
<text x="25" y="147" font-size="8.6" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Dropout: BẬT</text>
<text x="25" y="161" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Loại ngẫu nhiên nút (p &gt; 0)</text>
<text x="25" y="184" font-size="8.6" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">BatchNorm: CẬP NHẬT</text>
<text x="25" y="198" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Dùng μ_B, σ²_B của batch</text>
<text x="25" y="212" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Tích lũy running stats</text>
<rect x="15" y="250" width="140" height="160" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.2"/>
<text x="25" y="272" font-size="11" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">model.eval()</text>
<text x="25" y="290" font-size="9" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Chế độ Đánh giá / Suy luận</text>
<text x="25" y="315" font-size="8.6" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Dropout: TẮT</text>
<text x="25" y="329" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Hàm đồng nhất (Identity)</text>
<text x="25" y="352" font-size="8.6" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">BatchNorm: CỐ ĐỊNH</text>
<text x="25" y="366" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Dùng μ_run, σ²_run đã khóa</text>
<text x="25" y="380" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Không đổi running stats</text>
