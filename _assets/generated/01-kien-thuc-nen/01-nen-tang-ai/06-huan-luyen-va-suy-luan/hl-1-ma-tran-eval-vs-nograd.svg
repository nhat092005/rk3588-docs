<text x="365" y="128" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Forward: lưu cache VRAM</text>
<text x="365" y="144" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Dropout: triệt tiêu nút h₂</text>
<text x="365" y="160" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• BN: μ_B, σ²_B từ mini-batch</text>
<text x="365" y="176" font-size="8.0" font-weight="600" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Backward: tính đạo hàm</text>
<text x="365" y="192" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Sẵn sàng optimizer.step()</text>
<text x="180" y="222" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">-&gt; Trạng thái chuẩn trong vòng lặp huấn luyện chính.</text>
