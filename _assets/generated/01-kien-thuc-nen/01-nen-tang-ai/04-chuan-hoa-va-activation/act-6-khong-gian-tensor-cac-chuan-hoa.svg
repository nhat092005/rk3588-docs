<text x="592" y="156.0" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="start" dominant-baseline="central">N ↗</text>
<rect x="435" y="188" width="190" height="104" rx="4" fill="#F8FAFC" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="530.0" y="202" font-size="10" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Riêng 1 Kênh, 1 Mẫu</text>
<text x="440" y="218" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Gom: Gom không gian (H, W)</text>
<text x="440" y="234" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thống kê: μ_n,c, σ²_n,c trên (H×W)</text>
<text x="440" y="249" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ưu điểm: Khử tương phản toàn cục</text>
<text x="440" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Hạn chế: Mất thông tin độ sáng nền</text>
<text x="440" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phần cứng: Tính riêng từng ảnh</text>
