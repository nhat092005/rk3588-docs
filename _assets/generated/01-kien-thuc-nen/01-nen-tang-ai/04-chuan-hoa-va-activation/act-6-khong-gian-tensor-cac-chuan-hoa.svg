<text x="172" y="156.0" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="start" dominant-baseline="central">N ↗</text>
<rect x="15" y="188" width="190" height="104" rx="4" fill="#F8FAFC" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="110.0" y="202" font-size="10" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Theo từng Kênh (C)</text>
<text x="20" y="218" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Gom: Gom toàn bộ N và (H, W)</text>
<text x="20" y="234" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thống kê: μ_c, σ²_c trên (B×H×W)</text>
<text x="20" y="249" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Ưu điểm: Gộp triệt để vào Conv</text>
<text x="20" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Hạn chế: Kém khi batch B ≤ 4</text>
<text x="20" y="279" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Phần cứng: Chi phí suy luận = 0</text>
<rect x="220" y="32" width="200" height="264" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="320.0" y="46" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Layer Normalization (LN)</text>
