<text x="298.5" y="180" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="middle" dominant-baseline="central">(H, W) →</text>
<text x="382" y="156.0" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="start" dominant-baseline="central">N ↗</text>
<rect x="225" y="188" width="190" height="104" rx="4" fill="#F8FAFC" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="320.0" y="202" font-size="10" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Theo từng Mẫu (N)</text>
<text x="230" y="218" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Gom: Gom toàn bộ C và (H, W)</text>
<text x="230" y="234" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thống kê: μ_n, σ²_n trên (C×H×W)</text>
<text x="230" y="249" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ưu điểm: Độc lập với Batch Size</text>
<text x="230" y="264" font-size="8.5" font-weight="400" fill="#C62828" text-anchor="start" dominant-baseline="central">• Hạn chế: Khó gập vào Conv trên NPU</text>
<text x="230" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phần cứng: Tốn chu kỳ ALU động</text>
