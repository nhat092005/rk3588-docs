<text x="10" y="18" font-size="14.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Không gian tensor của 4 phương pháp chuẩn hóa (Chuẩn Wu &amp; He, ECCV 2018)</text>
<rect x="10" y="32" width="200" height="264" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="110.0" y="46" font-size="10.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Batch Normalization (BN)</text>
