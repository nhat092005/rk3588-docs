<text x="718.5" y="180" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="middle" dominant-baseline="central">(H, W) →</text>
<text x="802" y="156.0" font-size="9.5" font-weight="700" fill="#546E7A" text-anchor="start" dominant-baseline="central">N ↗</text>
<rect x="645" y="188" width="190" height="104" rx="4" fill="#F8FAFC" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="740.0" y="202" font-size="10" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Theo nhóm Kênh (C/G)</text>
<text x="650" y="218" font-size="8.8" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">• Gom: Gom C/G kênh và (H, W)</text>
<text x="650" y="234" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thống kê: μ_n,g, σ²_n,g trên (C/G×H×W)</text>
<text x="650" y="249" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ưu điểm: Rất ổn định khi batch nhỏ</text>
<text x="650" y="264" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Hạn chế: Tốn tính toán hơn BN</text>
<text x="650" y="279" font-size="8.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phần cứng: Nhóm C/G linh hoạt</text>
<text x="10" y="318" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Group Normalization (Wu &amp; He, ECCV 2018), Dive into Deep Learning (2023).</text>
