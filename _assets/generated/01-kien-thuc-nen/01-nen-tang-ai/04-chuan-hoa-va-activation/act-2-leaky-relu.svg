<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="200" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="15" y="18" font-size="14.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Hàm kích hoạt LeakyReLU: Giữ dòng gradient miền âm</text>
<rect x="15" y="28" width="460" height="138" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="25" y="43" font-size="12" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">LeakyReLU (α = 0.1): f(x) = max(αx, x)</text>
<text x="25" y="63" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Khắc phục Dying ReLU: Miền âm duy trì độ dốc nhỏ α, giữ gradient rò rỉ liên tục.</text>
<text x="25" y="84" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Cơ chế tự phục hồi: Nơ-ron không bao giờ chết hẳn, luôn có cơ hội cập nhật lại.</text>
<text x="25" y="105" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Đạo hàm: f&#x27;(x) = 1 khi x &gt; 0; f&#x27;(x) = α khi x &lt; 0; nhảy bậc tại điểm gãy x = 0.</text>
<text x="25" y="126" font-size="9.2" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Phần cứng NPU RK3588: Ghép trực tiếp vào DPU ALU, tốc độ thực thi tương đương ReLU.</text>
<text x="25" y="147" font-size="9.2" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Thân thiện INT8: Vẫn là tuyến tính từng đoạn, dễ lượng tử hóa và bảo toàn độ chính xác.</text>
