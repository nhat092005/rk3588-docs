<text x="451" y="168" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ưu điểm: Zero-Centered (đối xứng qua gốc 0), tối ưu gradient nhanh hơn Sigmoid.</text>
<text x="451" y="188" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Nhược điểm: Vẫn bão hòa ở 2 biên khi |x| lớn; cần bảng tra LUT trên NPU.</text>
<text x="10" y="234" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: LeCun et al. (Efficient BackProp 1998), Goodfellow et al. (Deep Learning 2016).</text>
