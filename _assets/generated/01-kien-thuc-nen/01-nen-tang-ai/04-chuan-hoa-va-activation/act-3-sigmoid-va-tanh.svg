<text x="29" y="168" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Vùng bão hòa: |x| &gt; 3 → σ&#x27;(x) ≈ 0, gây triệt tiêu gradient ở mạng sâu.</text>
<text x="29" y="188" font-size="8.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Nhược điểm: Không Zero-Centered (luôn dương), khiến cập nhật gradient zigzag.</text>
<rect x="437" y="28" width="408" height="186" rx="5" fill="#FCFDFD" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="449" y="46" font-size="11.5" font-weight="700" fill="#7B1FA2" text-anchor="start" dominant-baseline="central">Hàm Tanh: tanh(x) = (e^x - e^-x) / (e^x + e^-x)</text>
