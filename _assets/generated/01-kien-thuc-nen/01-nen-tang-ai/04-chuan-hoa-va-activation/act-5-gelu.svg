 id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="200" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="15" y="18" font-size="14.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Hàm kích hoạt GELU: Chuẩn mực trong Vision Transformer</text>
<rect x="15" y="28" width="460" height="138" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="25" y="43" font-size="11.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">GELU: f(x) = x · Φ(x) = x · P(X ≤ x),  X ~ N(0, 1)</text>
<text x="25" y="63" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Xấp xỉ thực thi: f(x) ≈ 0.5x · [1 + tanh(√(2/π) · (x + 0.044715x³))].</text>
<text x="25" y="84" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Bản chất: Kết hợp đặc tính Dropout ngẫu nhiên và hàm trơn trong một toán tử duy nhất.</text>
<text x="25" y="105" font-size="9.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Điểm cực tiểu: x ≈ -0.75 (y ≈ -0.17), làm phẳng bề mặt tối ưu và hội tụ nhanh.</text>
<text x="25" y="126" font-size="9.2" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Ứng dụng: Chuẩn mực trong Vision Transformer (ViT, Swin) và các mô hình LLM.</text>
<text x="25" y="147" font-size="9.2" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Phần cứng NPU RK3588: Đòi hỏi bảng tra LUT trong DPU; chi phí cao hơn ReLU.</text>
