<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 432" width="860" height="432" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="432" fill="white"/>
<rect x="730" y="4" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="766.6" y="15.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="12" y="18" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Hệ tọa độ ảnh và 3 định dạng biểu diễn Bounding Box: xyxy, xywh và xywh chuẩn hóa</text>
<rect x="15" y="42" width="425" height="225" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
<circle cx="40" cy="67" r="4" fill="#C62828" stroke="#C62828" stroke-width="1.2"/>
<text x="50" y="60" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">(0, 0) Gốc tọa độ trên-trái</text>
<path d="M40 67 L175 67" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#m222222n)"/>
<text x="183" y="70" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Trục X (chiều rộng W)</text>
<path d="M40 67 L40 162" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#m222222n)"/>
<text x="47" y="157" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Trục Y (chiều cao H)</text>
<text x="425" y="257" font-size="7.8" font-weight="400" fill="#777777" text-anchor="end" dominant-baseline="central">Kích thước ảnh: W × H (vd: 640 × 480)</text>
<circle cx="230.0" cy="141.5" r="14" fill="#CBD5E1" stroke="#444444" stroke-width="1.2"/>
<rect x="212.0" y="157.5" width="36" height="48" rx="4" fill="#CBD5E1" stroke="#444444" stroke-width="1.2"/>
<rect x="125" y="97" width="210" height="125" rx="4" fill="none" stroke="#2E7D32" stroke-width="2.0"/>
<circle cx="125" cy="97" r="4" fill="#2E7D32" stroke="#444444" stroke-width="1.2"/>
<text x="119" y="91" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="end" dominant-baseline="central">(x₁, y₁)</text>
<circle cx="335" cy="222" r="4" fill="#2E7D32" stroke="#444444" stroke-width="1.2"/>
<text x="341" y="236" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">(x₂, y₂)</text>
<circle cx="230.0" cy="159.5" r="4" fill="#1E5BB8" stroke="#444444" stroke-width="1.2"/>
<text x="254.0" y="153.5" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Tâm (c_x, c_y)</text>
<path d="M125 234 L335 234" fill="none" stroke="#1E5BB8" stroke-width="1.2"/>
<path d="M215 234 L125 234" fill="none" stroke="#1E5BB8" stroke-width="1.2" marker-end="url(#m1E5BB8n)"/>
<path d="M245 234 L335 234" fill="none" stroke="#1E5BB8" stroke-width="1.2" marker-end="url(#m1E5BB8n)"/>
<text x="230.0" y="246" font-size="8.0" font-weight="600" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Chiều rộng: w = x₂ - x₁</text>
<path d="M347 97 L347 222" fill="none" stroke="#1E5BB8" stroke-width="1.2"/>
<path d="M347 144.5 L347 97" fill="none" stroke="#1E5BB8" stroke-width="1.2" marker-end="url(#m1E5BB8n)"/>
<path d="M347 174.5 L347 222" fill="none" stroke="#1E5BB8" stroke-width="1.2" marker-end="url(#m1E5BB8n)"/>
<text x="353" y="162.5" font-size="8.0" font-weight="600" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">h = y₂ - y₁</text>
<rect x="455" y="42" width="390" height="68" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="455" y="42" width="390" height="22" rx="4" fill="#DCFCE7" stroke="#2E7D32" stroke-width="1.3"/>
<text x="467" y="57" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">1. Định dạng xyxy: (x₁, y₁, x₂, y₂) theo pixel</text>
<text x="467" y="80" font-size="8.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tọa độ hai góc cực: góc trên-trái và góc dưới-phải.</text>
<text x="467" y="96" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Chuẩn hiển thị OpenCV (cv2.rectangle), tính giao/hợp IoU, NMS.</text>
<rect x="455" y="120" width="390" height="68" rx="4" fill="#FFFFFF" stroke="#1E5BB8" stroke-width="1.3"/>
<rect x="455" y="120" width="390" height="22" rx="4" fill="#DBEAFE" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="467" y="135" font-size="9.0" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">2. Định dạng xywh: (c_x, c_y, w, h) theo pixel</text>
<text x="467" y="158" font-size="8.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tọa độ tâm hình học và kích thước rộng, cao của hộp.</text>
<text x="467" y="174" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Chuẩn đầu ra mô hình hồi quy (độ lệch anchor hoặc bounding head).</text>
<rect x="455" y="198" width="390" height="69" rx="4" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.3"/>
<rect x="455" y="198" width="390" height="22" rx="4" fill="#F3E8FF" stroke="#7B1FA2" stroke-width="1.3"/>
<text x="467" y="213" font-size="8.8" font-weight="700" fill="#7B1FA2" text-anchor="start" dominant-baseline="central">3. Định dạng xywh chuẩn hóa: (c_x/W, c_y/H, w/W, h/H) ∈ [0, 1]</text>
<text x="467" y="236" font-size="8.2" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Chia tọa độ cho kích thước ảnh: độc lập với độ phân giải đầu vào.</text>
<text x="467" y="252" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">• Định dạng nhãn huấn luyện Ultralytics YOLO (.txt 5 cột: cls cx cy w h).</text>
<rect x="15" y="280" width="830" height="115" rx="6" fill="#FAFAFA" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="15" y="280" width="830" height="24" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
<text x="25" y="296" font-size="9.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">CÔNG THỨC CHUYỂN ĐỔI HAI CHIỀU VÀ VÍ DỤ SỐ ĐỐI CHIẾU</text>
<text x="35" y="324" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Từ xyxy sang xywh (Tính tâm và kích thước):</text>
<text x="45" y="342" font-size="8.5" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">c_x = (x₁ + x₂) / 2 ,   c_y = (y₁ + y₂) / 2</text>
<text x="45" y="358" font-size="8.5" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">w = x₂ - x₁ ,   h = y₂ - y₁</text>
<text x="35" y="378" font-size="8.0" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Chuẩn hóa: c_x_norm = c_x / W ,  w_norm = w / W</text>
<text x="455" y="324" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Từ xywh sang xyxy (Tính hai góc cực):</text>
<text x="465" y="342" font-size="8.5" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">x₁ = c_x - w / 2 ,   y₁ = c_y - h / 2</text>
<text x="465" y="358" font-size="8.5" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">x₂ = c_x + w / 2 ,   y₂ = c_y + h / 2</text>
<text x="455" y="378" font-size="7.8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Ví dụ đối chiếu: W×H=640×480, hộp (160, 120, 480, 360) -&gt; norm (0.5, 0.5, 0.5, 0.5)</text>
<text x="10" y="418" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: T2 D2L tr.607-608; T1 ultralytics data/utils.py:348-358. Gốc tọa độ ảnh quy ước ở góc trên-trái (0, 0).</text>
</svg>