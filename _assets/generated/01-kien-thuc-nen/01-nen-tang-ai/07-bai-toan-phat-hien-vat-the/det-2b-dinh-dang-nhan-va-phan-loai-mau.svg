<text x="465" y="280" font-size="6.8" font-weight="700" fill="#1E40AF" text-anchor="start" dominant-baseline="central">• Vì vậy detector cần Focal Loss / BCE có trọng số để không bị mẫu nền áp đảo gradient.</text>
