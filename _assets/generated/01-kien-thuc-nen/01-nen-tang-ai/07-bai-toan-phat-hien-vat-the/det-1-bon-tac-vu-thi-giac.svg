<text x="25" y="296" font-size="9.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">ĐỐI CHIẾU ĐẦU RA VÀ MỨC ĐỘ CHI TIẾT KHÔNG GIAN CỦA 4 TÁC VỤ</text>
<text x="25" y="324" font-size="8.8" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">• Phân loại ảnh:</text>
<text x="33" y="342" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Đầu ra:</text>
<text x="33" y="356" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Một nhãn lớp cho cả ảnh</text>
<text x="33" y="374" font-size="8.0" font-weight="600" fill="#777777" text-anchor="start" dominant-baseline="central">Đặc trưng:</text>
<text x="33" y="388" font-size="7.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Không định vị vật thể; giả định 1 đối tượng chính</text>
<text x="225" y="324" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• Phát hiện vật thể:</text>
<text x="233" y="342" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Đầu ra:</text>
<text x="233" y="356" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Danh sách hộp (x, y, w, h) + lớp</text>
<text x="233" y="374" font-size="8.0" font-weight="600" fill="#777777" text-anchor="start" dominant-baseline="central">Đặc trưng:</text>
<text x="233" y="388" font-size="7.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Trọng tâm dự án; YOLO xuất tọa độ và nhãn</text>
<text x="425" y="324" font-size="8.8" font-weight="700" fill="#7B1FA2" text-anchor="start" dominant-baseline="central">• Phân đoạn ngữ nghĩa:</text>
<text x="433" y="342" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Đầu ra:</text>
<text x="433" y="356" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Bản đồ nhãn theo pixel (H × W)</text>
<text x="433" y="374" font-size="8.0" font-weight="600" fill="#777777" text-anchor="start" dominant-baseline="central">Đặc trưng:</text>
<text x="433" y="388" font-size="7.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Gộp mọi cá thể cùng lớp thành 1 vùng màu</text>
<text x="625" y="324" font-size="8.8" font-weight="700" fill="#00796B" text-anchor="start" dominant-baseline="central">• Phân đoạn thể hiện:</text>
<text x="633" y="342" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Đầu ra:</text>
<text x="633" y="356" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">Mặt nạ pixel riêng từng cá thể</text>
<text x="633" y="374" font-size="8.0" font-weight="600" fill="#777777" text-anchor="start" dominant-baseline="central">Đặc trưng:</text>
<text x="633" y="388" font-size="7.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Phức tạp nhất; phân biệt rõ người 1 và người 2</text>
<text x="10" y="436" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: T2 D2L tr.606, tr.609, tr.648 (Chương 14.1 và 14.9); T2 YOLOv4 tr.2.</text>
