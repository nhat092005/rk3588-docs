<text x="745.5" y="216" font-size="8.0" font-weight="700" fill="#00796B" text-anchor="middle" dominant-baseline="central">Mặt nạ pixel riêng cho từng cá thể</text>
<text x="660" y="238" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phân biệt từng người 1 và người 2</text>
