<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 462" width="860" height="462" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="860" height="462" fill="white"/>
<rect x="730" y="4" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="770.3" y="15.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="12" y="18" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Thuật toán Non-Maximum Suppression (NMS) và kỹ thuật Batched NMS trên RK3588</text>
<rect x="15" y="40" width="830" height="205" rx="5" fill="#FFFFFF" stroke="#1E5BB8" stroke-width="1.3"/>
<rect x="15" y="40" width="830" height="24" rx="5" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="25" y="56" font-size="9.2" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">PHẦN 1: DIỄN BIẾN THUẬT TOÁN NMS TRÊN VÍ DỤ SỐ CỤ THỂ (HỘP A, B, C, D)</text>
<rect x="25" y="74" width="250" height="160" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="35" y="88" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Phân bố 4 hộp ứng viên ban đầu:</text>
<polygon points="45,102 125,102 125,182 45,182" fill="none" stroke="#2E7D32" stroke-width="2.0"/>
<text x="45" y="96" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">A (0.9)</text>
<polygon points="53,110 133,110 133,190 53,190" fill="none" stroke="#C62828" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="137" y="106" font-size="7.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">B (0.8)</text>
<polygon points="61,118 141,118 141,198 61,198" fill="none" stroke="#E65100" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="61" y="210" font-size="7.5" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">D (0.6)</text>
<polygon points="165,135 240,135 240,210 165,210" fill="none" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="165" y="128" font-size="7.8" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">C (0.7)</text>
<text x="35" y="225" font-size="7.4" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">IoU(A, B) = 0.68 | IoU(A, D) = 0.47 | C tách biệt</text>
<rect x="290" y="74" width="260" height="160" rx="4" fill="#FFF5F5" stroke="#C62828" stroke-width="1.2"/>
<text x="300" y="90" font-size="8.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Kịch bản 1: Ngưỡng IoU = 0.5</text>
<text x="300" y="110" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">1. Chọn A (0.9 làm cơ sở giữ lại):</text>
<text x="310" y="125" font-size="7.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">• IoU(A, B) = 0.68 &gt; 0.5 -&gt; LOẠI B!</text>
<text x="310" y="140" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• IoU(A, D) = 0.47 &lt; 0.5 -&gt; GIỮ D.</text>
<text x="300" y="160" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">2. Chọn C (0.7): IoU(C, D) = 0 -&gt; Giữ C.</text>
<text x="300" y="178" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">3. Chọn D (0.6): Không trùng ai -&gt; Giữ D.</text>
<rect x="300" y="195" width="240" height="26" rx="3" fill="#DCFCE7" stroke="#2E7D32" stroke-width="1"/>
<text x="420" y="212" font-size="8.2" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">KẾT QUẢ: GIỮ A, C, D (LOẠI B)</text>
<rect x="565" y="74" width="265" height="160" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.2"/>
<text x="575" y="90" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Kịch bản 2: Ngưỡng IoU = 0.7</text>
<text x="575" y="110" font-size="8.0" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">1. Chọn A (0.9 làm cơ sở):</text>
<text x="585" y="125" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">• IoU(A, B) = 0.68 ≤ 0.7 -&gt; KHÔNG LOẠI B!</text>
<text x="585" y="140" font-size="7.8" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• IoU(A, D) = 0.47 ≤ 0.7 -&gt; Giữ D.</text>
<text x="575" y="160" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">2. Các bước sau: Không hộp nào vượt 0.7.</text>
<text x="575" y="178" font-size="7.8" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">-&gt; Ngưỡng cao giữ lại nhiều hộp trùng hơn.</text>
<rect x="575" y="195" width="245" height="26" rx="3" fill="#FEF3C7" stroke="#E65100" stroke-width="1"/>
<text x="697" y="212" font-size="8.2" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">KẾT QUẢ: GIỮ CẢ A, B, C, D (0 LOẠI)</text>
<rect x="15" y="255" width="830" height="165" rx="6" fill="#FAFAFA" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="15" y="255" width="830" height="24" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
<text x="25" y="271" font-size="9.2" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">PHẦN 2: THỦ THUẬT BATCHED NMS TRÊN RK3588 (ai/board/common.py: boxes + cls * MAX_WH)</text>
<rect x="25" y="287" width="780" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="35" y="295" width="160" height="36" rx="3" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="115" y="309" font-size="8.0" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Lớp 0: Person</text>
<text x="115" y="323" font-size="7.2" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Tọa độ: [0 .. 640]</text>
<text x="235" y="313" font-size="8.5" font-weight="700" fill="#777777" text-anchor="middle" dominant-baseline="central">+ (1 × 7680)</text>
<rect x="280" y="295" width="160" height="36" rx="3" fill="#FEF3C7" stroke="#E65100" stroke-width="1.2"/>
<text x="360" y="309" font-size="8.0" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Lớp 1: Car</text>
<text x="360" y="323" font-size="7.2" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Tọa độ: [7680 .. 8320]</text>
<text x="480" y="313" font-size="8.5" font-weight="700" fill="#777777" text-anchor="middle" dominant-baseline="central">+ (2 × 7680)</text>
<rect x="525" y="295" width="160" height="36" rx="3" fill="#DCFCE7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="605" y="309" font-size="8.0" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Lớp 2: Motorcycle</text>
<text x="605" y="323" font-size="7.2" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central">Tọa độ: [15360 .. 16000]</text>
<text x="750" y="313" font-size="10" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">IoU ≡ 0 !</text>
<text x="25" y="353" font-size="8.8" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">LỢI ÍCH CỦA BATCHED NMS TRÊN PHẦN CỨNG BOARD:</text>
<text x="35" y="370" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">1. Chạy 1 lần duy nhất: Không cần vòng lặp for tách từng lớp bằng Python, gọi thẳng 1 hàm nms_xyxy bằng C/NumPy.</text>
<text x="35" y="385" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">2. Triệt tiêu triệt để việc triệt tiêu nhầm: Nhờ khoảng cách 7680px (MAX_WH), hộp người và hộp xe dù đè nhau trên ảnh vẫn có IoU = 0.</text>
<text x="35" y="400" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">3. Tương thích RKNN: Do Ultralytics tắt nhánh end2end khi export RKNN, Batched NMS ngoài đồ thị là giải pháp chuẩn và nhanh nhất.</text>
<text x="10" y="448" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: T2 D2L tr.619-620; T3 ai/board/common.py:22-25, 115; T1 ultralytics engine/exporter.py:682-688.</text>
</svg>