<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" height="376" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="376" fill="white"/>
<rect x="750" y="14" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="786.6" y="25.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Kỹ thuật In-place Depthwise Convolution: Cắt giảm bộ nhớ đỉnh từ 2N xuống N+1 (MCUNet)</text>
<rect x="20" y="52" width="405" height="235" rx="5" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.3"/>
<rect x="20" y="52" width="405" height="32" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="222" y="72" font-size="10.5" font-weight="700" fill="#0369A1" text-anchor="middle" dominant-baseline="central">(a) Depthwise truyền thống: Bộ nhớ đỉnh = 2N</text>
<rect x="35" y="96" width="160" height="92" rx="4" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.1"/>
<text x="115" y="112" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle" dominant-baseline="central">Input Buffer (N lát)</text>
<rect x="45" y="122" width="32" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="61" y="152" font-size="8" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_0</text>
<rect x="81" y="122" width="32" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="97" y="152" font-size="8" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_1</text>
<rect x="117" y="122" width="32" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="133" y="152" font-size="8" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_2</text>
<rect x="153" y="122" width="32" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="169" y="152" font-size="8" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_3</text>
<rect x="250" y="96" width="160" height="92" rx="4" fill="#FFFFFF" stroke="#E65100" stroke-width="1.1"/>
<text x="330" y="112" font-size="9" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Output Buffer (N lát)</text>
<rect x="260" y="122" width="32" height="54" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.0"/>
<text x="276" y="152" font-size="8" font-weight="400" fill="#E65100" text-anchor="middle" dominant-baseline="central">Out_0</text>
<rect x="296" y="122" width="32" height="54" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.0"/>
<text x="312" y="152" font-size="8" font-weight="400" fill="#E65100" text-anchor="middle" dominant-baseline="central">Out_1</text>
<rect x="332" y="122" width="32" height="54" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.0"/>
<text x="348" y="152" font-size="8" font-weight="400" fill="#E65100" text-anchor="middle" dominant-baseline="central">Out_2</text>
<rect x="368" y="122" width="32" height="54" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.0"/>
<text x="384" y="152" font-size="8" font-weight="400" fill="#E65100" text-anchor="middle" dominant-baseline="central">Out_3</text>
<path d="M195 149 L244 149" fill="none" stroke="#222222" stroke-width="3.0" marker-end="url(#m222222t)"/>
<text x="222" y="140" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">DW Conv</text>
<rect x="35" y="196" width="375" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.1"/>
<text x="222" y="212" font-size="9" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">Bộ nhớ đỉnh (Peak SRAM) = In (N) + Out (N) = 2N lát</text>
<text x="32" y="233" font-size="8.5" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">- Cả hai tensor In và Out phải tồn tại đồng thời trong SRAM.</text>
<text x="32" y="247" font-size="8.5" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">- Lãng phí lớn tại các lớp Depthwise ở tầng đầu (H, W lớn).</text>
<text x="32" y="261" font-size="8.5" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">- Dễ gây tràn bộ nhớ trên vi điều khiển hoặc NPU có SRAM nhỏ.</text>
<text x="32" y="275" font-size="8.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">- Thường là nút thắt bộ nhớ chính trong MobileNetV2 [T2 MCU tr.6].</text>
<rect x="455" y="52" width="405" height="235" rx="5" fill="#F8FAFC" stroke="#059669" stroke-width="1.3"/>
<rect x="455" y="52" width="405" height="32" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.0"/>
<text x="657" y="72" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle" dominant-baseline="central">(b) In-place Depthwise (TinyEngine): Bộ nhớ đỉnh = N + 1</text>
<rect x="471" y="96" width="216" height="92" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
<text x="579" y="112" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle" dominant-baseline="central">Shared Buffer (N lát kênh)</text>
<rect x="481" y="122" width="44" height="54" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.1"/>
<text x="503" y="146" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle" dominant-baseline="central">Out_0</text>
<text x="503" y="160" font-size="7" font-weight="400" fill="#047857" text-anchor="middle" dominant-baseline="central">(đã đè)</text>
<rect x="531" y="122" width="44" height="54" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="553" y="146" font-size="8.5" font-weight="700" fill="#B45309" text-anchor="middle" dominant-baseline="central">In_1</text>
<text x="553" y="160" font-size="7" font-weight="400" fill="#78350F" text-anchor="middle" dominant-baseline="central">(đang tính)</text>
<rect x="581" y="122" width="44" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="603" y="146" font-size="8.5" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_2</text>
<text x="603" y="160" font-size="7" font-weight="400" fill="#0284C7" text-anchor="middle" dominant-baseline="central">(chờ)</text>
<rect x="631" y="122" width="44" height="54" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.0"/>
<text x="653" y="146" font-size="8.5" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">In_3</text>
<text x="653" y="160" font-size="7" font-weight="400" fill="#0284C7" text-anchor="middle" dominant-baseline="central">(chờ)</text>
<rect x="743" y="102" width="102" height="80" rx="4" fill="#EDE7F6" stroke="#7C3AED" stroke-width="1.2"/>
<text x="794" y="122" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle" dominant-baseline="central">Aux Buffer (1 lát)</text>
<text x="794" y="138" font-size="8" font-weight="400" fill="#5B21B6" text-anchor="middle" dominant-baseline="central">1 x H x W đệm tạm</text>
<text x="794" y="154" font-size="8" font-weight="400" fill="#4527A0" text-anchor="middle" dominant-baseline="central">Chứa Out_1 tạm</text>
<path d="M687 130 L737 130" fill="none" stroke="#1E5BB8" stroke-width="3.0" marker-end="url(#m1E5BB8t)"/>
<text x="715" y="118" font-size="7.5" font-weight="400" fill="#0369A1" text-anchor="middle" dominant-baseline="central">Tính K_1</text>
<path d="M743 160 L693 160" fill="none" stroke="#2E7D32" stroke-width="3.0" marker-end="url(#m2E7D32t)"/>
<text x="715" y="174" font-size="7.5" font-weight="400" fill="#059669" text-anchor="middle" dominant-baseline="central">Ghi đè In_1</text>
<rect x="471" y="196" width="375" height="24" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.1"/>
<text x="658" y="212" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle" dominant-baseline="central">Bộ nhớ đỉnh (Peak SRAM) = Shared (N) + Aux (1) = N + 1 lát</text>
<text x="470" y="233" font-size="8.5" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">- Mỗi kênh c của Depthwise chỉ phụ thuộc duy nhất vào kênh c đầu vào.</text>
<text x="470" y="247" font-size="8.5" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">- Tính xong kênh c, In_c hết hạn -&gt; Ghi đè Out_c vào chính ô In_c.</text>
<text x="470" y="261" font-size="8.5" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">- Tiết kiệm (N-1)/2N ≈ 50% dung lượng SRAM tại các lớp Depthwise [T2 MCU tr.6].</text>
<text x="470" y="275" font-size="8.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">- Hoàn toàn bảo toàn độ chính xác toán học (Exact mathematical equivalence).</text>
<rect x="20" y="298" width="840" height="46" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="32" y="315" font-size="10" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">So sánh bộ nhớ đỉnh kích hoạt (Peak Working Memory) giữa các kiến trúc:</text>
<text x="32" y="331" font-size="8.8" font-weight="400" fill="#1E293B" text-anchor="start" dominant-baseline="central">Conv chuẩn (2N) &gt; Depthwise chuẩn (2N) &gt; In-place Depthwise (N+1). Khi N=192 kênh, bộ nhớ đỉnh giảm từ 384 lát xuống 193 lát [T2 MCU tr.6].</text>
<text x="10" y="372" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T2 Lin 2020 MCUNet tr.6] [T2 Paissan 2021 PhiNets tr.6, tr.8]</text>
</svg>