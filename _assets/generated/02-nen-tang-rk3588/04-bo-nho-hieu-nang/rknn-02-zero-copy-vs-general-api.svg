<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="432" fill="white"/>
<rect x="750" y="14" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="790.3" y="25.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="14" y="22" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Kiến trúc luân chuyển bộ nhớ: General API vs Zero-Copy API trên RK3588</text>
<rect x="18" y="44" width="415" height="345" rx="6" ry="6" fill="#FFF9F9" stroke="#DC2626" stroke-width="1.3"/>
<rect x="18" y="44" width="415" height="26" rx="6" ry="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.0"/>
<rect x="26" y="48" width="6" height="18" rx="2" ry="2" fill="#C62828" stroke="#C62828" stroke-width="1"/>
<text x="40" y="58" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="start" dominant-baseline="central">A. General API (rknn_inputs_set / rknn_outputs_get)</text>
<rect x="34" y="78" width="383" height="28" rx="3" ry="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
<text x="44" y="89" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Bộ đệm ứng dụng User (cv::Mat / Virtual RAM)</text>
<text x="44" y="99" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Dữ liệu ảnh thô (RGB FP32 hoặc UINT8)</text>
<rect x="359" y="82" width="52" height="18" rx="2" ry="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
<text x="385" y="91" font-size="7.0" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">User Space</text>
<path d="M225 106 L225 120" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<rect x="50" y="120" width="351" height="22" rx="3" ry="3" fill="#FEF2F2" stroke="#C62828" stroke-width="1.0"/>
<text x="225" y="131" font-size="7.2" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">CPU memcpy #1 + Tiền xử lý phần mềm (Chuyển kiểu/Normalize)</text>
<path d="M225 142 L225 156" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<rect x="34" y="156" width="383" height="28" rx="3" ry="3" fill="#FFFFFF" stroke="#C62828" stroke-width="1.1"/>
<text x="44" y="167" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Đệm trung gian NPU Driver (Physical DDR do Runtime cấp)</text>
<text x="44" y="177" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Vùng nhớ DMA độc lập trong Kernel</text>
<rect x="353" y="160" width="58" height="18" rx="2" ry="2" fill="#FEF2F2" stroke="#C62828" stroke-width="1.2"/>
<text x="382" y="169" font-size="7.0" font-weight="400" fill="#C62828" text-anchor="middle" dominant-baseline="central">Kernel Space</text>
<path d="M225 184 L225 198" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#m222222n)"/>
<rect x="34" y="198" width="383" height="30" rx="3" ry="3" fill="#F1F5F9" stroke="#444444" stroke-width="1.2"/>
<text x="225" y="209" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">RKNPU Core (3 Nhân 6 TOPS - 1 GHz)</text>
<text x="225" y="220" font-size="7.2" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Tính toán mảng MAC INT8; xuất tensor thô ra bộ đệm đích</text>
<path d="M225 228 L225 242" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#m222222n)"/>
<rect x="34" y="242" width="383" height="28" rx="3" ry="3" fill="#FFFFFF" stroke="#C62828" stroke-width="1.1"/>
<text x="44" y="253" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Đệm xuất NPU Driver (Physical DDR do Runtime cấp)</text>
<text x="44" y="263" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Chứa tensor đầu ra thô của NPU</text>
<path d="M225 270 L225 284" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<rect x="50" y="284" width="351" height="22" rx="3" ry="3" fill="#FEF2F2" stroke="#C62828" stroke-width="1.0"/>
<text x="225" y="295" font-size="7.2" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">CPU memcpy #2 + Hậu xử lý chuyển kiểu (INT8 → FP32)</text>
<path d="M225 306 L225 320" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<rect x="34" y="320" width="383" height="28" rx="3" ry="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
<text x="44" y="331" font-size="8.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Bộ đệm đích User (Ứng dụng nhận mảng kết quả)</text>
<text x="44" y="341" font-size="7.2" font-weight="400" fill="#DC2626" text-anchor="start" dominant-baseline="central">• Tốn 2 lần sao chép toàn phần dữ liệu qua CPU</text>
<rect x="34" y="354" width="383" height="22" rx="3" ry="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="225" y="365" font-size="7.6" font-weight="700" fill="#B91C1C" text-anchor="middle" dominant-baseline="central">Tải CPU: 50% - 80% | Độ trễ I/O: 5 - 15 ms | Tốn 2x băng thông DDR</text>
<rect x="447" y="44" width="415" height="345" rx="6" ry="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<rect x="447" y="44" width="415" height="26" rx="6" ry="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.0"/>
<rect x="455" y="48" width="6" height="18" rx="2" ry="2" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="469" y="58" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">B. Zero-Copy API (rknn_create_mem / rknn_set_io_mem)</text>
<rect x="463" y="78" width="383" height="28" rx="3" ry="3" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.1"/>
<text x="473" y="89" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">Phần cứng đầu vào: Camera ISP / RGA 2D / Bộ giải mã VPU</text>
<text x="473" y="99" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Ghi khung hình trực tiếp bằng DMA phần cứng</text>
<path d="M654 106 L654 120" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="463" y="120" width="383" height="66" rx="4" ry="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<rect x="471" y="125" width="367" height="18" rx="2" ry="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
<text x="654" y="134" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle" dominant-baseline="central">Shared Input DMA-BUF (/dev/dma_heap hoặc DRM GEM fd)</text>
<text x="475" y="153" font-size="7.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• App User: Ánh xạ con trỏ qua mmap(fd) → 0 sao chép</text>
<text x="475" y="166" font-size="7.5" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">• NPU Driver: Đăng ký fd qua rknn_set_io_mem() → 0 sao chép</text>
<text x="475" y="178" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Căn lề địa chỉ vật lý: Bội số 16 byte (stride-aligned)</text>
<path d="M654 186 L654 200" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="463" y="200" width="383" height="42" rx="3" ry="3" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.2"/>
<text x="654" y="211" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle" dominant-baseline="central">RKNPU Core (Tự động Tiền xử lý + Tính toán phần cứng)</text>
<text x="654" y="222" font-size="7.5" font-weight="400" fill="#047857" text-anchor="middle" dominant-baseline="central">Phần cứng NPU tự trừ mean, nhân scale (Quantize) on-the-fly</text>
<text x="654" y="233" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">Thực thi mạng nơ-ron hoàn toàn độc lập, không tiêu tốn chu kỳ CPU</text>
<path d="M654 242 L654 256" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="463" y="256" width="383" height="56" rx="4" ry="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
<rect x="471" y="261" width="367" height="18" rx="2" ry="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
<text x="654" y="270" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle" dominant-baseline="central">Shared Output DMA-BUF (Chia sẻ trực tiếp tới VOP / App)</text>
<text x="475" y="289" font-size="7.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• NPU xuất tensor trực tiếp vào buffer đích của bộ hiển thị VOP</text>
<text x="475" y="302" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Nếu vùng nhớ bật cache: gọi rknn_mem_sync() để đồng bộ</text>
<rect x="463" y="354" width="383" height="22" rx="3" ry="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
<text x="654" y="365" font-size="7.6" font-weight="700" fill="#047857" text-anchor="middle" dominant-baseline="central">0 lần memcpy | Tải CPU: ~0% | Độ trễ I/O: &lt; 0.2 ms | Băng thông tối ưu</text>
<text x="10" y="418" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T1 UG232 tr.64-68, Fig. 5-5, 5-6] [T1 OPL tr.335-339] [T1 rknn_api.h]</text>
</svg>