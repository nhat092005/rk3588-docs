<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="500" fill="white"/>
<rect x="750" y="14" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="790.3" y="25.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">So sánh cơ chế luân chuyển bộ nhớ: General API vs Zero-Copy API trên RK3588</text>
<rect x="20" y="46" width="415" height="358" rx="5" ry="5" fill="#FFF9F9" stroke="#C62828" stroke-width="1.3"/>
<rect x="20" y="46" width="415" height="34" rx="5" ry="5" fill="#FFFFFF" stroke="#C62828" stroke-width="1.0"/>
<rect x="30" y="53" width="8" height="20" rx="2" ry="2" fill="#C62828" stroke="#C62828" stroke-width="1"/>
<text x="46" y="63" font-size="10.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">1. General API: rknn_inputs_set / rknn_outputs_get</text>
<rect x="34" y="88" width="387" height="30" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="227" y="103" font-size="8.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">1. Bộ đệm ứng dụng User (RAM CPU / Virtual Address)</text>
<path d="M227 118 L227 148" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<text x="237" y="133" font-size="7.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">CPU memcpy (Lần 1) + CPU Normalize/Quantize</text>
<rect x="34" y="148" width="387" height="30" rx="3" ry="3" fill="#FFFFFF" stroke="#C62828" stroke-width="1.1"/>
<text x="227" y="163" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">2. NPU Input Memory (DDR do Runtime cấp riêng)</text>
<path d="M227 178 L227 196" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#m222222n)"/>
<text x="237" y="187" font-size="7.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">DMA tải từ DDR vào SRAM</text>
<rect x="34" y="196" width="387" height="34" rx="3" ry="3" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
<text x="227" y="207" font-size="8.8" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">3. NPU Core RK3588 (Thực thi mô hình INT8 / 1 GHz)</text>
<text x="227" y="221" font-size="7.5" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">Tính toán trên mảng MAC; xuất kết quả dạng tensor thô</text>
<path d="M227 230 L227 248" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#m222222n)"/>
<text x="237" y="239" font-size="7.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">DMA ghi kết quả ra DDR</text>
<rect x="34" y="248" width="387" height="30" rx="3" ry="3" fill="#FFFFFF" stroke="#C62828" stroke-width="1.1"/>
<text x="227" y="263" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">4. NPU Output Memory (DDR do Runtime cấp riêng)</text>
<path d="M227 278 L227 308" fill="none" stroke="#C62828" stroke-width="1.6" marker-end="url(#mC62828n)"/>
<text x="237" y="293" font-size="7.8" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">CPU memcpy (Lần 2) + CPU Dequantize/Layout</text>
<rect x="34" y="308" width="387" height="30" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="227" y="323" font-size="8.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">5. User Output Buffer (Ứng dụng nhận kết quả FP32)</text>
<rect x="34" y="344" width="387" height="52" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0"/>
<text x="42" y="357" font-size="8.2" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Nhược điểm hiệu năng General API (UG232 tr.64):</text>
<text x="42" y="370" font-size="7.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Tốn 2 lần CPU memcpy ở mỗi frame, gây nghẽn nhân CPU.</text>
<text x="42" y="384" font-size="7.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Tăng gấp đôi lưu lượng bus DDR do phải trung chuyển bộ đệm.</text>
<rect x="445" y="46" width="415" height="358" rx="5" ry="5" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="445" y="46" width="415" height="34" rx="5" ry="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<rect x="455" y="53" width="8" height="20" rx="2" ry="2" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="471" y="63" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">2. Zero-Copy API: rknn_create_mem / rknn_set_io_mem</text>
<rect x="459" y="88" width="387" height="48" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/>
<text x="467" y="102" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">1. Shared Input DMA-BUF (Cấp phát trước bằng DRM / DMA)</text>
<text x="467" y="116" font-size="7.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Camera ISP / Bộ giải mã phần cứng RGA ghi trực tiếp vào buffer này.</text>
<text x="467" y="128" font-size="7.8" font-weight="700" fill="#1E40AF" text-anchor="start" dominant-baseline="central">• Liên kết tức thì qua rknn_set_io_mem() | 0 lần memcpy!</text>
<path d="M652 136 L652 170" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="662" y="153" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Direct DMA Read (Đọc thẳng từ DMA-BUF)</text>
<rect x="459" y="170" width="387" height="64" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/>
<text x="652" y="184" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">2. NPU Core RK3588 (Xử lý toàn bộ trên phần cứng NPU)</text>
<text x="467" y="199" font-size="8" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Tự động trừ mean, nhân scale (Quantize) bằng phần cứng NPU.</text>
<text x="467" y="213" font-size="8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Tính toán 1024 MACs INT8 không phụ thuộc CPU.</text>
<text x="467" y="226" font-size="7.8" font-weight="400" fill="#D97706" text-anchor="start" dominant-baseline="central">• Bắt buộc input width căn lề bội số 16 byte [T1 OPL tr.335].</text>
<path d="M652 234 L652 268" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="662" y="251" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Direct DMA Write (Ghi thẳng vào DMA-BUF)</text>
<rect x="459" y="268" width="387" height="48" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/>
<text x="467" y="282" font-size="8.8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">3. Shared Output DMA-BUF (Chia sẻ trực tiếp tới VOP / App)</text>
<text x="467" y="296" font-size="7.8" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• NPU xuất tensor trực tiếp vào vùng nhớ đích của bộ hiển thị VOP.</text>
<text x="467" y="308" font-size="7.8" font-weight="400" fill="#1E40AF" text-anchor="start" dominant-baseline="central">• Nếu bộ nhớ cacheable: gọi rknn_mem_sync() để đồng bộ cache [T1].</text>
<rect x="459" y="324" width="387" height="72" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<text x="467" y="337" font-size="8.2" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Ưu thế vượt trội của Zero-Copy API (UG232 tr.64):</text>
<text x="467" y="350" font-size="7.8" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">+ Triệt tiêu 100% memcpy: Giảm tải CPU từ 50-80% xuống gần 0%.</text>
<text x="467" y="363" font-size="7.8" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">+ Tiết kiệm 50% băng thông DDR: Dữ liệu nạp thẳng từ DMA-BUF vào NPU.</text>
<text x="467" y="376" font-size="7.8" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">+ Giảm độ trễ I/O: Giảm độ trễ truyền dữ liệu từ 5-15 ms xuống &lt; 0.2 ms.</text>
<text x="467" y="388" font-size="7.8" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">+ Ràng buộc: Chỉ gọi được từ C/C++ API (Python wheel không hỗ trợ).</text>
<rect x="20" y="412" width="840" height="48" rx="4" ry="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="32" y="424" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Bản chất tối ưu hóa Zero-Copy trên Rockchip RK3588:</text>
<text x="32" y="439" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• General API tốn 2 lần CPU memcpy và chuyển đổi kiểu ở mỗi khung hình, làm nghẽn băng thông DDR và CPU.</text>
<text x="32" y="452" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Zero-Copy dùng chung DMA-BUF/DRM giữa Camera/ISP và NPU, NPU tự tiền xử lý INT8, đưa độ trễ I/O về &lt; 0.2 ms [T1 UG232 tr.64, OPL tr.335].</text>
<text x="10" y="486" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T1 UG232 tr.64-68, Fig. 5-5, 5-6] [T1 OPL tr.335-339] [T1 rknn_api.h]</text>
</svg>