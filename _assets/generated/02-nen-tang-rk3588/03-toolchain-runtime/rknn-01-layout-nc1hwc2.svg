<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 497" width="880" height="497" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="497" fill="white"/>
<rect x="750" y="14" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="790.3" y="25.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="14" y="20" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Cơ chế biến đổi định dạng Layout NC1HWC2 trên NPU Rockchip RK3588</text>
<rect x="20" y="46" width="415" height="358" rx="5" ry="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="20" y="46" width="415" height="34" rx="5" ry="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<rect x="30" y="53" width="8" height="20" rx="2" ry="2" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="1"/>
<text x="46" y="63" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">1. Biến đổi hình học: NCHW → NC1HWC2 (C2=16)</text>
<rect x="34" y="88" width="387" height="54" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="44" y="102" font-size="9" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Tensor logic NCHW: (N=1, C=13, H=4, W=4)</text>
<text x="44" y="116" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Kênh C = 13 (không chia hết cho 16)</text>
<text x="44" y="129" font-size="8" font-weight="400" fill="#DC2626" text-anchor="start" dominant-baseline="central">• Khoảng cách giữa 2 kênh cùng pixel: H × W = 16 byte (Strided Access)</text>
<path d="M150 142 L150 164" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="160" y="153" font-size="8" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Quy tắc RK3588 (INT8): C2=16, C1=⌈13/16⌉=1</text>
<rect x="34" y="164" width="387" height="116" rx="3" ry="3" fill="#FFFFFF" stroke="#1E5BB8" stroke-width="1.2"/>
<text x="44" y="178" font-size="9" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">Tensor phần cứng NC1HWC2: (1, 1, 4, 4, 16)</text>
<text x="44" y="192" font-size="8" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Thứ tự địa chỉ tăng dần: C2 → W → H → C1 → N (C2 đổi nhanh nhất)</text>
<rect x="40" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="51.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c0</text>
<rect x="62" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="73.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c1</text>
<rect x="84" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="95.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c2</text>
<rect x="106" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="117.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c3</text>
<rect x="128" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="139.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c4</text>
<rect x="150" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="161.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c5</text>
<rect x="172" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="183.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c6</text>
<rect x="194" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="205.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c7</text>
<rect x="216" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="227.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c8</text>
<rect x="238" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="249.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c9</text>
<rect x="260" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="271.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c10</text>
<rect x="282" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="293.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c11</text>
<rect x="304" y="203" width="22" height="24" rx="2" ry="2" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.0"/>
<text x="315.0" y="215.0" font-size="7.5" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c12</text>
<rect x="326" y="203" width="22" height="24" rx="2" ry="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="337.0" y="215.0" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="348" y="203" width="22" height="24" rx="2" ry="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="359.0" y="215.0" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="370" y="203" width="22" height="24" rx="2" ry="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="381.0" y="215.0" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">0</text>
<rect x="40" y="230" width="286" height="3" rx="1" ry="1" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="1"/>
<text x="183.0" y="241" font-size="7.5" font-weight="400" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">13 byte dữ liệu hợp lệ (Valid Channels)</text>
<rect x="328" y="230" width="64" height="3" rx="1" ry="1" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="359" y="241" font-size="7.5" font-weight="400" fill="#DC2626" text-anchor="middle" dominant-baseline="central">3 byte đệm</text>
<text x="227" y="256" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">→ Trọn 16 byte của cùng pixel (h, w) nằm LIỀN NHAU trong bộ nhớ RAM/SRAM</text>
<rect x="34" y="288" width="387" height="106" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="44" y="303" font-size="8.8" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Đặc tính vi kiến trúc bộ nhớ NPU RK3588:</text>
<text x="44" y="319" font-size="8.2" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">• Không phân tán: Đọc 16 kênh trong 1 chu kỳ burst bus duy nhất.</text>
<text x="44" y="334" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Định dạng riêng: NC1HWC2 là layout nội bộ chuyên biệt của RKNPU.</text>
<text x="44" y="349" font-size="8.2" font-weight="400" fill="#1E40AF" text-anchor="start" dominant-baseline="central">• Bảng quy chuẩn C2: INT8 = 16 | FP16 = 8 | INT16 = 8 [T1 UG152 tr.56].</text>
<text x="44" y="364" font-size="8.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Chip khác: RK3566/RK3568 có C2=8 (INT8) và C2=4 (FP16) [T1 UG232].</text>
<rect x="445" y="46" width="415" height="358" rx="5" ry="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.3"/>
<rect x="445" y="46" width="415" height="34" rx="5" ry="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.0"/>
<rect x="455" y="53" width="8" height="20" rx="2" ry="2" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="471" y="63" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">2. Ánh xạ phần cứng: Nạp vào 16-Lane SIMD MAC</text>
<rect x="459" y="88" width="387" height="54" rx="3" ry="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="469" y="102" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Khối CNA (Convolution Neural Accelerator) nạp dữ liệu:</text>
<text x="469" y="116" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Nạp trọn khối C2 (16 byte) vào Internal Buffer 384KB của Core NPU.</text>
<text x="469" y="129" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Trọng số (Weight) và Kích hoạt (Feature) đều căn chỉnh theo khối C2.</text>
<path d="M565 142 L565 164" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="575" y="153" font-size="8" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Nạp song song 16 byte vào mảng nhân SIMD</text>
<rect x="459" y="164" width="387" height="116" rx="3" ry="3" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.2"/>
<text x="469" y="178" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Mảng 16-Lane SIMD Multipliers (1024 MACs INT8 / Core):</text>
<rect x="469" y="194" width="82" height="34" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<text x="510.0" y="205" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Lane 0 (c0)</text>
<text x="510.0" y="218" font-size="8" font-weight="400" fill="#0F172A" text-anchor="middle" dominant-baseline="central">x_0 × w_0</text>
<rect x="561" y="194" width="82" height="34" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<text x="602.0" y="205" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Lane 1 (c1)</text>
<text x="602.0" y="218" font-size="8" font-weight="400" fill="#0F172A" text-anchor="middle" dominant-baseline="central">x_1 × w_1</text>
<text x="655" y="211" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" dominant-baseline="central">...</text>
<rect x="665" y="194" width="82" height="34" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<text x="706.0" y="205" font-size="7.8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Lane 12 (c12)</text>
<text x="706.0" y="218" font-size="8" font-weight="400" fill="#0F172A" text-anchor="middle" dominant-baseline="central">x_12 × w_12</text>
<rect x="757" y="194" width="82" height="34" rx="3" ry="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="798.0" y="205" font-size="7.8" font-weight="700" fill="#DC2626" text-anchor="middle" dominant-baseline="central">Lane 13..15</text>
<text x="798.0" y="218" font-size="8" font-weight="400" fill="#DC2626" text-anchor="middle" dominant-baseline="central">0 × 0 (Lãng phí)</text>
<path d="M652 228 L652 244" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="495" y="244" width="315" height="22" rx="3" ry="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.0"/>
<text x="652" y="255" font-size="8" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Cây cộng gom Accumulator: Psum = ∑ (x_i × w_i) trong 1 chu kỳ</text>
<rect x="459" y="288" width="387" height="106" rx="3" ry="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
<text x="469" y="303" font-size="8.8" font-weight="700" fill="#92400E" text-anchor="start" dominant-baseline="central">Khuyến nghị thiết kế mô hình từ Rockchip (UG232 mục 8.4):</text>
<text x="469" y="319" font-size="8.2" font-weight="400" fill="#166534" text-anchor="start" dominant-baseline="central">+ Kênh C chia hết cho 16/32: 100% Lane MAC tính toán, 0 byte lãng phí.</text>
<text x="469" y="334" font-size="8.2" font-weight="400" fill="#B91C1C" text-anchor="start" dominant-baseline="central">- Kênh C không chia hết: Phải nhân vô ích với 0, giảm hiệu suất tính toán.</text>
<text x="469" y="349" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Không bắt buộc: Mô hình kênh bất kỳ vẫn chạy đúng nhờ zero-padding.</text>
<text x="469" y="364" font-size="8.2" font-weight="400" fill="#92400E" text-anchor="start" dominant-baseline="central">• Tối ưu thực tế: Nên thiết kế số kênh là bội số của 16/32 để đạt đỉnh TOPS.</text>
<rect x="20" y="412" width="840" height="50" rx="4" ry="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1"/>
<text x="32" y="424" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Bản chất định dạng NC1HWC2 trên NPU RK3588:</text>
<text x="32" y="439" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Biến đổi truy cập bộ nhớ từ phân tán (strided access trên NCHW) thành truy cập cụm tuyến tính 16-byte burst.</text>
<text x="32" y="452" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Khớp hoàn hảo với chiều rộng vector bus của 3 lõi NPU (mỗi lõi đạt 1024 MACs INT8/chu kỳ tại 1 GHz) [T1 UG232, TRM1].</text>
<text x="10" y="483" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T1 UG232 tr.61, Fig. 5-1, Table 5-1] [T1 UG152 tr.56] [T1 TRM1 tr.1984-1985]</text>
</svg>