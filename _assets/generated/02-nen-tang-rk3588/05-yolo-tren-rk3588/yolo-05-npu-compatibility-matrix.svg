<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 425" width="880" height="425" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="880" height="425" fill="white"/>
<rect x="750" y="14" width="80.6" height="22" rx="11" fill="white" stroke="#1E5BB8" stroke-width="1.8"/>
<text x="790.3" y="25.5" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">T1 RK3588</text>
<text x="14" y="22" font-size="14" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ma trận tương thích toán tử phần cứng NPU Rockchip RK3588 (OPL 3.2)</text>
<rect x="14" y="44" width="274" height="350" rx="6" ry="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.3"/>
<rect x="14" y="44" width="274" height="28" rx="6" ry="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.0"/>
<text x="151.0" y="55" font-size="9.5" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="central">1. VÙNG XANH: 100% PHẦN CỨNG NPU</text>
<text x="151.0" y="67" font-size="7.5" font-weight="400" fill="#15803D" text-anchor="middle" dominant-baseline="central">Hỗ trợ 3 nhân song song | Hiệu suất tối đa</text>
<rect x="22" y="80" width="258" height="92" rx="3" ry="3" fill="white" stroke="#86EFAC" stroke-width="1.2"/>
<text x="32" y="95" font-size="8.8" font-weight="700" fill="#14532D" text-anchor="start" dominant-baseline="central">Conv 3×3 &amp; Conv 1×1 (Chuẩn)</text>
<rect x="220" y="86" width="52" height="16" rx="2" ry="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="246" y="94" font-size="7.2" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="central">Full NPU</text>
<text x="32" y="111" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tận dụng trọn mảng MAC INT8 / 3 Core</text>
<text x="32" y="124" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">• Kênh INT8: Khuyến nghị bội số của 32</text>
<text x="32" y="137" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Không phân mảnh băng thông DDR</text>
<text x="32" y="150" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Đạt đỉnh 6 TOPS trên RK3588</text>
<rect x="22" y="180" width="258" height="92" rx="3" ry="3" fill="white" stroke="#86EFAC" stroke-width="1.2"/>
<text x="32" y="195" font-size="8.8" font-weight="700" fill="#14532D" text-anchor="start" dominant-baseline="central">Hợp nhất Conv + BN + SiLU</text>
<rect x="220" y="186" width="52" height="16" rx="2" ry="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="246" y="194" font-size="7.2" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="central">Fused OP</text>
<text x="32" y="211" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tự động gộp thành 1 lệnh phần cứng</text>
<text x="32" y="224" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">• Triệt tiêu ghi tensor trung gian ra RAM</text>
<text x="32" y="237" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Tiết kiệm 40% lưu lượng bus DDR</text>
<text x="32" y="250" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Chuẩn hóa mặc định trên YOLOv8/v11</text>
<rect x="22" y="280" width="258" height="92" rx="3" ry="3" fill="white" stroke="#86EFAC" stroke-width="1.2"/>
<text x="32" y="295" font-size="8.8" font-weight="700" fill="#14532D" text-anchor="start" dominant-baseline="central">C2f / C3k2 &amp; MaxPool SPPF</text>
<rect x="220" y="286" width="52" height="16" rx="2" ry="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="246" y="294" font-size="7.2" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="central">Multi-Core</text>
<text x="32" y="311" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Phép cộng residual Add hỗ trợ 3 core</text>
<text x="32" y="324" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="start" dominant-baseline="central">• SPPF MaxPool kernel ≤ 7 chạy 100% NPU</text>
<text x="32" y="337" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Split &amp; Concat xử lý trực tiếp</text>
<text x="32" y="350" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Độ ổn định suy luận hoàn hảo</text>
<rect x="22" y="376" width="258" height="14" rx="2" ry="2" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="151.0" y="383" font-size="7.2" font-weight="700" fill="#14532D" text-anchor="middle" dominant-baseline="central">Mô hình thuần nhóm này: 0% tải CPU</text>
<rect x="303" y="44" width="274" height="350" rx="6" ry="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.3"/>
<rect x="303" y="44" width="274" height="28" rx="6" ry="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.0"/>
<text x="440.0" y="55" font-size="9.5" font-weight="700" fill="#713F12" text-anchor="middle" dominant-baseline="central">2. VÙNG VÀNG: CẦN TỐI ƯU HÓA</text>
<text x="440.0" y="67" font-size="7.5" font-weight="400" fill="#854D0E" text-anchor="middle" dominant-baseline="central">Chạy trên NPU nhưng có thể nghẽn MAC</text>
<rect x="311" y="80" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FDE047" stroke-width="1.2"/>
<text x="321" y="95" font-size="8.8" font-weight="700" fill="#713F12" text-anchor="start" dominant-baseline="central">Depthwise Conv (DWConv)</text>
<rect x="509" y="86" width="52" height="16" rx="2" ry="2" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<text x="535" y="94" font-size="7.2" font-weight="700" fill="#713F12" text-anchor="middle" dominant-baseline="central">Low MAC</text>
<text x="321" y="111" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Thiếu tái sử dụng dữ liệu chéo kênh</text>
<text x="321" y="124" font-size="7.5" font-weight="700" fill="#B45309" text-anchor="start" dominant-baseline="central">• Kênh INT8: Bắt buộc bội số 64</text>
<text x="321" y="137" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Hiệu suất tính toán MAC chỉ đạt ~30%</text>
<text x="321" y="150" font-size="7.2" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">• Khuyến nghị: Dùng Conv 3×3 tiêu chuẩn</text>
<rect x="311" y="180" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FDE047" stroke-width="1.2"/>
<text x="321" y="195" font-size="8.8" font-weight="700" fill="#713F12" text-anchor="start" dominant-baseline="central">Cơ chế chú ý (FlashAttention)</text>
<rect x="509" y="186" width="52" height="16" rx="2" ry="2" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<text x="535" y="194" font-size="7.0" font-weight="700" fill="#713F12" text-anchor="middle" dominant-baseline="central">Need Config</text>
<text x="321" y="211" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• MatMul rời rạc không có phần cứng riêng</text>
<text x="321" y="224" font-size="7.5" font-weight="700" fill="#1D4ED8" text-anchor="start" dominant-baseline="central">• Phải bật: enable_flash_attention=True</text>
<text x="321" y="237" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Hợp nhất thành op exSDPAttention</text>
<text x="321" y="250" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Giới hạn kênh channel ≤ 8,192</text>
<rect x="311" y="280" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FDE047" stroke-width="1.2"/>
<text x="321" y="295" font-size="8.8" font-weight="700" fill="#713F12" text-anchor="start" dominant-baseline="central">Phép chuyển dữ liệu &amp; Resize</text>
<rect x="509" y="286" width="52" height="16" rx="2" ry="2" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<text x="535" y="294" font-size="7.2" font-weight="700" fill="#713F12" text-anchor="middle" dominant-baseline="central">Bus Heavy</text>
<text x="321" y="311" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Concat / Split / Reshape: Tốn bus DDR</text>
<text x="321" y="324" font-size="7.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Resize: Tự chuyển sang ConvTranspose</text>
<text x="321" y="337" font-size="7.2" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">• Không có mạch nội suy phần cứng</text>
<text x="321" y="350" font-size="7.2" font-weight="400" fill="#B45309" text-anchor="start" dominant-baseline="central">• Cần tiết giảm số nhánh ghép nối</text>
<rect x="311" y="376" width="258" height="14" rx="2" ry="2" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
<text x="440.0" y="383" font-size="7.2" font-weight="700" fill="#713F12" text-anchor="middle" dominant-baseline="central">Cần cấu hình đúng để tránh rớt TOPS</text>
<rect x="592" y="44" width="274" height="350" rx="6" ry="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
<rect x="592" y="44" width="274" height="28" rx="6" ry="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.0"/>
<text x="729.0" y="55" font-size="9.5" font-weight="700" fill="#7F1D1D" text-anchor="middle" dominant-baseline="central">3. VÙNG ĐỎ: NGUY CƠ RƠI CPU (FALLBACK)</text>
<text x="729.0" y="67" font-size="7.5" font-weight="400" fill="#991B1B" text-anchor="middle" dominant-baseline="central">Thiếu nhân phần cứng | Làm sụt giảm FPS</text>
<rect x="600" y="80" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FCA5A5" stroke-width="1.2"/>
<text x="610" y="95" font-size="8.8" font-weight="700" fill="#991B1B" text-anchor="start" dominant-baseline="central">Khối DFL (Distribution Focal Loss)</text>
<rect x="798" y="86" width="52" height="16" rx="2" ry="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="824" y="94" font-size="7.2" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="central">CPU Drop</text>
<text x="610" y="111" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Reshape + Softmax + Transpose phẳng</text>
<text x="610" y="124" font-size="7.5" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">• Chiều dài 16×8400 vượt trần NPU</text>
<text x="610" y="137" font-size="7.2" font-weight="400" fill="#DC2626" text-anchor="start" dominant-baseline="central">• Bị đẩy ngược về chạy trên nhân CPU</text>
<text x="610" y="150" font-size="7.2" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">• Giải pháp: Bỏ DFL, dùng direct reg</text>
<rect x="600" y="180" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FCA5A5" stroke-width="1.2"/>
<text x="610" y="195" font-size="8.8" font-weight="700" fill="#991B1B" text-anchor="start" dominant-baseline="central">End-to-End NMS (TopK / Sort)</text>
<rect x="798" y="186" width="52" height="16" rx="2" ry="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="824" y="194" font-size="7.2" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="central">No NPU Op</text>
<text x="610" y="211" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• NPU không có mạch so sánh / sắp xếp động</text>
<text x="610" y="224" font-size="7.5" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">• OPL 3.2 thiếu TopK &amp; GatherElements</text>
<text x="610" y="237" font-size="7.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Exporter ép tắt: model.end2end=False</text>
<text x="610" y="250" font-size="7.2" font-weight="400" fill="#15803D" text-anchor="start" dominant-baseline="central">• Giải pháp: Viết NMS C++ NEON riêng</text>
<rect x="600" y="280" width="258" height="92" rx="3" ry="3" fill="white" stroke="#FCA5A5" stroke-width="1.2"/>
<text x="610" y="295" font-size="8.8" font-weight="700" fill="#991B1B" text-anchor="start" dominant-baseline="central">Toán tử logic &amp; Kiểu int64</text>
<rect x="798" y="286" width="52" height="16" rx="2" ry="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="824" y="294" font-size="7.0" font-weight="700" fill="#991B1B" text-anchor="middle" dominant-baseline="central">Unsupported</text>
<text x="610" y="311" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Ép kiểu int64: NPU hoàn toàn không có</text>
<text x="610" y="324" font-size="7.5" font-weight="700" fill="#B91C1C" text-anchor="start" dominant-baseline="central">• Equal, Mod, ReduceMax chỉ có trên CPU</text>
<text x="610" y="337" font-size="7.2" font-weight="400" fill="#DC2626" text-anchor="start" dominant-baseline="central">• Làm đứt gãy luồng thực thi đồ thị</text>
<text x="610" y="350" font-size="7.2" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="central">• Phải chuyển sang int32 / float32</text>
<rect x="600" y="376" width="258" height="14" rx="2" ry="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
<text x="729.0" y="383" font-size="7.2" font-weight="700" fill="#7F1D1D" text-anchor="middle" dominant-baseline="central">Triệt tiêu toán tử đỏ để bảo toàn FPS</text>
<text x="10" y="411" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">[T1 OPL tr.56-107, tr.320-333] [T1 UG232 tr.140-150] [T1 ULT engine/exporter.py:682-688]</text>
</svg>