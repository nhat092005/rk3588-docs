<text x="328.562" y="208" font-size="8.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Trung bình mAP = 0.5908</text>
<polygon points="526,129 540,129 536,124 544,129 536,134 540,129" fill="#444444" stroke="#444444" stroke-width="1.5"/>
<rect x="548" y="38" width="342" height="182" rx="5" fill="#FCFDFD" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="562" y="52" font-size="10.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Công thức và Giá trị mAP tổng thể</text>
<rect x="558" y="64" width="322" height="52" rx="4" fill="#EAF2FF" stroke="#90CAF9" stroke-width="1.0"/>
<text x="719.0" y="78" font-size="10.5" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">mAP = (1 / C) × Σ AP_c</tspan></text>
<text x="719.0" y="98" font-size="8.0" font-weight="400" fill="#444444" text-anchor="middle" dominant-baseline="central" font-style="italic">mAP = (AP_1 + AP_2 + AP_3 + AP_4 + AP_5) / 5 = 0.5908</text>
<text x="562" y="130.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Thước đo toàn diện: </tspan><tspan>Đại diện sức mạnh chung của mạng AI.</tspan></text>
<text x="562" y="144.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Kháng mất cân bằng lớp: </tspan><tspan>Mỗi lớp có trọng số ngang nhau,</tspan></text>
<text x="562" y="159.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  không bị lớp có nhiều ảnh lấn át lớp hiếm gặp.</tspan></text>
<text x="562" y="173.5" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Cảnh báo lớp yếu: </tspan><tspan>Lớp head (38.8%) kéo tụt mAP chung,</tspan></text>
<text x="562" y="188.0" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan>  chỉ ra điểm nghẽn cần bổ sung thêm dữ liệu huấn luyện.</tspan></text>
<text x="10" y="244" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: REPO ai/automation/leaderboards/sfchd_5class.csv; Ultralytics YOLOv8n.</text>
