<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="900" height="280" fill="white"/>
<rect x="770" y="10" width="73.2" height="22" rx="11" fill="white" stroke="#2E7D32" stroke-width="1.8"/>
<text x="806.6" y="21.5" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">T2 chung</text>
<text x="10" y="22" font-size="13.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Bộ nhớ Động (Activations) và Nút thắt Băng thông SRAM / DDR trên RK3588</text>
<rect x="10" y="38" width="440" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="24" y="54" font-size="10.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">1. So sánh: Parameters (Bộ nhớ tĩnh) vs Activations (Bộ nhớ động)</text>
<rect x="22" y="64" width="416" height="60" rx="4" fill="#E1F5FE" stroke="#90CAF9" stroke-width="1.0"/>
<text x="30" y="79" font-size="8.5" font-weight="700" fill="#1E5BB8" text-anchor="start" dominant-baseline="central">A. Parameters (Trọng số tĩnh - nạp 1 lần từ Flash vào RAM)</text>
<text x="30" y="96" font-size="8.0" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Định mức: </tspan><tspan>YOLOv8n có 3.2M tham số = </tspan><tspan font-weight="700">3.2 MB (INT8)</tspan><tspan> hoặc </tspan><tspan font-weight="700">12.8 MB (FP32)</tspan></text>
<text x="30" y="112" font-size="7.5" font-weight="400" fill="#555555" text-anchor="start" dominant-baseline="central">• Đặc tính: Bất biến. Đưa ảnh 320x320 hay 1280x1280 thì weights vẫn 3.2 MB.</text>
<rect x="22" y="130" width="416" height="98" rx="4" fill="#FFF3E0" stroke="#FFE0B2" stroke-width="1.0"/>
<text x="30" y="145" font-size="8.5" font-weight="700" fill="#E65100" text-anchor="start" dominant-baseline="central">B. Activations (Feature Maps trung gian - sinh ra &amp; hủy theo từng layer)</text>
<text x="30" y="161" font-size="8.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">• Công thức: Batch × C × H × W (Tỷ lệ thuận theo diện tích ảnh H × W)</text>
<rect x="30" y="172" width="126" height="46" rx="3" fill="white" stroke="#A5D6A7" stroke-width="1.0"/>
<text x="93.0" y="186" font-size="7.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Ảnh 320 × 320</text>
<text x="93.0" y="200" font-size="9.0" font-weight="700" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Đỉnh ~15 MB</text>
<text x="93.0" y="212" font-size="7.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Nhẹ, an toàn SRAM</text>
<rect x="164" y="172" width="126" height="46" rx="3" fill="white" stroke="#FFCC80" stroke-width="1.0"/>
<text x="227.0" y="186" font-size="7.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Ảnh 640 × 640</text>
<text x="227.0" y="200" font-size="9.0" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Đỉnh ~60 MB (x4)</text>
<text x="227.0" y="212" font-size="7.0" font-weight="400" fill="#555555" text-anchor="middle" dominant-baseline="central">Chuẩn phổ biến</text>
<rect x="298" y="172" width="126" height="46" rx="3" fill="white" stroke="#EF9A9A" stroke-width="1.0"/>
<text x="361.0" y="186" font-size="7.5" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">Ảnh 1280 × 1280</text>
<text x="361.0" y="200" font-size="9.0" font-weight="700" fill="#C62828" text-anchor="middle" dominant-baseline="central">Đỉnh ~240 MB (x16)</text>
<text x="361.0" y="212" font-size="7.0" font-weight="400" fill="#C62828" text-anchor="middle" dominant-baseline="central">Nguy cơ nghẽn DDR</text>
<rect x="460" y="38" width="430" height="200" rx="5" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.0"/>
<text x="474" y="54" font-size="10.0" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">2. Tác động Phần cứng: Nút thắt SRAM vs DDR trên SoC RK3588</text>
<rect x="472" y="64" width="406" height="66" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.0"/>
<text x="480" y="79" font-size="8.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">Kịch bản 1: Activation ≤ Dung lượng SRAM (Tối ưu tuyệt đối)</text>
<text x="480" y="95" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Dữ liệu giữ trọn trong SRAM nội bộ lõi NPU (On-chip Cache Hit).</text>
<text x="480" y="109" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Băng thông siêu tốc nội bộ (hàng trăm GB/s), độ trễ 0 ns, tiêu hao điện rất thấp.</text>
<text x="480" y="122" font-size="7.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">-&gt; NPU đạt hiệu suất tính toán tối đa (6 TOPS trên 3 core).</text>
<rect x="472" y="136" width="406" height="66" rx="4" fill="#FFEBEE" stroke="#FFCDD2" stroke-width="1.0"/>
<text x="480" y="151" font-size="8.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">Kịch bản 2: Activation &gt; Dung lượng SRAM (Tràn ra RAM ngoài)</text>
<text x="480" y="167" font-size="8.0" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• NPU buộc phải đọc/ghi trung gian qua Bus DDR ngoài (Spill-to-DRAM).</text>
<text x="480" y="181" font-size="7.5" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central">• Tiêu hao điện năng gấp 10 - 50 lần, gây nóng chip và nghẽn băng thông bus.</text>
<text x="480" y="194" font-size="7.5" font-weight="700" fill="#C62828" text-anchor="start" dominant-baseline="central">-&gt; Xuất hiện nút thắt bộ nhớ (Memory Wall), kéo tụt FPS thực tế.</text>
<rect x="472" y="208" width="406" height="22" rx="3" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="480" y="222" font-size="7.5" fill="#444444" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">• Giải pháp RKNN Compiler: </tspan><tspan>Operator Fusion &amp; Tiling để cắt nhỏ feature map, ép giữ trong SRAM.</tspan></text>
<text x="10" y="266" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: Rockchip RK3588 TRM; Chen et al. Eyeriss ISCA 2016; Lin et al. MCUNet 2020.</text>
</svg>