<text x="562" y="52" font-size="10" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Phần giao nhau (Intersection ∩)</text>
<rect x="10" y="68" width="275" height="175" rx="4" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="147.5" y="84" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">1. Trùng khít cao (Rất tốt)</text>
