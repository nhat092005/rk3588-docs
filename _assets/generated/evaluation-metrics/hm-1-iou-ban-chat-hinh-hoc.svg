<text x="10" y="22" font-size="14.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Bản chất Hình học của IoU (Intersection over Union)</text>
<line x1="20" y1="52" x2="45" y2="52" stroke="#E65100" stroke-width="2.0" stroke-dasharray="6 3"/>
<text x="50" y="52" font-size="10" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Nhãn thực tế (Ground Truth B_gt)</text>
<line x1="280" y1="52" x2="305" y2="52" stroke="#1E5BB8" stroke-width="2.0"/>
<text x="310" y="52" font-size="10" font-weight="600" fill="#444444" text-anchor="start" dominant-baseline="central">Dự đoán mô hình (Prediction B_p)</text>
