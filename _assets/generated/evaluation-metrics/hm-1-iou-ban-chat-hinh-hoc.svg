<rect x="50" y="104" width="95" height="75" fill="none" stroke="#E65100" stroke-width="2.2" stroke-dasharray="6 3"/>
<rect x="56" y="110" width="95" height="75" fill="none" stroke="#1E5BB8" stroke-width="2.2"/>
<text x="147.5" y="215" font-size="13" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">IoU = 0.88</text>
<text x="147.5" y="231" font-size="11" font-weight="600" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Đạt chuẩn mọi mốc IoU</text>
<rect x="310" y="68" width="275" height="175" rx="4" fill="#FCFDFD" stroke="#CFD8DC" stroke-width="1.0"/>
<text x="447.5" y="84" font-size="11" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">2. Trùng khớp vừa (Ngưỡng cơ bản)</text>
