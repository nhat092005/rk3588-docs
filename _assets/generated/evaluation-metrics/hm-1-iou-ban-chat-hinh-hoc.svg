<rect x="650" y="104" width="95" height="75" fill="none" stroke="#E65100" stroke-width="2.2" stroke-dasharray="6 3"/>
<rect x="705" y="128" width="95" height="75" fill="none" stroke="#1E5BB8" stroke-width="2.2"/>
<text x="747.5" y="215" font-size="13" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">IoU = 0.16</text>
<text x="747.5" y="231" font-size="11" font-weight="600" fill="#C62828" text-anchor="middle" dominant-baseline="central">Phán đoán sai vị trí (FP)</text>
<rect x="10" y="254" width="880" height="32" rx="4" fill="#EAF2FF" stroke="#90CAF9" stroke-width="1.0"/>
<text x="20" y="264" font-size="10" fill="#222222" text-anchor="start" dominant-baseline="central" xml:space="preserve"><tspan font-weight="700">Công thức tính IoU: </tspan><tspan font-weight="700">IoU = Diện tích vùng giao (B_p ∩ B_gt) / Diện tích vùng hợp (B_p ∪ B_gt)</tspan><tspan>  |  Miền giá trị: [0.0 (không chạm) đến 1.0 (trùng khít hoàn toàn)]</tspan></text>
<text x="10" y="310" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: REPO ai/automation/leaderboards/sfchd_5class.csv; Y6 tr.8.</text>
