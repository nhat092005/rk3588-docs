<rect x="350" y="104" width="95" height="75" fill="none" stroke="#E65100" stroke-width="2.2" stroke-dasharray="6 3"/>
<rect x="378" y="128" width="95" height="75" fill="none" stroke="#1E5BB8" stroke-width="2.2"/>
<text x="447.5" y="215" font-size="13" font-weight="700" fill="#444444" text-anchor="middle" dominant-baseline="central">IoU = 0.52</text>
<text x="447.5" y="231" font-size="11" font-weight="600" fill="#E65100" text-anchor="middle" dominant-baseline="central">Đạt mAP50, trượt mAP75 trở lên</text>
