<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 644" width="1040" height="644" font-family="'Times New Roman', Times, serif"><defs><marker id="m1E5BB8n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m1E5BB8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#1E5BB8"/></marker><marker id="m2E7D32n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="m2E7D32t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#2E7D32"/></marker><marker id="mC62828n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="mC62828t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#C62828"/></marker><marker id="m777777n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m777777t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#777777"/></marker><marker id="m222222n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker><marker id="m222222t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" fill="#222222"/></marker></defs><rect width="1040" height="644" fill="white"/>
<text x="14" y="20" font-size="15" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Ba khối cơ sở: Conv, Bottleneck và C2f (ví dụ số lấy từ L6, ảnh vào 640×640)</text>
<rect x="18" y="40" width="250" height="565" rx="5" fill="#F8FAFC" stroke="#1E5BB8" stroke-width="1.3"/>
<rect x="28" y="50" width="120" height="22" rx="3" fill="#1E5BB8" stroke="#1E5BB8" stroke-width="1"/>
<text x="88.0" y="61" font-size="12" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">(a) Conv</text>
<text x="143.0" y="90" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu vào C_in×H×W</text>
<path d="M143 100 L143 118" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="43" y="118" width="200" height="50" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="143.0" y="135" font-size="13" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">Conv2d</text>
<text x="143.0" y="153" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">bias=False, padding = k//2</text>
<path d="M143 168 L143 186" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="43" y="186" width="200" height="50" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.3"/>
<text x="143.0" y="203" font-size="13" font-weight="700" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">BatchNorm2d</text>
<text x="143.0" y="221" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">eps=0.001, momentum=0.03</text>
<path d="M143 236 L143 254" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="43" y="254" width="200" height="50" rx="4" fill="#FFF7ED" stroke="#E65100" stroke-width="1.3"/>
<text x="143.0" y="271" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">SiLU</text>
<text x="143.0" y="289" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">x · sigmoid(x)</text>
<path d="M143 304 L143 322" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="143.0" y="334" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu ra C_out×H&#x27;×W&#x27;</text>
<text x="32" y="368" font-size="12.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Số tham số của một Conv</text>
<text x="32" y="390" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">k² · C_in · C_out  (Conv2d, không bias)</text>
<text x="32" y="410" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">+ 2 · C_out  (gamma và beta của BN)</text>
<text x="32" y="438" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Ví dụ L0: 3×3×3×16 = 432</text>
<text x="32" y="458" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">         + 2×16 = 32  →  464</text>
<text x="32" y="494" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Tham số BN khác (mean, var)</text>
<text x="32" y="512" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">là buffer, không tính vào 464.</text>
<text x="32" y="548" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Mọi Conv trong v8n dùng SiLU</text>
<text x="32" y="566" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">(kể cả cv1 của SPPF, gán lại</text>
<text x="32" y="584" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">ở ultralytics/nn/tasks.py:2194).</text>
<rect x="282" y="40" width="250" height="565" rx="5" fill="#F8FAFC" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="292" y="50" width="150" height="22" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="367.0" y="61" font-size="12" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">(b) Bottleneck</text>
<text x="387.0" y="90" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu vào c×H×W</text>
<path d="M387 100 L387 118" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="307" y="118" width="170" height="56" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="387.0" y="135" font-size="12" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">cv1: Conv 3×3, s1</text>
<text x="387.0" y="154" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">c → c (e=1.0 trong C2f)</text>
<path d="M387 174 L387 192" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="307" y="192" width="170" height="56" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="387.0" y="209" font-size="12" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">cv2: Conv 3×3, s1</text>
<text x="387.0" y="228" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">c → c</text>
<path d="M387 248 L387 276" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<circle cx="387.0" cy="288" r="12" fill="white" stroke="#E65100" stroke-width="1.5"/>
<text x="387.0" y="288" font-size="16" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">+</text>
<path d="M387 300 L387 322" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="387.0" y="334" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu ra c×H×W</text>
<path d="M387 108 L497 108 L497 288 L399 288" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m2E7D32n)"/>
<text x="482" y="98" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="end" dominant-baseline="central">shortcut</text>
<text x="296" y="370" font-size="12" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Cộng tắt chỉ khi shortcut=True</text>
<text x="296" y="390" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">và C_in == C_out (block.py:480).</text>
<text x="296" y="420" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Backbone (L2, L4, L6, L8):</text>
<text x="296" y="438" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">shortcut = True, có cộng tắt.</text>
<text x="296" y="462" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">Neck (L12, L15, L18, L21):</text>
<text x="296" y="480" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">shortcut = False, không cộng tắt.</text>
<text x="296" y="516" font-size="11.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Tham số khi c = 64 (L6):</text>
<text x="296" y="536" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">2 × (36 992) = 73 984</text>
<text x="296" y="556" font-size="10.5" font-weight="400" fill="#777777" text-anchor="start" dominant-baseline="central">Mỗi Conv 3×3: 64·64·9 + 2·64 = 36 992</text>
<rect x="546" y="40" width="476" height="565" rx="5" fill="#F6FBF7" stroke="#2E7D32" stroke-width="1.3"/>
<rect x="556" y="50" width="200" height="22" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/>
<text x="656.0" y="61" font-size="12" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">(c) C2f, ví dụ L6</text>
<text x="764" y="61" font-size="11" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">C_in = C_out = 128, n = 2, c = 64, lưới 40×40</text>
<text x="676" y="92" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu vào 128×40×40</text>
<path d="M676 102 L676 118" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="571" y="118" width="210" height="44" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="676" y="134" font-size="12" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">cv1: Conv 1×1</text>
<text x="676" y="151" font-size="11" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">128 → 2c = 128</text>
<path d="M676 162 L676 180" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="571" y="180" width="210" height="34" rx="4" fill="#FFF7ED" stroke="#E65100" stroke-width="1.3"/>
<text x="676" y="197" font-size="11.5" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">chunk(2, dim=1) → y0, y1</text>
<path d="M616 214 L616 232 L574 232 L574 438 L600 438" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="580" y="246" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">y0: 64×40×40</text>
<path d="M731 214 L731 250" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="738" y="228" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">y1: 64×40×40</text>
<path d="M731 242 L656 242 L656 426" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<rect x="671" y="250" width="120" height="50" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.3"/>
<text x="731" y="266" font-size="12" font-weight="700" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Bottleneck 1</text>
<text x="731" y="285" font-size="11" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">64 → 64 → 64</text>
<path d="M731 300 L731 336" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="671" y="336" width="120" height="50" rx="4" fill="#F0FDF4" stroke="#2E7D32" stroke-width="1.3"/>
<text x="731" y="352" font-size="12" font-weight="700" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Bottleneck 2</text>
<text x="731" y="371" font-size="11" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">64 → 64 → 64</text>
<path d="M791 275 L826 275 L826 426" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="834" y="340" font-size="11" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">b1</text>
<path d="M791 361 L804 361 L804 426" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#m2E7D32n)"/>
<text x="766" y="405" font-size="11" font-weight="700" fill="#2E7D32" text-anchor="start" dominant-baseline="central">b2</text>
<rect x="600" y="426" width="244" height="40" rx="4" fill="#FFF7ED" stroke="#E65100" stroke-width="1.3"/>
<text x="722" y="441" font-size="12" font-weight="700" fill="#E65100" text-anchor="middle" dominant-baseline="central">Concat (y0, y1, b1, b2)</text>
<text x="722" y="457" font-size="10.5" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">(2+n)·c = 4 × 64 = 256 kênh</text>
<path d="M722 466 L722 490" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<rect x="622" y="490" width="200" height="44" rx="4" fill="#EFF6FF" stroke="#1E5BB8" stroke-width="1.3"/>
<text x="722" y="506" font-size="12" font-weight="700" fill="#1E5BB8" text-anchor="middle" dominant-baseline="central">cv2: Conv 1×1</text>
<text x="722" y="523" font-size="11" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">256 → 128</text>
<path d="M722 534 L722 554" fill="none" stroke="#1E5BB8" stroke-width="1.6" marker-end="url(#m1E5BB8n)"/>
<text x="722" y="566" font-size="12" font-weight="400" fill="#222222" text-anchor="middle" dominant-baseline="central">Đầu ra 128×40×40</text>
<text x="862" y="280" font-size="12.5" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Tham số L6</text>
<text x="862" y="304" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">cv1 1×1</text>
<text x="1002" y="304" font-size="11.5" font-weight="400" fill="#222222" text-anchor="end" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">16 640</text>
<text x="862" y="324" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">2 Bottleneck</text>
<text x="1002" y="324" font-size="11.5" font-weight="400" fill="#222222" text-anchor="end" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">147 968</text>
<text x="862" y="344" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">cv2 1×1</text>
<text x="1002" y="344" font-size="11.5" font-weight="400" fill="#222222" text-anchor="end" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">33 024</text>
<line x1="862" y1="364" x2="1002" y2="364" stroke="#777777" stroke-width="1"/>
<text x="862" y="378" font-size="11.5" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="central">Tổng</text>
<text x="1002" y="378" font-size="11.5" font-weight="700" fill="#222222" text-anchor="end" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">197 632</text>
<text x="862" y="410" font-size="11.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central">GFLOPs (2 × MACs):</text>
<text x="1002" y="428" font-size="12" font-weight="700" fill="#222222" text-anchor="end" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">0.629</text>
<text x="862" y="468" font-size="11" font-weight="700" fill="#444444" text-anchor="start" dominant-baseline="central">Công thức tổng quát:</text>
<text x="862" y="486" font-size="10.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">c = C_out/2</text>
<text x="862" y="502" font-size="10.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">cv1: C_in → 2c</text>
<text x="862" y="518" font-size="10.5" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', monospace">cv2: (2+n)c → C_out</text>
<text x="10" y="630" font-size="12" font-weight="400" fill="#444444" text-anchor="start" dominant-baseline="central" font-style="italic">Nguồn: ultralytics 8.4.154 nn/modules/block.py (C2f dòng 291-315, Bottleneck dòng 460-484), conv.py (Conv dòng 39-78).</text>
